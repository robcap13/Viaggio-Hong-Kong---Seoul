  places:[
    {n:"[9:30] Oryukdo Skywalk", d:"<b>Il nome: cinque o sei isole</b><br>Oryukdo significa letteralmente cinque o sei isole, un nome che nasce da un fenomeno legato alla marea: due delle formazioni rocciose, Bangpaeseom e Solseom, sono unite alla base ma separate in superficie, così che con la bassa marea appaiono come un'unica isola, mentre con l'alta marea l'acqua le separa visivamente in due, facendo apparire l'intero gruppo ora di cinque, ora di sei isole. Le sei formazioni, nell'ordine dalla costa verso il mare, sono Bangpaeseom, Solseom, Suriseom, Songgotseom, Gulseom e Deungdaeseom, quest'ultima sede di un faro costruito nel 1937 a guida delle navi dirette al porto di Busan.<br><br><b>Come si sono formate</b><br>Le isole fanno parte del Geoparco Nazionale di Busan e sono il risultato di processi vulcanici risalenti a circa 80 milioni di anni fa, che hanno dato origine alle scogliere quasi verticali e alle piattaforme rocciose che caratterizzano ancora oggi il paesaggio. L'area è stata dichiarata monumento naturale nazionale numero 24 nel 2007, dopo essere già stata riconosciuta come sito storico e panoramico di Busan fin dal 1972.<br><br><b>Da zona militare a parco pubblico</b><br>Fino al 1993 l'area di Oryukdo era una zona militare chiusa al pubblico, utilizzata per scopi di difesa costiera. Solo dopo la sua apertura è stata progressivamente trasformata nel parco panoramico che visitiamo oggi, con lo skywalk di vetro inaugurato nel 2013: una passerella a sbalzo lunga 15 metri, sospesa a circa 35 metri sul livello del mare, che permette di guardare le onde infrangersi direttamente sotto i piedi attraverso il pavimento trasparente.<br><br><b>Cosa troveremo</b><br>Oltre allo skywalk, il sito comprende Oryukdo Sunrise Park, punto di partenza del lunghissimo sentiero costiero Haeparang (770 km, il più lungo della Corea del Sud, che arriva fino alla provincia di Gangwon), e un piccolo molo chiamato Haenyeochon, dove le haenyeo, le pescatrici subacquee tradizionali, vendono il pescato fresco della giornata in un piccolo mercato informale.", img:"Oryukdo Skywalk.jpg", tip:"L'ingresso è gratuito e lo skywalk è aperto indicativamente dalle 9:00 alle 18:00 (fino alle 19:00 nei mesi estivi), ma può chiudere in caso di vento forte o pioggia. Ai piedi dello skywalk vengono fornite delle soprascarpe per proteggere il pavimento di vetro. Le ore migliori per la luce sono la mattina presto o il tardo pomeriggio."},
    {n:"[10:30] Igidae Coastal Trail", d:"<b>Il nome: la platea delle due gisaeng</b><br>Igidae significa letteralmente la platea delle due gisaeng, e il nome racconta una delle leggende più toccanti legate alla Guerra Imjin, l'invasione giapponese della Corea del 1592. Si narra che, dopo la conquista della fortezza di Suyeongseong da parte delle truppe giapponesi, i comandanti nemici organizzarono un banchetto per celebrare la vittoria proprio su queste scogliere, facendosi accompagnare da alcune gisaeng, le tradizionali intrattenitrici della dinastia Joseon. Due di loro afferrarono un generale giapponese ubriaco e si gettarono con lui in mare dalla scogliera, sacrificando la propria vita in un gesto di resistenza contro l'invasore. Nel 2013 sono state ritrovate nella zona quelle che si ritiene siano le tombe delle due donne.<br><br><b>Da zona militare a parco naturale</b><br>Come Oryukdo, anche quest'area fu per decenni una zona militare chiusa al pubblico, utilizzata per scopi di sorveglianza costiera, e lungo il percorso sono ancora visibili alcune vecchie postazioni di guardia. Il parco è stato aperto ufficialmente nel 1993, mentre il sentiero vero e proprio, oggi molto amato dagli abitanti di Busan, è diventato un percorso escursionistico organizzato a partire dal 2005.<br><br><b>Il paesaggio geologico</b><br>Igidae fa parte dello stesso geoparco nazionale di Oryukdo, ed è famoso per le sue formazioni rocciose modellate nei millenni da onde e vento, tra cui spiccano Nongbawi, una roccia in equilibrio precario sulla scogliera, e Chimabawi, un'ampia piattaforma di roccia liscia che si protende verso il mare. Il sentiero, lungo circa 4,7 km, collega Oryukdo Skywalk a Dongsaengmal, passando per punti panoramici come Igidae Eoulmadang, da cui si gode di una bella vista sul ponte Gwangan e sullo skyline di Haeundae.", img:"Igidae Coastal Trail.jpg", tip:"Il percorso completo richiede circa 2-2,5 ore a passo tranquillo; nel nostro caso ne percorreremo solo un tratto per poi dirigerci verso il pranzo. Consigliamo scarpe comode da cammino, dato che alcuni tratti sono sconnessi o con leggeri saliscendi, e di portare acqua, dato che lungo il sentiero ci sono pochi punti di ristoro.", move:"Partenza alle 13:00 verso il Mercato di Bujeon (circa 20 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 부산진구 중앙대로755번길 21"},
    {n:"[13:30] Pranzo: Mercato di Bujeon e Seomyeon", d:"Ci fermeremo qui per pranzo.<br><br><b>Bujeon Market: nato dai profughi della guerra</b><br>Il mercato di Bujeon è nato subito dopo la fine della guerra di Corea (1950-1953), quando profughi arrivati da ogni parte del paese si stabilirono nella zona e diedero vita a un mercato di sussistenza per sopravvivere nel dopoguerra. A differenza di Gukje Market o Jagalchi, rimasti nel tempo più orientati al turismo, Bujeon è rimasto un mercato quasi esclusivamente frequentato dagli abitanti della città: qui si respira davvero la vita quotidiana di Busan, senza insegne o percorsi pensati per i visitatori.<br><br><b>Cosa troveremo</b><br>Il mercato è oggi coperto da una struttura con cupola di vetro, che permette di visitarlo con qualsiasi condizione meteo, ed è organizzato in diverse sezioni tra cui un mercato del pesce (uno dei due principali di Busan insieme a Jagalchi), un'area dedicata al ginseng e persino un piccolo distretto di elettronica. È inoltre sede dello stabilimento principale di un noto marchio di eomuk (polpette di pasta di pesce), uno dei piatti più identitari di tutta la città. Tra i banchi più celebri ci sono anche quelli di dwaeji gukbap, la zuppa di riso con maiale tipica di Busan, e di kalguksu (tagliatelle in brodo) e gimbap giganti, molto amati dai residenti.<br><br><b>Il legame con Seomyeon</b><br>Il mercato si trova a pochi minuti a piedi sia dalla stazione di Bujeon sia da quella di Seomyeon, ed è cresciuto insieme al quartiere, diventando negli anni un contraltare più genuino e popolare rispetto all'anima commerciale e patinata che Seomyeon ha assunto nel tempo, come principale polo commerciale della città.", img:"Mercato di Bujeon e Seomyeon.jpg", tip:"Essendo un mercato molto vivo e frequentato soprattutto dai residenti, è normale essere urtati o dover farsi largo tra i banchi: fa parte dell'esperienza. È aperto generalmente dalle 6:00 alle 19:00, ed essendo un mercato del pesce vivo, capita di incontrare crostacei e molluschi ancora vivi nei secchi, quindi è un'informazione utile se qualcuno del gruppo fosse sensibile alla cosa. Bastano 30-45 minuti per un giro completo, prima di dedicarsi a Seomyeon vero e proprio.", move:"Partenza alle 14:50 verso Seomyeon (circa 5 min a piedi).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 부산진구 중앙대로 730"},
    {n:"[15:00] Seomyeon", d:"<b>Da villaggio a cuore commerciale della città</b><br>Seomyeon, il cui nome significa letteralmente lato ovest, si trova nel distretto di Busanjin-gu ed è cresciuta da un piccolo villaggio dell'epoca Joseon fino a diventare, a metà del XX secolo, un importante polo industriale: qui sorsero numerose fabbriche e aziende, tra cui i predecessori delle attuali Samsung e LG, favorite dalla vicinanza sia alla ferrovia sia al porto di Busan. Negli anni '70 l'area divenne particolarmente frequentata da lavoratori pendolari, oltre che da studenti universitari, grazie anche ai teatri e alle vie dello shopping che iniziarono a svilupparsi.<br><br><b>La svolta commerciale</b><br>A partire dagli anni '80 le fabbriche vennero progressivamente spostate verso la periferia della città, mentre nell'area cominciarono ad aprire centri commerciali, banche e uffici, consolidando il ruolo di Seomyeon come principale centro commerciale di Busan, un ruolo che mantiene tuttora. Oggi la stazione di Seomyeon è il principale snodo di interscambio tra le linee 1 e 2 della metropolitana cittadina, ed è collegata direttamente ai grandi magazzini Lotte e a un vasto centro commerciale sotterraneo, aperto negli anni '80 come uno dei primi del suo genere in città.<br><br><b>Cosa troveremo</b><br>Il quartiere si divide idealmente in due anime: il lato ovest, più legato allo shopping tradizionale, ai grandi magazzini e alla vita notturna, e il lato est, noto come Seomyeon 2-ga, più orientato ai giovani, con boutique, ristoranti e insegne luminose che di sera animano l'intera area.", img:"Seomyeon.jpg", tip:"Seomyeon è comoda per una pausa shopping o per curiosare tra il centro commerciale sotterraneo e le vie principali. Essendo il centro nevralgico della città, è facilmente raggiungibile da quasi ogni altra zona di Busan tramite la metropolitana.", move:"Partenza alle 15:50 verso Jeonpo Cafe Street (circa 10 min a piedi).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 부산진구 동천로 92"},
    {n:"[16:00] Jeonpo Cafe Street", d:"In zona abbiamo individuato Strut Coffee, dove fermarci per uno spuntino.<br><br><b>Da quartiere di ferramenta a polo creativo</b><br>Fino a poco più di un decennio fa, quella che oggi è conosciuta come Jeonpo Cafe Street era un anonimo quartiere di piccole officine e negozi di ferramenta, dove contrattisti e artigiani si rifornivano di attrezzi, chiodi e materiali da costruzione. A partire dal 2009-2010, giovani imprenditori iniziarono a rilevare questi spazi industriali dismessi, approfittando degli affitti bassi e del fascino grezzo degli ambienti, trasformandoli gradualmente in caffè, gallerie e piccoli locali dal design ricercato.<br><br><b>Il riconoscimento internazionale</b><br>La svolta definitiva è arrivata quando il quartiere è stato inserito dal New York Times tra le destinazioni di viaggio più interessanti al mondo, prima nel 2017 e poi di nuovo nel 2021 tra i 52 luoghi da visitare assolutamente: un riconoscimento che ha reso Jeonpo una tappa fissa negli itinerari di chi visita Busan, oltre che un caso di studio di rigenerazione urbana riuscita.<br><br><b>Cosa troveremo</b><br>Oggi l'area conta decine di caffè, gallerie, boutique e piccoli ristoranti, ricavati spesso in vecchi edifici industriali o abitazioni ristrutturate, con vicoli stretti e irregolari che mantengono comunque un'atmosfera più tranquilla rispetto alla vicina Seomyeon. Lungo la via principale si trovano ormai anche diverse catene (come Starbucks), mentre i locali più originali e caratteristici si sono spostati verso i vicoli laterali, quindi vale la pena allontanarsi un po' dal percorso più battuto. Ogni ottobre si tiene inoltre il Jeonpo Cafe Street Festival, un evento che anima ulteriormente il quartiere con musica ed eventi a tema.", img:"Jeonpo Cafe Street.jpg", tip:"Essendo composta da vicoli stretti, conviene arrivare a piedi da Seomyeon (circa 10 minuti) piuttosto che in auto, dato che i parcheggi sono limitati. È una buona zona anche per un dolce o un caffè dopo cena, prima di rientrare in hotel per la notte.", move:"Partenza alle 17:40 verso Dakbatgol Mural Village (circa 20 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 서구 동대신동2가 87-218"},
    {n:"[18:00] Dakbatgol Mural Village", d:"<b>Il nome: i campi di gelso della carta</b><br>Dakbatgol prende il nome da dak, il gelso da carta, e bat, campo: il toponimo ricorda gli antichi campi di questa pianta che un tempo prosperavano nella zona, la cui corteccia veniva raccolta e lavorata per produrre lo hanji, la tradizionale carta coreana. Il villaggio sorge sotto Mangyang-ro, una delle strade panoramiche di mezza costa più caratteristiche di Busan, nel distretto di Seo-gu.<br><br><b>Le origini: un quartiere nato dalla tragedia</b><br>L'insediamento risale al 1953, anno in cui un grande incendio devastò l'area attorno alla stazione di Busan: molte delle famiglie che persero la casa in quell'evento si trasferirono sulle colline circostanti, dando origine a diversi villaggi informali, tra cui proprio Dakbatgol. Ancora oggi la comunità celebra un festival locale, nato come cerimonia dangsan per scongiurare il ripetersi di incendi, poi trasformato nel tempo in una festa di quartiere più ampia.<br><br><b>Da quartiere popolare a villaggio di murales</b><br>La trasformazione artistica del villaggio è arrivata nel 2010, quando l'artista Koo Bon-ho, sulla scia di altri progetti simili avviati in città (primo fra tutti quello del villaggio di Amidong), coinvolse i residenti in un progetto di arte pubblica condivisa, dipingendo case, muri e scalinate con murales organizzati attorno a sei temi diversi. Tra le opere più originali ci sono alcuni murales realizzati con bottiglie di vetro di soju e birra riciclate, diventati uno dei tratti distintivi del villaggio.<br><br><b>La scalinata dei desideri</b><br>Il cuore simbolico del villaggio è la scalinata di 192 gradini, conosciuta come Scalinata della Speranza (o dei desideri): secondo una credenza locale, salirla o scenderla porterebbe fortuna ed esaudirebbe i desideri di chi lo fa. Per agevolare gli spostamenti dei residenti più anziani lungo la ripida collina, è stata inoltre installata una piccola monorotaia locale, pensata principalmente per uso residenziale ma che i visitatori possono talvolta provare, se non ci sono abitanti in attesa.<br><br><b>Cosa troveremo</b><br>Passeggiando tra i vicoli si incontrano scalinate colorate, piccoli spazi espositivi che raccontano la storia del quartiere e del distretto di Dong-gu, e un piccolo caffè, il Dakbatgol Book Café, unico punto di ristoro della zona, con un'area esterna particolarmente fotogenica. In primavera i ciliegi in fiore lungo la scalinata regalano una delle vedute più suggestive del villaggio, rendendolo anche una meta meno nota ma apprezzata per l'hanami locale.", img:"Dakbatgol Mural Village.jpg", tip:"Essendo un quartiere collinare e ancora abitato, conviene indossare scarpe comode e mantenere un atteggiamento rispettoso verso i residenti, come per Gamcheon. È molto meno turistico rispetto a Gamcheon Culture Village, quindi è una buona alternativa se cercate un'atmosfera più autentica e tranquilla, con meno folla. Bastano circa 1-1,5 ore per esplorarlo con calma.", move:"Partenza alle 19:15 verso Bupyeong Kkangtong Market (circa 15 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 중구 부평1길 48"},
    {n:"[19:30] Cena: Bupyeong Kkangtong Market", d:"<b>Una storia lunga oltre un secolo</b><br>Il mercato di Bupyeong ha radici sorprendentemente antiche: già nel 1910 fu designato come primo mercato pubblico della Corea aperto tutto l'anno, fatta eccezione per il Capodanno lunare, in un periodo in cui la maggior parte dei mercati coreani apriva solo in giorni prestabiliti del mese. Con la crescita della popolazione di Busan, il mercato fu ampliato notevolmente nel 1922, arrivando a contare, secondo le fonti storiche, oltre 500 negozi e circa 20.000 visitatori al giorno già negli anni '40.<br><br><b>Il nome: il mercato delle lattine</b><br>Il soprannome Kkangtong, che significa letteralmente lattina di latta, risale al periodo successivo alla guerra di Corea (1950-1953), quando i profughi che si stabilirono nella zona iniziarono a vendere soprattutto beni in scatola provenienti dalle basi militari americane, come conserve alimentari e altri surplus bellici. Per la varietà a volte stravagante della merce in vendita, il mercato guadagnò anche il soprannome informale di mercato dei goblin. Negli anni '70-'80 divenne inoltre un punto di riferimento per la vendita di prodotti giapponesi di importazione, come i primi walkman, distribuiti da qui in tutto il paese.<br><br><b>Il primo mercato notturno permanente della Corea</b><br>La svolta più recente risale al 29 ottobre 2013, quando il mercato ha inaugurato il primo mercato notturno permanente di tutta la Corea del Sud, ispirandosi al celebre Shilin Night Market di Taiwan. L'iniziativa ha avuto un tale successo da fare da apripista per la nascita di mercati notturni simili in numerose altre città del paese, diventando uno dei principali biglietti da visita di Busan.<br><br><b>Cosa troveremo</b><br>Di giorno il mercato mantiene la sua anima più tradizionale, con banchi di frutta, verdura, carne, pesce e banchali (i contorni coreani), oltre ad abbigliamento e prodotti per la casa, il tutto sotto un tetto trasparente che protegge dalle intemperie. Dalle 19:30 in poi, lungo la stretta via centrale di circa 110 metri si accendono invece decine di bancarelle di street food: tteokbokki, spiedini di pollo, samgyeop-mari (involtini di pancia di maiale), frutta candita tanghulu, polpette al cannello ricoperte di formaggio filante e persino piatti internazionali come kebab e okonomiyaki, a testimonianza di un mercato che nel tempo si è aperto anche a influenze straniere.", img:"Bupyeong Kkangtong Market.jpg", tip:"<b>Cibi tipici</b><br>Tteokbokki — gnocchi di riso piccanti in salsa di gochujang, qui in versione casereccia.<br>Hotteok — pancake dolce con zucchero, cannella e semi di girasole, cotto su piastra.<br>Eomuk — qui disponibile sia in brodo caldo che grigliato al barbecue.<br>Cibo internazionale — presente ma sempre rivisitato in chiave coreana.<br><br>Essendo attaccato a Gukje Market, molti finiscono per visitarli come un unico percorso. Il mercato notturno è aperto tutti i giorni dalle 19:30 fino a mezzanotte circa (il mercato diurno chiude prima, verso sera), ed essendo molto affollato, soprattutto nei weekend, non ci sono quasi mai posti a sedere: capita spesso di vedere le persone mangiare in piedi lungo la via. Conviene portare contanti, perché non tutti i banchi accettano carte."}

  places:[
    {n:"[5:00] Tempio Haedong Yonggungsa", d:"La sveglia oggi sarà all'alba per andare a vedere il Tempio Haedong Yonggungsa. Avendo dovuto anticipare l'Haeundae Blueline Park, non avremo opzioni alternative per visitare il tempio in altri momenti della giornata, a meno che qualcuno non preferisca rinunciare a parte del tempo di mare per andarci in mattinata e svegliarsi così più tardi.<br><br><b>Un tempio nato da un sogno</b><br>Secondo la tradizione del tempio, le sue origini risalgono al 1376, quando il monaco Naong Hyegeun, consigliere del re Gongmin durante la dinastia Goryeo, fece un sogno in cui gli apparve il dio del mare dell'Est. La divinità gli disse che, se avesse costruito un tempio sul monte Bongnae, proprio in quel punto, il regno sarebbe diventato più grande e stabile. Naong individuò così questo tratto di costa e vi fondò il tempio, inizialmente chiamato Bomunsa.<br><br><b>Distruzione e rinascita</b><br>Il tempio originale fu raso al suolo nel 1592 durante la Guerra Imjin, l'invasione giapponese della Corea, e rimase in stato di abbandono per oltre trecento anni. Fu ricostruito solo negli anni '30 del Novecento, ad opera del monaco Ungang del tempio di Tongdosa, con ulteriori ampliamenti realizzati negli anni '70 e nei primi anni 2000. Il nome attuale, Haedong Yonggungsa, che significa Tempio del Palazzo del Drago a est del mare, gli fu attribuito ufficialmente solo nel 1974.<br><br><b>Una storia non priva di dibattito</b><br>Vale la pena sapere che l'effettiva antichità del tempio è oggetto di una certa disputa storiografica: mentre la tradizione del tempio sostiene la fondazione trecentesca, alcuni giornali locali e ricerche storiche hanno sollevato dubbi, sostenendo che l'edificio attuale sia in realtà una costruzione sostanzialmente moderna, risalente proprio agli anni '30-'70. Al di là della disputa sulla data esatta, ciò che è certo è che si tratta di uno dei pochissimi templi buddisti coreani costruito direttamente sulla costa, invece che tra le montagne come da tradizione.<br><br><b>Perché è un luogo speciale nella tradizione buddista coreana</b><br>Haedong Yonggungsa è considerato uno dei tre templi coreani dedicati alla dea della misericordia, ed è il tempio più vicino al mare di tutta la Corea. Secondo la credenza popolare, chi vi prega con sincerità può veder esaudito un desiderio, il che lo rende meta di pellegrinaggio per chi cerca fortuna, prosperità o la nascita di un figlio maschio, a cui è dedicata una statua specifica, il Deuknam-bul.<br><br><b>Cosa troveremo</b><br>Il percorso di accesso, fiancheggiato da bancarelle di street food e souvenir, conduce a un ingresso decorato con le statue dei dodici animali dello zodiaco cinese, prima di scendere lungo la scalinata dei 108 gradini della longevità, un numero che nel buddismo rappresenta le 108 afflizioni terrene da superare per raggiungere l'illuminazione. Da qui si attraversa il ponte Yongmun-gyo, dove è tradizione lanciare monete sotto l'arco per buona fortuna, prima di arrivare al cuore del complesso: la sala principale Daeungjeon, la pagoda a sette piani e l'imponente statua del Buddha Haesu Gwaneum, la Bodhisattva della Compassione, che domina la scogliera con vista sul mare aperto.", img:"Tempio Haedong Yonggungsa.jpg", tip:"L'ingresso è gratuito. Il tempio è molto affollato durante il giorno, specialmente nei weekend, quindi chi vuole vederlo con più tranquillità, o assistere all'alba sul mare, può considerare di arrivare presto la mattina. Essendo costruito su una scogliera con molte scale, non è la scelta più comoda per chi ha difficoltà motorie. Mettete in conto circa 1-1,5 ore per la visita completa, incluso il tempo per il percorso di accesso.", move:"Partenza alle 08:10 verso Haeundae Blueline Park (circa 20 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산 해운대구 달맞이길62번길 13"},
    {n:"[8:30] Haeundae Blueline Park e Cheongsapo Daritdol Skywalk", d:"<b>Da linea ferroviaria dismessa a parco turistico</b><br>L'intero parco nasce dalla riconversione ecologica di un tratto della Donghae Nambu Line, una linea ferroviaria costiera ormai in disuso che collegava Haeundae a Songjeong. Il progetto ha trasformato 4,8 km di ex sedime ferroviario, da Mipo a Cheongsapo fino a Songjeong, in un percorso turistico aperto al pubblico nell'ottobre 2020, diventando uno degli esempi più riusciti di riqualificazione di infrastrutture dismesse in tutta la Corea del Sud.<br><br><b>Due modi di percorrerlo</b><br>Il parco offre due esperienze distinte lungo lo stesso tracciato: la Haeundae Sky Capsule, una cabina panoramica a quattro posti che scorre per 2 km a 7-10 metri di altezza sul livello del mare, tra Mipo e Cheongsapo, e la Haeundae Beach Train, un trenino turistico a batteria (il primo del suo genere al mondo) che percorre l'intero tracciato di 4,8 km da Mipo a Songjeong passando per Cheongsapo, fermandosi in diverse stazioni e punti panoramici lungo il percorso, tra cui il celebre Dalmaji Tunnel, conosciuto anche come tunnel della luce lunare per la sua illuminazione colorata.<br><br><b>Cheongsapo: un antico villaggio di pescatori</b><br>Cheongsapo è un piccolo e caratteristico villaggio di pescatori lungo il percorso, oggi famoso anche per un passaggio a livello proprio di fronte alla stazione, diventato virale sui social perché ricorda molto da vicino una scena iconica dell'anime giapponese Slam Dunk, trasformandosi in uno dei punti fotografici più cercati dai visitatori più giovani. Il piccolo porto è inoltre riconoscibile per i suoi due fari gemelli, uno rosso e uno bianco, ai due estremi del molo.<br><br><b>Cheongsapo Daritdol Skywalk</b><br>Aperto nell'agosto 2017, lo skywalk si trova proprio a Cheongsapo ed è lungo 72,5 metri, sospeso a 20 metri sul livello del mare. È stato progettato a forma di drago blu, lo spirito guardiano tradizionalmente associato al villaggio di Cheongsapo secondo le credenze popolari locali, con la sezione terminale dotata di pavimento in vetro trasparente per un'esperienza ancora più suggestiva sospesa sull'acqua. Il nome Daritdol deriva da cinque scogli vicino al porto, che nella tradizione locale ricordavano delle pietre disposte come i gradini di un ponte.<br><br><b>Cosa troveremo</b><br>Lungo il percorso si incontrano diversi punti panoramici, tra cui l'osservatorio Haeundae Sea Sound (o Badassori Gallery), il piccolo villaggio di pescatori di Gudeokpo e diversi ristoranti di vongole grigliate e frutti di mare proprio a Cheongsapo, oltre a caffè come il Diart Coffee, apprezzato per la vista sul porto.", img:"Haeundae Blueline Park e Cheongsapo Daritdol Skywalk.jpg", tip:"I biglietti per la Sky Capsule vanno spesso esauriti in anticipo nei weekend e in alta stagione, quindi conviene prenotarli online con un po' di anticipo; il trenino Beach Train è invece più economico e generalmente più facile da trovare disponibile. Molti visitatori scelgono di fare la tratta di andata in capsula o treno e tornare a piedi lungo la stessa costa, così da vedere con calma entrambi gli skywalk incontrati lungo il percorso — il che si presta bene anche a tornare verso la spiaggia di Haeundae. Il periodo migliore per la visita è la primavera o l'autunno, mentre per lo skywalk di Cheongsapo il tardo pomeriggio, verso il tramonto, resta il momento più suggestivo."},
    {n:"[10:00] Spiaggia di Haeundae", d:"Passeremo il resto della mattinata e buona parte del pomeriggio in spiaggia, o comunque in prossimità di essa. Bisogna quindi attrezzarsi con il vestiario e lo zaino opportuno.<br><br><b>Il nome: mare e nuvole</b><br>Il nome Haeundae ha origini letterarie che risalgono a oltre mille anni fa: si deve allo studioso e poeta Choi Chi-won, vissuto nel IX secolo durante la dinastia Silla unificata, il cui nome letterario era proprio Haeun, che significa mare e nuvole. Si racconta che, durante uno dei suoi viaggi lungo la costa meridionale della penisola coreana, Choi Chi-won rimase talmente affascinato dalla vista che si godeva dalla collina di Dongbaekseom da incidere il proprio nome letterario su una roccia del promontorio, un'iscrizione che secondo la tradizione esiste ancora oggi. Lo stesso studioso diede il nome anche ad altri luoghi della costa meridionale coreana, come Cheongnyongdae e Mollundae.<br><br><b>Da villaggio di pescatori a spiaggia più famosa della Corea</b><br>Per secoli Haeundae rimase un tranquillo villaggio di pescatori e agricoltori, ai margini del principale porto di Busan. Lo sviluppo turistico dell'area cominciò a prendere forma nei primi decenni del XX secolo, legato inizialmente anche alla fama delle sorgenti termali locali, note fin dall'epoca Silla per le loro proprietà curative, per poi consolidarsi definitivamente nella seconda metà del Novecento, di pari passo con la modernizzazione della Corea del Sud e l'apertura del paese al turismo internazionale.<br><br><b>Un pezzo di cultura popolare coreana</b><br>Haeundae è protagonista anche di uno dei brani più rappresentativi della musica popolare di Busan, la canzone Torna al Porto di Busan (Doraowayo Busanhange), che racconta la nostalgia di chi, negli anni '60, lasciò la Corea in cerca di migliori opportunità di lavoro, guardando ai gabbiani sul porto in attesa di un fratello mai tornato. Una scultura con il testo della canzone si trova ancora oggi lungo la spiaggia. Più di recente, Haeundae è stata anche set cinematografico e televisivo, comparendo in produzioni come il film catastrofico Haeundae (2009) e in K-drama di successo internazionale come My Love from the Star.<br><br><b>Cosa troveremo</b><br>La spiaggia si estende per circa 1,5 km, con una sabbia fine chiara e un fondale poco profondo adatto alla balneazione, ed è oggi circondata da uno skyline di grattacieli, hotel di lusso e locali che la rendono una delle immagini più riconoscibili di tutta la Corea del Sud. D'estate accoglie oltre 10 milioni di visitatori, con ombrelloni organizzati e bagnini lungo tutto l'arenile. Ogni estate ospita inoltre il celebre Haeundae Sand Festival, con enormi sculture di sabbia realizzate da artisti provenienti da tutto il mondo.", img:"Spiaggia di Haeundae.jpg", tip:"Essendo la spiaggia più affollata della Corea, se cercate un po' di tranquillità conviene andarci presto la mattina o al tramonto. La zona è ben collegata dalla metro (linea 2, stazione Haeundae), ed essendo circondata da molte delle tappe già viste in questi giorni (Dongbaek Park, Busan X the Sky, Blueline Park), è un ottimo punto da cui organizzare gran parte della giornata a Haeundae.", move:"Il pranzo da Ribs of Legend è praticamente sulla spiaggia, non serve un vero spostamento.<br><b>Indirizzo per Naver:</b><br><br>부산광역시 해운대구 해운대해변로 277"},
    {n:"[13:30] Pranzo: Ribs of Legend Haeundae", d:"Pranzeremo in un ristorante in zona: al momento quello individuato è Ribs of Legend Haeundae. Altrimenti un altro BBQ con buone recensioni è 규우정. Un'altra opzione è Yulling, un po' più elegante, sempre a base di carne, ma con recensioni non altrettanto buone.", img:"Ribs of Legend Haeundae.jpg", tip:"", move:"Dongbaek Park è praticamente attaccato alla spiaggia, non serve un vero spostamento.<br><b>Indirizzo per Naver:</b><br><br>부산광역시 해운대구 동백로 67"},
    {n:"[15:00] Dongbaek Park (Dongbaekseom)", d:"Per chi si fosse annoiato di stare in spiaggia, è possibile fare una passeggiata al Dongbaek Park; è praticamente attaccato alla spiaggia. Altrimenti possiamo spostarci altrove per un pò di tempo libero.<br><br><b>Il nome: l'isola delle camelie</b><br>Dongbaekseom significa letteralmente isola delle camelie, da dongbaek, il nome coreano di questa pianta dai fiori rossi, e seom, isola. In origine si trattava davvero di un'isola separata dalla terraferma, ma nel corso dei secoli l'accumulo naturale di sabbia e sedimenti ha creato una lingua di terra che l'ha collegata stabilmente alla costa di Haeundae, pur mantenendo ancora oggi il nome e l'identità di isola. Da gennaio ad aprile le camelie fioriscono in tutto il parco, regalando un contrasto rosso acceso con il verde dei pini neri che ricoprono la maggior parte della superficie.<br><br><b>La leggenda della Principessa Hwangok</b><br>Lungo il sentiero costiero si incontra la statua di una sirena, dedicata alla Principessa Hwangok, un personaggio tratto dal Samguk yusa, un'antica raccolta di memorie e leggende dei Tre Regni di Corea. Si narra che la principessa provenisse da Naranda, un regno mitico oltre il mare, e fosse stata data in sposa a un re straniero, il re Eunhye. Sopraffatta dalla nostalgia per la sua terra natale, la principessa era solita, ad ogni luna piena, guardare il riflesso della patria lontana in una perla di topazio ricevuta dalla nonna, l'unico oggetto capace di consolare il suo dolore. La statua attuale, alta 2,5 metri, fu installata nel 1974, danneggiata da un tifone nel 1987 e successivamente restaurata mantenendo solo la parte superiore originale.<br><br><b>La Nurimaru APEC House</b><br>Sulla punta dell'isola sorge la Nurimaru APEC House, costruita appositamente per ospitare il vertice APEC (Cooperazione Economica Asia-Pacifico) del 2005, che riunì i leader di 21 economie della regione, incluso l'allora presidente statunitense George W. Bush. L'edificio, progettato in stile jeongja, il tradizionale padiglione coreano, reinterpretato con linee moderne e ampie vetrate, ospita ancora oggi la sala principale con il tavolo rotondo originale attorno a cui sedettero i capi di stato, oltre a fotografie e oggetti legati all'evento.<br><br><b>Cosa troveremo</b><br>Il sentiero costiero che circonda l'isola, lungo circa 950 metri, è percorribile in 30-40 minuti a passo tranquillo e regala una delle viste più belle su tutta Haeundae Beach, oltre a un faro panoramico da cui si vedono il ponte Gwangan e, nelle giornate più limpide, le isole di Oryukdo. Lungo il percorso si incontra anche una stele con incisa una poesia dello studioso Choi Chi-won, che secondo la tradizione soggiornò proprio su quest'isola. Il parco è inoltre uno dei punti migliori per ammirare il tramonto, con la Nurimaru APEC House e il faro che si stagliano contro la luce del cielo.", img:"Dongbaek Park.jpg", tip:"L'ingresso al parco è gratuito e il percorso è illuminato anche di sera, rendendolo una delle passeggiate serali più suggestive di Haeundae, con vista sulle luci notturne della spiaggia e del ponte Gwangan. Da qui è comodo proseguire a piedi fino a The Bay 101, un'area con caffè e ristoranti affacciati sul porticciolo turistico, per un aperitivo con vista sull'acqua.", move:"Partenza alle 16:40 verso Busan X the Sky (circa 20 min — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 해운대구 달맞이길 30"},
    {n:"[18:30] Busan X the Sky", d:"<b>Un grattacielo nato in tempi record</b><br>Busan X the Sky si trova negli ultimi piani della Haeundae LCT Landmark Tower, il grattacielo più alto di Busan e il secondo più alto di tutta la Corea del Sud, dopo la Lotte World Tower di Seoul. La costruzione della torre iniziò nell'ottobre 2013 e si concluse nel novembre 2019, raggiungendo un'altezza di 411,6 metri su 101 piani. Fa parte di un complesso più ampio, che comprende anche altre due torri residenziali, rispettivamente terza e quarta più alte della Corea. L'osservatorio, che occupa gli ultimi tre piani della torre (dal 98° al 100°), ha aperto al pubblico il 17 luglio 2020, diventando rapidamente uno dei simboli della nuova skyline di Busan.<br><br><b>Il più grande osservatorio della Corea del Sud</b><br>Al di là dell'altezza della torre in sé, Busan X the Sky è oggi la piattaforma panoramica più estesa di tutto il paese, con una vista che nelle giornate più limpide arriva a scorgere persino l'isola giapponese di Tsushima, oltre 50 km al largo della costa. L'ascensore ad alta velocità, chiamato Sky Cruise, impiega appena 58 secondi per portare i visitatori fino in cima, con le pareti rivestite da schermi LED che simulano un'immersione nelle profondità marine durante la salita.<br><br><b>Cosa troveremo</b><br>Al 100° piano si trova la sezione più spettacolare, chiamata Shocking Bridge, un tratto di pavimento in vetro trasparente sospeso nel vuoto, da cui si vede Haeundae Beach direttamente sotto i piedi. L'osservatorio ospita inoltre zone fotografiche interattive, installazioni digitali e persino lo Starbucks più alto del mondo, oltre a un ristorante panoramico al 99° piano. Di sera, sui vetri dell'osservatorio vengono proiettati due spettacoli di luci a tema, chiamati Sky X Show e Sky Wave Show, entrambi replicati più volte dopo il tramonto.<br><br><b>Cosa si vede dall'alto</b><br>Dalla terrazza si gode di una vista a 360 gradi che spazia da Haeundae Beach all'isolotto di Dongbaekseom, dal ponte Gwangan alla scogliera di Igidae, fino allo skyline di Centum City e alle montagne che circondano la città: probabilmente il punto di osservazione più completo su tutta Busan.", img:"Busan X the Sky.jpg", tip:"Il momento migliore per la visita è il tardo pomeriggio, così da vedere la città sia in piena luce sia mentre si accendono le luci notturne dopo il tramonto. I biglietti, che si aggirano sui 27.000 won per gli adulti, possono essere acquistati online in anticipo per risparmiare tempo in coda. È raggiungibile a piedi in circa 15 minuti dalla stazione della metro di Haeundae (linea 2, uscita 3), oppure in taxi.", move:"Partenza alle 18:30 verso BAO HAUS (circa 30 min — stima di massima, Haeundae è piuttosto distante da Seomyeon).<br><b>Indirizzo per Naver:</b><br><br>부산진구 서전로38번길 62-9"},
    {n:"[19:30] Cena: BAO HAUS", d:"Per cena siamo liberi di spostarci dove preferiamo, ma nel caso esiste questo BAO HAUS vicino all'albergo che non sembra male, anche se dovrebbe essere cucina taiwanese. Chiude alle 20:00 quindi bisogna valutare che ora si sarà fatta.", img:"Bao Haus.jpg", tip:"Locale piccolo e senza prenotazioni: mettete in conto una possibile attesa in piedi nei momenti di punta."}

  places:[
    {n:"[8:30] Colazione: Choi Yeonghwa Bakery", d:"Prima di iniziare le visite ci fermeremo ad assaggiare il pane di fagioli rossi di Gyeongju.<br><br><b>Le origini</b><br>Il dolce nasce nel 1939 (secondo alcune fonti nel 1937 o 1938, con qualche discrepanza tra le versioni tramandate) per mano di Choi Yeong-hwa, all'epoca ventunenne, discendente di una famiglia di Gyeongju con una lunga tradizione nella preparazione di dolci di riso ripieni di fagioli rossi, tramandata di generazione in generazione. Partendo proprio da quella ricetta di famiglia, Choi vi aggiunse un proprio tocco personale, dando vita, dopo diversi tentativi, al dolce che oggi porta il nome del quartiere in cui nacque, Hwangnam-dong: da qui il nome hwangnam-ppang, comunemente chiamato anche gyeongju-ppang, cioè pane di Gyeongju.<br><br><b>Un'eredità di famiglia, e qualche rivalità</b><br>Alla morte di Choi Yeong-hwa (1917-1995), l'attività si è divisa tra i discendenti: oggi esistono due negozi diretti eredi della ricetta originale gestiti da rami diversi della stessa famiglia, Choi Yeonghwa Bakery, gestito dal nipote maggiore, e Hwangnam Bread, gestito da un altro ramo familiare, oltre a un marchio distinto, Lee Sangbok Myeonggwa, aperto da un allievo diretto a cui Choi in persona aveva concesso il permesso di usare il nome. Nel tempo sono nate decine di imitazioni in tutta la città, ma solo questi marchi discendono direttamente dalla ricetta e dalla famiglia originarie, e il negozio storico si è spostato nella sede attuale nel 1974, dopo importanti scavi archeologici nella vicina area di Daereungwon che interessarono anche la zona del negozio originale.<br><br><b>Il dolce</b><br>Hwangnam-ppang è un piccolo dolce dal guscio sottile e leggermente croccante, ripieno quasi interamente di pasta di fagioli rossi coltivati in Corea, preparato ancora oggi senza dolcificanti artificiali né conservanti. Una caratteristica distintiva è la decorazione superficiale, un delicato motivo a pettine ispirato all'estetica del periodo Silla, la stessa dinastia a cui risalgono molti dei monumenti storici di Gyeongju che visiteremo.", img:"Choi Yeonghwa Bakery.jpg", tip:"", move:"Partenza verso Seokguram (taxi, circa 15-20 min).<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 석굴로 238"},
    {n:"[9:00] Grotta di Seokguram", d:"<b>Un santuario artificiale, non una vera grotta</b><br>Nonostante il nome, Seokguram non è una cavità naturale ma un vero e proprio santuario artificiale, costruito interamente in blocchi di granito estratti dalla stessa montagna su cui sorge, il monte Tohamsan, e poi ricoperti di terra per simulare l'aspetto di una grotta scavata nella roccia. È una scelta costruttiva piuttosto insolita: mentre in India, Asia centrale e Cina i santuari buddisti di questo tipo venivano tipicamente scavati direttamente nella roccia naturale, in Corea se ne realizzarono pochissimi, e questo è considerato il capolavoro assoluto tra quelli sopravvissuti. Il nome originale del sito era infatti Seokbulsa, che significa Tempio del Buddha di Pietra.<br><br><b>Un unico grande progetto con Bulguksa</b><br>La costruzione della grotta fu avviata dallo stesso Kim Dae-seong che incontreremo anche a Bulguksa, a partire dal 742 o dal 751 a seconda delle fonti, e fu completata nel 774, poco dopo la sua morte, quando l'opera fu portata a termine sotto la supervisione della famiglia reale di Silla. Secondo la leggenda più diffusa, Kim Dae-seong fece costruire Bulguksa in memoria dei genitori della sua vita presente e Seokguram in memoria dei genitori di una sua vita passata, un gesto che nella cultura Silla dell'epoca era considerato capace di generare merito spirituale trasferibile ai propri cari defunti. Alcuni studiosi moderni hanno anche ipotizzato una possibile componente politica dietro il progetto: la statua del Buddha, infatti, guarda esattamente in direzione della tomba sottomarina del re Munmu, il primo sovrano della Silla Unificata, e verso il punto in cui sorge il sole nel giorno del solstizio d'inverno, un allineamento che potrebbe indicare anche un intento di legittimazione della dinastia regnante.<br><br><b>La grande statua del Buddha</b><br>Al centro della camera principale, sotto una cupola in pietra a forma emisferica, siede la monumentale statua del Buddha Sakyamuni, rivolta verso il mare a Est, con la mano sinistra nella posizione di meditazione (dhyana mudra) e la destra rivolta verso il basso, nella posizione che simboleggia il momento dell'illuminazione (bhumisparsha mudra). Attorno alla statua principale, le pareti della camera sono decorate con bassorilievi raffiguranti bodhisattva, divinità guardiane e discepoli, tra cui spicca la celebre immagine di Avalokitesvara, il bodhisattva della compassione dalle undici teste, considerata tra le sculture più raffinate di tutta l'arte buddista dell'Asia orientale.<br><br><b>Riscoperta e restauro</b><br>Dopo secoli di abbandono e degrado, la grotta fu riportata all'attenzione generale nei primi anni del Novecento, secondo un racconto tramandato grazie a un portalettere che, sorpreso da un temporale lungo il sentiero di montagna, si sarebbe rifugiato casualmente al suo interno. Nel corso del XX secolo la grotta è stata sottoposta a diversi interventi di restauro, incluso l'inserimento di una parete di vetro a protezione dell'ingresso, necessaria per controllare l'umidità e preservare le delicate sculture in pietra: da allora i visitatori possono osservare l'interno solo dal corridoio d'ingresso, senza poter accedere fisicamente alla camera principale.<br><br><b>Il riconoscimento</b><br>Seokguram fu dichiarato 24° Tesoro Nazionale della Corea del Sud nel 1962, e nel dicembre 1995 è stato inserito nella lista del Patrimonio Mondiale UNESCO insieme al vicino tempio di Bulguksa, riconoscendo i due siti come un unico complesso religioso di eccezionale valore artistico e architettonico, espressione dell'apice culturale della dinastia Silla Unificata.", img:"Grotta di Seokguram.jpg", tip:"La grotta si trova a circa 4 km da Bulguksa, raggiungibile in bus, taxi o auto in circa 20 minuti, oppure a piedi in circa un'ora lungo un sentiero di montagna. È aperta indicativamente dalle 6:00 alle 18:00, con qualche variazione stagionale, e la mattina presto resta il momento migliore sia per la luce sia per evitare la folla. All'interno non è consentito l'uso del flash, ed essendo un luogo di culto ancora attivo, è bene mantenere un comportamento rispettoso e un tono di voce basso durante la visita.", move:"Partenza alle 11:00 verso il Tempio di Bulguksa (circa 32 min).<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 불국로 385"},
    {n:"[11:30] Tempio di Bulguksa", d:"<b>Le origini nel regno di Silla</b><br>Le prime fondamenta del tempio risalgono al 528, quando re Beopheung lo fece costruire, in una forma più piccola e con il nome di Hwaeom Bulguksa (o Beopryusa), come luogo di preghiera per la pace e la prosperità del regno di Silla, dedicandolo alla regina. Fu solo due secoli più tardi, a partire dal 751, sotto il regno di re Gyeongdeok, che il primo ministro Kim Dae-seong avviò un ampliamento su scala molto più grande, portato a termine nel 774, dopo la sua morte, sotto il successore re Hyegong. Fu in questa occasione che il tempio ricevette il nome attuale, Bulguksa, che si può tradurre come Tempio del Paese di Buddha o Tempio della Terra di Buddha, pensato come una rappresentazione terrena del paradiso buddista.<br><br><b>La leggenda di Kim Dae-seong</b><br>Una leggenda molto diffusa narra che Kim Dae-seong avesse fatto costruire Bulguksa in onore dei genitori della sua vita presente, e contemporaneamente avesse commissionato la vicina grotta di Seokguram in onore dei genitori di una sua vita passata, in un gesto di pietà filiale rivolto contemporaneamente al presente e al passato. Sebbene si tratti di un racconto tramandato più che di un fatto storicamente accertato, resta un aneddoto molto citato per spiegare la stretta connessione tra i due siti, entrambi arroccati sulle pendici del monte Tohamsan.<br><br><b>Distruzione e rinascita</b><br>Il tempio fu quasi completamente distrutto da un incendio durante la Guerra Imjin (1592-1598), l'invasione giapponese della Corea, e subì nei secoli successivi, tra dinastia Goryeo e dinastia Joseon, numerosi interventi di restauro, oltre a ripetuti furti delle sue opere d'arte. I lavori di restauro più sistematici iniziarono nel 1920, per poi intensificarsi ulteriormente a partire dal 1969, quando fu istituito un apposito comitato di restauro, che nel 1973 portò alla ricostruzione di diversi padiglioni andati perduti nei secoli precedenti.<br><br><b>Il riconoscimento UNESCO</b><br>Nel dicembre 1995 Bulguksa è stato dichiarato Patrimonio dell'Umanità dall'UNESCO, insieme alla Grotta di Seokguram: insieme, i due siti sono considerati l'espressione più alta dell'architettura e dell'arte buddista sviluppatasi durante l'epoca d'oro della dinastia Silla Unificata (VII-IX secolo), quando la capitale Gyeongju contava una popolazione stimata vicina al milione di abitanti, paragonabile a quella della contemporanea capitale cinese Chang'an.<br><br><b>Cosa troveremo</b><br>Il complesso si sviluppa su terrazze di pietra rialzate, a cui si accede tradizionalmente tramite due coppie di ponti-scalinata in pietra, oggi non più percorribili per motivi di conservazione: Cheongungyo e Baegungyo (i ponti della nuvola blu e della nuvola bianca) da un lato, e Yeonhwagyo (il ponte dei fiori di loto), di cui restano solo tracce degli originali intagli a forma di fiore di loto, dall'altro. Nel cortile principale si trovano fianco a fianco le due pagode più celebri del tempio, entrambe considerate tesori nazionali della Corea: Seokgatap, una pagoda in pietra dalle linee sobrie ed essenziali, e Dabotap, una pagoda molto più elaborata e decorata, la cui struttura a baldacchino ha ispirato, come abbiamo visto, anche il design della sommità della Torre di Busan dopo il suo restyling del 2021.", img:"Tempio di Bulguksa.jpg", tip:"Il tempio riceve tra i 2 e i 3 milioni di visitatori l'anno, con il periodo di massima affluenza tra fine ottobre e inizio novembre, quando gli aceri lungo il viale d'accesso si tingono di rosso e arancio. Per evitare la folla conviene arrivare prima delle 9:00 o dopo le 16:00. Essendo costruito su terrazze e gradinate, mettete in conto un po' di cammino su superfici irregolari; per la visita completa, incluso il tempo per ammirare le pagode e i dettagli architettonici, servono circa 1,5-2 ore.", move:"Partenza alle 13:30 verso Hwangridan-gil / zona Daereungwon (circa 32 min).<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 첨성로 99번길 24"},
    {n:"[14:00] Pranzo: Ryoko", d:"Una volta spostati in zona Daereungwon Tomb Complex pranzeremo qui. È oggi il ristorante più recensito e meglio valutato di tutta Hwangridan-gil su DiningCode. Si trova all'interno di un edificio in stile hanok tradizionale, con tavoli sia vicino alle finestre sia in una saletta più riservata.<br><br><b>Cosa propone</b><br>Il menu è volutamente essenziale, con solo quattro piatti principali. I più richiesti sono:<br><b>Ansim-katsu</b> — una cotoletta di maiale impanata e fritta, preparata con il filetto (ansim), quindi più magra e tenera rispetto al classico tonkatsu, servita con un'insalata di contorno.<br><b>Omurice</b> — la classica frittata avvolta attorno a riso saltato, molto amata in Corea.<br><b>Ryoki noodle</b> — un piatto di spaghetti di riso saltati con frutti di mare e verdure, in una salsa a base di arachidi tostate, cipollotto e cipolla rossa, non pesante nonostante la componente cremosa.", img:"Ryoko.jpg", tip:"Essendo il locale più consigliato della zona, la fila è quasi garantita, soprattutto a pranzo: alcuni visitatori segnalano anche oltre un'ora di attesa nei giorni di alta stagione. Orario: 11:00-21:30, con pausa pomeridiana dalle 15:30 alle 17:00 e ultimo ordine alle 20:30; chiuso il martedì. Conviene arrivare presto, magari puntando all'apertura o subito dopo la pausa pomeridiana, per ridurre l'attesa.", move:"Hwangnamdang è a pochi passi da qui, nella stessa via.<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 포석로 1085"},
    {n:"[15:00] Spuntino: Hwangnamdang (황남당)", d:"Dopo pranzo ci fermeremo qui per assaggiare il chalbori-ppang.<br><br><b>Cos'è il chalbori-ppang</b><br>Si tratta di un dolce a base di orzo glutinoso, l'ingrediente che dà il nome al prodotto (chalbori significa proprio orzo glutinoso), con un impasto più rustico e ricco di fibre rispetto al classico pane bianco. Nel caso di Hwangnamdang, la particolarità sta nella varietà dei ripieni proposti, tra cui sesamo nero, artemisia, fagioli rossi classici, orzo perlato e una versione con crema di formaggio e fagioli rossi insieme, ciascuno con un gusto piuttosto diverso dagli altri.<br><br><b>Un abbinamento locale: il makgeolli</b><br>Il negozio è noto anche per l'abbinamento tra il chalbori-ppang e il makgeolli, il tradizionale vino di riso non filtrato dalla consistenza torbida e leggermente frizzante, una delle bevande alcoliche più antiche della tradizione coreana, un tempo diffusa soprattutto tra i contadini per il suo basso costo e il contenuto di probiotici naturali, oggi invece rivalutata anche nella ristorazione più curata.", img:"Hwangnamdang.jpg", tip:"", move:"Daereungwon Tomb Complex è a pochi passi da qui.<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 황남동 202-6"},
    {n:"[15:30] Daereungwon Tomb Complex", d:"<b>Il nome: il giardino delle grandi tombe</b><br>Daereungwon significa letteralmente giardino delle grandi tombe, un nome che descrive perfettamente questo parco archeologico nel cuore di Gyeongju, l'antica capitale del regno di Silla, un tempo conosciuta come Geumseong o Seorabol. Il complesso raccoglie 23 grandi tumuli funerari appartenuti a re, regine e nobili di alto rango vissuti tra il IV e il X secolo, il periodo in cui Silla dominò gran parte della penisola coreana.<br><br><b>Come sono fatte le tombe</b><br>Le tombe seguono una tecnica costruttiva tipica dell'aristocrazia Silla, chiamata jeoksongmokgwakbun: al centro veniva scavata una camera sotterranea in legno, all'interno della quale si deponeva il defunto insieme ai propri oggetti funerari, per poi ricoprire il tutto con uno spesso strato di pietre di fiume e infine di terra, fino a formare i grandi tumuli erbosi che oggi caratterizzano il paesaggio del parco. Questa tecnica, priva di un ingresso praticabile come nelle tombe a corridoio di altre culture, ha reso le tombe Silla particolarmente difficili da saccheggiare nei secoli, permettendo così di conservare intatti tesori sorprendenti fino agli scavi archeologici moderni.<br><br><b>Cheonmachong: la tomba del cavallo celeste</b><br>La tomba più celebre del complesso è Cheonmachong, la tomba numero 155, scavata nel 1973 e oggi l'unica del parco visitabile anche all'interno. Alta 12,7 metri e larga circa 50 metri di diametro, ha restituito oltre 11.500 reperti, incluse una splendida corona d'oro, gioielli, una cintura d'oro cerimoniale e una coppa di vetro blu di probabile origine persiana, a testimonianza dei contatti commerciali di Silla con l'Asia centrale lungo la Via della Seta. Il nome della tomba, che significa proprio cavallo celeste, deriva dal ritrovamento di un dipinto su un paraffango di corteccia di betulla, raffigurante un cavallo bianco alato: si tratta della più antica opera pittorica mai ritrovata in Corea.<br><br><b>Hwangnamdaechong: la tomba della coppia reale</b><br>Un'altra tomba di particolare rilievo è Hwangnamdaechong, la più grande di tutto il complesso, scavata tra il 1973 e il 1975. Si tratta in realtà di una tomba doppia, composta da due tumuli uniti, che si ritiene appartenessero a una coppia reale, un re e una regina: al suo interno sono stati rinvenuti oltre 30.000 reperti, tra cui splendidi accessori d'oro.<br><br><b>Il riconoscimento UNESCO</b><br>Daereungwon fa parte delle Gyeongju Historic Areas, dichiarate Patrimonio Mondiale dell'UNESCO nel 2000.<br><br><b>Cosa troveremo</b><br>Oltre alle tombe, il parco è curato come un vero giardino paesaggistico, con laghetti, alberi secolari e ampi prati che rendono la passeggiata piacevole indipendentemente dall'interesse storico, tanto da essere una delle mete più fotografate della città, complice anche la vicinanza a Hwangridan-gil. È importante sapere che gran parte dei reperti originali ritrovati nelle tombe, incluse le corone d'oro, sono oggi esposti al Gyeongju National Museum, mentre nel parco e dentro Cheonmachong si trovano perlopiù riproduzioni fedeli.", img:"Daereungwon Tomb Complex.jpg", tip:"Il parco riceve circa un milione di visitatori l'anno ed è aperto generalmente dalle 9:00 alle 22:00. Arrampicarsi sui tumuli è severamente vietato e può comportare una sanzione salata, quindi conviene attenersi ai sentieri segnalati.", move:"Partenza alle 17:00 verso Hwangnam Bread - Original Store.<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 태종로 783"},
    {n:"[17:00] Spuntino: Hwangnam Bread - Original Store (황남빵 본점)", d:"Un'altra pausa dolce. Anche qui ritroveremo il dolce già assaggiato in mattinata alla Choi Yeonghwa Bakery — il negozio storico gestito dall'altro ramo della famiglia Choi, che detiene il marchio originale Hwangnam Bread.", img:"Hwangnam Bread - Original Store.jpg", tip:"", move:"Cheomseongdae è a pochi passi da qui.<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 인왕동 839-1"},
    {n:"[17:30] Cheomseongdae (observatory)", d:"<b>Il nome: la torre che osserva le stelle</b><br>Cheomseongdae significa letteralmente torre che osserva le stelle, ed è considerato il più antico osservatorio astronomico sopravvissuto in tutta l'Asia orientale, forse addirittura al mondo. Secondo il Samguk Yusa, un'antica raccolta di memorie e leggende dei Tre Regni compilata nel XIII secolo, la torre fu costruita durante il regno della regina Seondeok (632-647), la prima donna a governare il regno di Silla dopo la morte del padre, re Jinpyeong, senza eredi maschi.<br><br><b>Un'architettura fitta di simbolismo</b><br>La torre, alta circa 9,17 metri, è costruita con 362 blocchi di granito (alcune fonti riportano 365) disposti in 27 strati circolari: un numero, quest'ultimo, che si ritiene alluda proprio alla regina Seondeok, ventisettesima sovrana di Silla. Sopra e sotto la piccola finestra quadrata che si apre a circa metà altezza della torre si contano rispettivamente 12 file di pietre, un possibile riferimento ai mesi dell'anno, mentre includendo la base la struttura arriva a un totale di 28 elementi, lo stesso numero delle costellazioni della tradizione astronomica dell'Asia orientale. La forma stessa della torre, cilindrica nella parte inferiore e quadrata nella base e nella sommità, richiama l'incontro simbolico tra principio femminile e maschile.<br><br><b>Come veniva usata</b><br>Gli astronomi di corte vi osservavano il cielo ininterrottamente, giorno e notte, tutto l'anno, con l'obiettivo di prevedere eclissi, tracciare il passaggio delle comete e registrare qualunque fenomeno celeste ritenuto rilevante per il governo del regno. L'influenza di Cheomseongdae si estese anche oltre i confini di Silla, ispirando la costruzione dell'osservatorio Senseidai in Giappone nel 675 e di un analogo osservatorio in Cina nel 723.<br><br><b>Una funzione ancora dibattuta</b><br>Vale la pena sapere che l'effettiva funzione della torre non è priva di dibattito tra gli studiosi: mentre l'interpretazione più diffusa e tradizionale la considera un vero osservatorio astronomico, alcuni ricercatori coreani, a partire dagli anni '60, hanno proposto letture alternative, come quella di un altare ispirato al monte Sumeru della cosmologia buddista, o di un santuario dedicato alla divinità agricola.<br><br><b>Il riconoscimento</b><br>Cheomseongdae è stato dichiarato 31° Tesoro Nazionale della Corea del Sud il 20 dicembre 1962, e fa oggi parte delle Gyeongju Historic Areas, dichiarate Patrimonio Mondiale UNESCO nel 2000. È inoltre un simbolo talmente identitario da comparire ancora oggi sulle monete coreane.", img:"Cheomseongdae.jpg", tip:"Essendo un parco all'aperto sempre accessibile, il momento migliore per la visita è la mattina presto, per la luce più morbida e meno folla, oppure il tardo pomeriggio. Essendo un sito compatto, bastano 20-30 minuti per la visita, ma è comune fermarsi più a lungo semplicemente per godersi il parco.", move:"Partenza alle 18:30 verso Donggung Palace e Wolji Pond.<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 원화로 102"},
    {n:"[18:30] Donggung Palace e Wolji Pond", d:"<b>Le origini: un palazzo secondario per il principe ereditario</b><br>Il complesso fu costruito per volere del re Munmu, uno dei più celebri sovrani della storia coreana, che nel 668 riuscì brevemente a unificare i regni della penisola coreana sotto Silla. Lo stagno, Wolji, fu realizzato nel 674, mentre il palazzo di Donggung (che significa letteralmente palazzo est) fu edificato cinque anni più tardi, come residenza secondaria per il principe ereditario e come sede per banchetti reali in occasione di eventi importanti o per accogliere ospiti illustri.<br><br><b>Uno stagno progettato secondo l'estetica taoista</b><br>Secondo un testo geografico della dinastia Joseon del XVI secolo, il re Munmu fece realizzare lo stagno seguendo i principi estetici del taoismo: la forma ovale, di 200 metri da est a ovest e 180 da nord a sud, comprende tre piccole isole ed elementi che nel pensiero taoista rappresentano le isole degli immortali e il paesaggio ideale della natura in miniatura.<br><br><b>Il nome perduto e ritrovato</b><br>Dopo la caduta di Silla, il sito cadde in rovina, e il suo nome originale andò perduto: poeti e calligrafi che visitavano le rovine dello stagno componevano versi in cui si lamentavano che dell'antico splendore del palazzo restassero solo oche e anatre selvatiche in volo, dando origine al nome con cui il sito fu conosciuto per secoli, Anapji. Solo negli anni '80, durante i lavori di scavo e restauro avviati nel 1974, fu ritrovato un frammento di ceramica con inciso il nome Wolji, che significa stagno che riflette la luna: da quel momento il sito ha riacquisito il proprio nome originale.<br><br><b>Una scoperta archeologica straordinaria</b><br>Gli scavi condotti tra il 1975 e il 1986 hanno portato alla luce circa 33.000 reperti, tra cui i resti di 26 edifici, 8 muri di cinta, antichi sistemi idrici di approvvigionamento e drenaggio. Circa 730 di questi reperti sono oggi esposti nella Wolji Gallery del Gyeongju National Museum.<br><br><b>Cosa troveremo</b><br>Oggi il complesso comprende tre padiglioni ricostruiti sulle sponde dello stagno, pensati in origine per offrire ombra e riparo ai visitatori di corte, mentre altri resti archeologici sono stati lasciati volutamente allo stato naturale, senza ricostruzione, per non alterare l'autenticità del sito. Il luogo è diventato anche una popolare location cinematografica e televisiva coreana, comparendo per esempio nel drama The Beauty Inside.", img:"Donggung Palace e Wolji Pond.jpg", tip:"La vera particolarità del sito emerge di sera, quando i padiglioni si illuminano e si riflettono nell'acqua dello stagno, regalando probabilmente la vista notturna più suggestiva di tutta Gyeongju. L'ultimo ingresso è generalmente alle 21:30, con chiusura alle 22:00, ed è richiesto un biglietto d'ingresso a pagamento, comunque economico.", move:"Partenza verso Hyanghwajeong per cena.<br><b>Indirizzo per Naver:</b><br><br>경북 경주시 사정로57번길 17"},
    {n:"[20:00] Cena: Hyanghwajeong", d:"Tenendo sempre d'occhio l'orario per non perdere il treno per Seoul, ci fermeremo qui a cena. È un ristorante di cucina coreana molto apprezzato lungo Hwangridan-gil, conosciuto soprattutto per i piatti a base di kkomak, le piccole vongole tipiche della costa sud-occidentale della Corea (in particolare della zona di Beolgyo), qui proposte marinate e condite come contorno o come base per un bibimbap. Laddove dovesse essersi fatto tardi dovremo mangiare una cosa da qualche parte al volo, o capire se è possibile consumare una bento box in treno.<br><br><b>Cosa propone</b><br>Il piatto più celebre è il kkomak-muchim bibimbap, un bibimbap con vongole condite piccanti mescolate al riso, ma il menu comprende anche:<br>Yukhoe bibimbap — bibimbap con carne di manzo cruda marinata (yukhoe), una specialità piuttosto diffusa a Gyeongju.<br>Yukhoe mulhoe — una zuppa fredda e piccante con carne cruda, tipica rivisitazione locale del più classico mulhoe di pesce crudo.<br>Haemul pajeon — la classica frittella coreana con cipollotto e frutti di mare, descritta nelle recensioni come particolarmente ricca e croccante.", img:"Hyanghwajeong.jpg", tip:"Orario: 11:00-21:30, pausa pomeridiana 15:00-17:00. Essendo molto richiesto, mettete in conto una possibile attesa; tenete d'occhio l'orario per non perdere il treno delle 22:30.", move:"Partenza alle 21:00 verso Singyeongju Station (circa 10 min).<br><b>Indirizzo per Naver:</b><br><br>경상북도 경주시 건천읍 경주역로 80"}

    {n:"[8:00] Colazione: Artist Bakery", d:"Una volta fatto il check-out dall'albergo, e preparata una borsa per il temple stay, ci recheremo qui per colazione prima di iniziare le visite della mattinata.<br><br><b>Chi c'è dietro</b><br>Artist Bakery è il progetto più recente del team che ha già dato vita a London Bagel Museum, uno dei fenomeni da fila interminabile della scena bakery di Seoul degli ultimi anni. Nato dalla creatività di Ryo, considerato una sorta di autore/artista del mondo della panificazione coreana più che un semplice fondatore, il locale ha applicato la stessa formula che ha reso celebre London Bagel Museum, riportando in auge un prodotto già diffuso a Seoul, il sogeum-ppang (pane al sale), reinventandolo con un tocco più ricercato ed estetico.<br><br><b>Cosa troveremo</b><br>Il negozio propone oltre 20 varietà diverse di pane al sale, oltre a baguette e sandwich, in un ambiente dal design in stile europeo che richiama l'atmosfera di una boulangerie parigina. Tra i gusti più consigliati dalle recensioni ci sono la versione al limone, quella al pesto di basilico, quella con crema al latte (segnalata spesso come un acquisto quasi obbligato) e diverse varianti al burro salato più classiche, oltre a versioni più particolari come patata o tartufo.<br><br><b>Un fenomeno mediatico</b><br>La popolarità del negozio è cresciuta ulteriormente dopo essere stato protagonista del programma televisivo coreano Queueing Cafeteria 2 (Jul-seo-neun Sikdang), un format che segue proprio i locali con le file più lunghe di tutta la Corea, contribuendo a consolidarne lo status di tappa quasi obbligata per gli appassionati di dolci a Seoul.", img:"Artist Bakery.jpg", tip:"", move:"Partenza verso Palazzo Gyeongbokgung.<br><b>Indirizzo per Naver:</b><br><br>서울특별시 종로구 사직로 161"},
    {n:"[9:00] Palazzo Gyeongbokgung", d:"Dobbiamo essere qui per le 9 (o preferibilmente un po' prima) per assistere al cambio della guardia.<br><br><b>Il nome: grandemente benedetto dal cielo</b><br>Gyeongbokgung significa palazzo grandemente benedetto dal cielo, e fu costruito nel 1395, appena tre anni dopo la fondazione della dinastia Joseon, per volere del generale Yi Seong-gye (poi re Taejo), che rovesciò la precedente dinastia Goryeo. La nuova capitale, Hanyang (l'odierna Seoul), fu scelta secondo i principi della geomanzia coreana (pungsu), incastonata tra quattro montagne considerate protettrici. Il palazzo fu ampliato nei decenni successivi, in particolare sotto i regni di re Taejong e del celebre re Sejong il Grande, quest'ultimo passato alla storia soprattutto per aver promosso la creazione dell'Hangul, l'alfabeto coreano moderno, proprio in questi anni.<br><br><b>La distruzione durante la Guerra Imjin</b><br>Nel 1592, con l'invasione giapponese guidata da Toyotomi Hideyoshi, la corte Joseon fu costretta alla fuga verso nord. Secondo diverse fonti storiche, prima ancora dell'arrivo delle truppe giapponesi, furono gli stessi abitanti di Hanyang, molti dei quali schiavi di palazzo, ad appiccare il fuoco a Gyeongbokgung, nel tentativo di distruggere i registri che ne attestavano lo status servile. Il palazzo bruciò completamente, e per quasi 270 anni restò in stato di abbandono: la corte scelse di ricostruire e occupare Changdeokgung come nuova residenza principale, sia per le difficoltà economiche del dopoguerra sia per una diffusa superstizione che considerava il sito ormai maledetto.<br><br><b>La grande ricostruzione dell'Ottocento</b><br>Solo nel 1867, sotto la reggenza di Heungseon Daewongun, padre del giovane re Gojong, il palazzo fu integralmente ricostruito, in un progetto durato circa 1.000 giorni e che impiegò fino a 3.000 lavoratori al giorno, arrivando a comprendere oltre 330 edifici su una superficie di circa 410.000 metri quadrati, quasi le dimensioni di una piccola città. Tra le opere più complesse ci fu la ricostruzione del padiglione Gyeonghoeru, simbolo del palazzo, che da solo assorbì più della metà del tempo dell'intero progetto, dato che i costruttori scelsero di preservare le tecniche costruttive originarie del XIV secolo insieme a quelle più moderne dell'epoca.<br><br><b>L'assassinio della regina Min</b><br>Il palazzo fu teatro di uno degli eventi più drammatici della storia coreana moderna: l'8 ottobre 1895, l'imperatrice Myeongseong (conosciuta anche come regina Min), moglie dell'imperatore Gojong e figura politica di grande influenza, fu assassinata all'interno del palazzo da agenti giapponesi, in un episodio noto come l'incidente di Eulmi. Gojong e la famiglia reale non fecero mai più ritorno a vivere stabilmente a Gyeongbokgung dopo quell'evento.<br><br><b>La cancellazione sistematica durante l'occupazione giapponese</b><br>Durante il periodo coloniale giapponese (1910-1945), la maggior parte degli edifici del palazzo fu smantellata o distrutta, e nel 1926 le autorità giapponesi eressero proprio davanti all'ingresso principale il Government-General Building, un enorme edificio amministrativo in stile occidentale, pensato deliberatamente per oscurare la vista del palazzo e simboleggiare la sostituzione del potere coreano con quello coloniale. L'edificio fu infine demolito solo nel 1996, oltre 70 anni dopo la sua costruzione, come parte di un più ampio processo di restauro dell'identità nazionale coreana.<br><br><b>Il cancello Gwanghwamun: una storia nella storia</b><br>Anche il cancello principale del palazzo, Gwanghwamun, racconta a suo modo le vicende del Novecento coreano: ricostruito nel 1968 in cemento sotto il presidente Park Chung-hee, con una impronta in Hangul scritta di suo pugno (un gesto simbolico di indipendenza linguistica dall'influenza cinese classica), fu però posizionato con un lieve disallineamento rispetto all'asse originale del palazzo. Solo tra il 2006 e il 2010 il cancello fu finalmente ricostruito fedelmente in legno, nella posizione e nello stile originari.<br><br><b>Cosa troveremo</b><br>Oggi solo una parte del complesso originario è stata restaurata, ma resta comunque il più grande e simbolico dei Cinque Grandi Palazzi di Seoul. Tra le tappe principali ci sono il padiglione Gyeonghoeru, affacciato su un grande stagno artificiale e un tempo utilizzato per banchetti reali, e Hyangwonjeong, il piccolo padiglione esagonale su un'isola artificiale, costruito più tardi durante il regno di Gojong come luogo di svago per la famiglia reale. Davanti al cancello di Gwanghwamun si tiene inoltre una cerimonia del cambio della guardia in costume tradizionale, molto amata dai visitatori.", img:"Palazzo Gyeongbokgung.jpg", tip:"L'ingresso è gratuito per chi indossa un hanbok, l'abito tradizionale coreano, che è possibile noleggiare in uno dei tanti negozi della zona circostante, molti dei quali proprio ad Anguk-dong e Bukchon. Il palazzo è generalmente chiuso il martedì. Mettete in conto almeno 2 ore per la visita, di più se avete intenzione di assistere anche alla cerimonia del cambio della guardia.", move:"Partenza alle 11:00 verso Bukchon Village.<br><b>Indirizzo per Naver:</b><br><br>서울 종로구 계동길 37"},
    {n:"[11:00] Bukchon Hanok Village", d:"<b>Il nome: il villaggio del nord</b><br>Bukchon significa letteralmente villaggio del nord, un nome che deriva dalla sua posizione geografica: si trova infatti a nord del torrente Cheonggyecheon e della strada Jongno, incastonato tra i due palazzi più importanti della dinastia Joseon, Gyeongbokgung e Changdeokgung. Proprio per questa vicinanza al potere, il quartiere divenne fin dal XIV secolo la zona residenziale d'elezione per gli yangban, la classe aristocratica e burocratica di alto rango del regime confuciano Joseon, oltre che per alcuni membri della famiglia reale.<br><br><b>L'architettura hanok</b><br>Le case tradizionali che ancora oggi caratterizzano il quartiere, gli hanok, sono costruite in legno, pietra, terra e carta di riso, con i caratteristici tetti spioventi in tegole grigie e il sistema di riscaldamento a pavimento ondol, ancora oggi diffuso in tutta la Corea. La disposizione interna delle abitazioni rifletteva rigorosamente la gerarchia sociale confuciana dell'epoca, con spazi distinti per uomini, donne e servitù.<br><br><b>Una battaglia contro la colonizzazione</b><br>Uno degli episodi meno noti ma più significativi della storia del quartiere risale agli anni '20-'30 del Novecento: mentre il Giappone occupava la Corea, l'imprenditore coreano Jeong Se-gwon, attraverso la sua società Konyangsa (una delle prime agenzie immobiliari moderne del paese), avviò deliberatamente una riqualificazione dell'area proprio per impedire che gli interessi immobiliari giapponesi potessero impadronirsene, contribuendo così a preservarne il carattere coreano in un periodo di forte pressione coloniale. Fu in questa fase che molte delle case vennero modernizzate con l'introduzione di finestre in vetro e dell'elettricità, pur mantenendo la forma architettonica tradizionale.<br><br><b>Salvato dalla demolizione grazie ai residenti</b><br>Negli anni '60, con la rapida modernizzazione di Seoul, l'area fu messa a rischio di un piano di riqualificazione che avrebbe comportato la demolizione o il trasferimento di gran parte degli hanok, a favore di edifici moderni in cemento. Furono gli stessi abitanti del quartiere, legati al valore storico e affettivo di queste case, a protestare con successo contro il piano, riuscendo a salvare il quartiere da una sorte che ha invece colpito molte altre zone storiche della capitale.<br><br><b>Cosa troveremo</b><br>Oggi il quartiere conta circa 900 hanok, rendendolo la più grande concentrazione di architettura tradizionale coreana rimasta a Seoul. Alcune abitazioni sono ancora residenze private, abitate anche da discendenti delle famiglie aristocratiche originarie, mentre altre sono state trasformate in caffè, ristoranti (alcuni oggi anche stellati Michelin), case da tè, gallerie d'arte, come il Bukchon Asian Art Museum, o piccoli musei come il Gahoe Museum, che raccoglie oltre 1.500 reperti tra libri classici, dipinti popolari e amuleti dell'epoca Joseon. Un punto panoramico particolarmente amato è il Bukchon Observatory, da cui si gode di una vista dall'alto sui tetti spioventi del quartiere che si stagliano contro lo skyline moderno di Seoul.<br><br><b>Un quartiere ancora abitato, non un parco a tema</b><br>Come già visto per Gamcheon a Busan, è importante ricordare che Bukchon resta un quartiere residenziale vivo, non ricostruito appositamente per i turisti: nel 2024 ha ricevuto circa 6,4 milioni di visitatori, a fronte di appena 6.100 residenti effettivi, un rapporto che negli ultimi anni ha generato tensioni concrete legate a rumore e privacy. Vale la pena mantenere un comportamento rispettoso, parlando a voce bassa e evitando di fotografare l'interno delle case private.", img:"Bukchon Hanok Village.jpg", tip:"Essendo proprio nelle vicinanze di Artist Bakery e non lontano da Gyeongbokgung, si presta perfettamente a una passeggiata subito dopo la colazione o dopo la visita al palazzo. Le vie più fotografate, come Bukchon-ro 11-gil, tendono ad affollarsi rapidamente in tarda mattinata: la prima mattina resta il momento migliore sia per la luce sia per godersi il quartiere con più tranquillità.", move:"Partenza alle 12:00 verso Insadong.<br><b>Indirizzo per Naver:</b><br><br>서울 종로구 인사동길 44"},
    {n:"[12:00] Insadong", d:"<b>Il nome: un'unione amministrativa del periodo coloniale</b><br>Il nome attuale, Insadong, fu creato nel 1914 durante il periodo coloniale giapponese, unendo un carattere ciascuno dai nomi di due quartieri precedenti, Gwaninbang e Daesadong. La zona però ha rappresentato un'area centrale di Seoul fin dall'epoca Joseon, circa 600 anni fa, quando vi risiedevano numerosi uffici governativi e funzionari di rango medio-alto, oltre ad alcuni yangban, l'aristocrazia colta del regno.<br><br><b>L'eredità del Dohwahwon: perché è diventata la via dell'arte</b><br>Il tratto che più di ogni altro ha plasmato l'identità di Insadong fu la presenza, in epoca Joseon, del Dohwahwon, il dipartimento nazionale di pittura di corte, responsabile della formazione dei pittori ufficiali del regno. Fu proprio grazie a questa eredità artistica e calligrafica che la zona sviluppò naturalmente, nei secoli successivi, una forte vocazione per l'arte, la calligrafia e l'antiquariato, un carattere che conserva ancora oggi.<br><br><b>La nascita del mercato dell'antiquariato</b><br>Durante l'occupazione coloniale giapponese, con il collasso economico di molte famiglie aristocratiche Joseon, numerosi oggetti d'arte, mobili e ceramiche di pregio, un tempo appartenuti alla nobiltà, iniziarono a essere venduti proprio in questa zona, dando origine a un vero e proprio mercato dell'antiquariato che si consolidò ulteriormente negli anni '30, quando cominciarono ad aprire negozi specializzati in carta, libri antichi, strumenti di calligrafia e pennelli. A partire dagli anni '70, si aggiunsero anche gallerie d'arte e botteghe artigiane, trasformando gradualmente Insadong nel quartiere culturale che conosciamo oggi: nel 1988 fu ufficialmente designato Via della Cultura Tradizionale, un riconoscimento che ne ha consolidato lo status di meta imprescindibile per chi visita Seoul.<br><br><b>Cosa troveremo</b><br>Insadong-gil, la via principale, si sviluppa per circa 700 metri, fiancheggiata da oltre 70 negozi di antiquariato, dove è possibile trovare autentiche ceramiche del periodo Silla o della dinastia Joseon, e da oltre 100 gallerie d'arte, tra cui il Gana Art Center, una delle più grandi della zona. Il complesso Ssamziegil raccoglie invece oltre 70 negozi di artigianato e prodotti fatti a mano su più livelli, organizzati attorno a una rampa a spirale che è diventata di per sé un'attrazione. Da segnalare anche Tongmungwan, la libreria più antica di Seoul, e la vicinanza al tempio buddista di Jogyesa, uno dei più importanti della capitale. Nei weekend la via principale diventa pedonale, animandosi di artisti di strada, bancarelle di street food (hotteok, tteokbokki, bungeoppang) e venditori di dolci tradizionali come lo kkul-tarae, la versione coreana del dragon's beard candy cinese, filamenti sottilissimi di zucchero tirato a mano.", img:"Insadong.jpg", tip:"Essendo proprio tra Bukchon e Gyeongbokgung, si presta perfettamente a essere abbinato nello stesso itinerario di giornata. Il weekend, quando la strada diventa pedonale, è il momento più vivace per visitarla, ma anche il più affollato: se cercate un'atmosfera più tranquilla per curiosare tra le botteghe di antiquariato, un giorno feriale è probabilmente la scelta migliore.", move:"Partenza alle 13:30 verso KOONG.<br><b>Indirizzo per Naver:</b><br><br>서울 종로구 인사동10길 11-3"},
    {n:"[13:30] Pranzo: KOONG - Gaeseong Traditional Dumpling House", d:"<b>Una ricetta portata dal nord</b><br>Il nome del locale rimanda a Gaeseong, l'antica capitale del regno di Goryeo, oggi situata in Corea del Nord, patria della fondatrice, nonna Im Myeong-sook, nata lì nel 1917. Durante la guerra di Corea (1950-1953), come migliaia di altri profughi, la donna fuggì verso sud, e con lei portò le ricette della sua terra d'origine, tra cui quella dei tradizionali mandu di Gaeseong. Le fonti divergono leggermente sulla data esatta di apertura del locale (alcune indicano il 1970, altre gli anni '90), ma tutte concordano sul fatto che sia nato dal desiderio della fondatrice di ricreare il sapore della sua città natale, tramandando la ricetta di famiglia fino alla terza generazione, che gestisce il locale ancora oggi.<br><br><b>Cosa rende speciale il mandu di Gaeseong</b><br>A differenza dei mandu più comuni nel resto della Corea, quelli di stile Gaeseong hanno una forma caratteristica a mezzaluna e un ripieno decisamente più abbondante, con carne di maiale, cavolo, zucca e altre verdure di stagione, preparati ancora oggi a mano ogni giorno, spesso proprio davanti agli occhi dei clienti seduti al tavolo.<br><br><b>Il riconoscimento Michelin</b><br>Il locale è inserito nella Guida Michelin di Seoul come Bib Gourmand, il riconoscimento dedicato ai ristoranti che offrono un rapporto qualità-prezzo particolarmente convincente, senza raggiungere la stella vera e propria.<br><br><b>Cosa troveremo</b><br>Il piatto più celebre è il mandu jeongol, una pentola calda condivisa con mandu, tteok (gnocchi di riso), funghi e carne in un brodo saporito, disponibile sia nella versione a base di carne sia in quella con kimchi. Ci sono anche il più semplice mandu-guk (zuppa di ravioli) e il tteok-mandu-guk, con l'aggiunta di gnocchi di riso a forma di piccoli pupazzi di neve, oltre a un bossam (carne di maiale bollita da avvolgere in foglie di lattuga o kimchi), consigliato per chi è in più persone.", img:"KOONG - Gaeseong Traditional Dumpling House.jpg", tip:"", move:"Partenza alle 14:30 verso il Temple Stay Geumsunsa (circa 18 min).<br><b>Indirizzo per Naver:</b><br><br>서울 종로구 비봉길 137"},
    {n:"[15:00] Temple Stay a Geumsunsa", d:"<b>Check-in/check-out</b><br>Check-in: entro le 15:00<br>Check-out: il giorno seguente entro le 10:30<br><br><b>Cosa portare (obbligatorio)</b><br>Tazza o borraccia personale<br>Scarpe da ginnastica comode per camminare (niente ciabatte o sandali, per motivi di sicurezza)<br>Kit da toilette con asciugamano e calzini — i calzini sono obbligatori, non si può entrare nella sala Dharma a piedi nudi<br>Spazzolino da denti<br>Maglietta con maniche, da indossare sotto l'uniforme del tempio fornita in loco<br><br><b>Bagagli</b><br>Il sentiero per raggiungere il tempio è fatto di scalinate di pietra in salita: è fisicamente impegnativo. Consiglio del tempio: se possibile, lasciare i bagagli grandi in hotel e salire solo con una borsa leggera. In alternativa, è disponibile una cabinovia verde nel parcheggio del tempio per portare su i bagagli (basta avvisare il personale); peso massimo totale per carico: 120 kg. In generale, ridurre al minimo il bagaglio personale.<br><br><b>Come arrivare</b><br>Dalla fermata dell'autobus più vicina sono 20 minuti a piedi: organizzarsi con anticipo, soprattutto per gli orari.<br><br><b>Programma del primo giorno</b><br>14:30-15:00 Registrazione / check-in<br>15:30-16:30 Orientamento e visita guidata del tempio<br>17:30-18:10 Cena<br>18:20-18:30 Suono della campana<br>18:30-18:50 Cerimonia buddista (canto serale)<br>18:50-21:00 Meditazione con singing bowl e tempo libero<br>21:30-00:00 Spegnimento luci / riposo notturno", img:"Geumsunsa.jpg", tip:"Essendo richiesti calzini per entrare nella sala Dharma, conviene portarne un paio in più a testa, magari da tenere a portata di mano separatamente dal resto del bagaglio, dato che potreste doverli usare già nel pomeriggio del check-in per la visita guidata."}
