   {n:"[5:00] Inwangsan Peak", d:"<b>Il nome: un termine buddista</b><br>Inwang è un termine di origine buddista, che indica una divinità guardiana benevola. Secondo la tradizione, il nome fu attribuito alla montagna dal monaco Muhak (1327-1405), figura di spicco nella fondazione della dinastia Joseon e consigliere spirituale del primo sovrano, re Taejo: si narra che Muhak avesse profetizzato che, se Inwangsan fosse diventata una delle montagne principali della nuova capitale, il buddismo avrebbe prosperato a Hanyang (l'odierna Seoul). La sua proposta fu però scartata a favore del monte Bugaksan come montagna guardiana settentrionale.<br><br><b>Parte delle mura storiche di Seoul</b><br>Alto 338 metri, a cavallo tra i distretti di Jongno e Seodaemun, Inwangsan è una delle quattro montagne principali che circondano il centro storico di Seoul, insieme a Bugaksan, Naksan e Namsan. Lungo il suo crinale corre ancora un tratto della Hanyangdoseong, l'antica cinta muraria della capitale costruita a partire dal 1396, che si può ancora oggi percorrere a piedi come parte di un percorso escursionistico di circa 2,5 km.<br><br><b>Formazioni rocciose leggendarie</b><br>Inwangsan è conosciuta soprattutto per le sue insolite formazioni rocciose, tra cui Seonbawi (la roccia del monaco in meditazione) e Chimabawi (la roccia della gonna), il cui nome deriva dalla somiglianza con la gonna fluente di un hanbok tradizionale. Su Seonbawi circola anche una leggenda legata a Jeong Do-jeon, influente politico e studioso della prima epoca Joseon, fermamente contrario al buddismo: si narra che avesse deliberatamente modificato il tracciato della cinta muraria proprio per lasciare questa roccia fuori dal perimetro della città.<br><br><b>Un santuario sciamanico ancora attivo</b><br>Sul versante occidentale della montagna si trova Guksadang, uno dei santuari sciamanici più importanti di tutta la Corea. Ancora oggi, salendo verso Seonbawi, capita di assistere a rituali sciamanici in corso, un'esperienza che vale la pena osservare con discrezione e rispetto.<br><br><b>Un capitolo di storia recente: l'accesso vietato per 25 anni</b><br>Come la vicina Bugaksan, anche Inwangsan fu chiusa al pubblico per motivi di sicurezza dopo il 21 gennaio 1968, quando un commando delle forze speciali nordcoreane si infiltrò a Seoul con l'obiettivo di assassinare il presidente sudcoreano. La montagna restò inaccessibile fino al 1993.<br><br><b>Un soggetto ricorrente nell'arte Joseon</b><br>La bellezza paesaggistica di Inwangsan ha ispirato diversi artisti nel corso dei secoli, il più celebre dei quali è probabilmente Jeong Seon, pittore del XVIII secolo autore di Inwang jesaekdo (Inwangsan dopo la pioggia).", img:"Inwangsan Peak.jpg", tip:"Il percorso lungo le mura, da Dongnimmun a Changuimun, è gratuito e gestibile dalla maggior parte dei visitatori, anche se presenta alcuni tratti ripidi. Consigliamo di scaricare Naver Map per orientarsi. Il tardo pomeriggio, verso il tramonto, regala una delle viste più suggestive su Seoul.", move:"Partenza verso Jogyesa Temple.<br><b>Indirizzo per Naver:</b><br><br>인왕산 (cerca per nome)"},
   {n:"[8:00] Jogyesa Temple", d:"<b>Origini nel periodo Goryeo</b><br>Le radici di Jogyesa risalgono alla fine del XIV secolo, verso la fine della dinastia Goryeo, anche se l'edificio originario andò completamente distrutto in un incendio nei secoli successivi. È il tempio buddista più importante di tutta la Corea del Sud, sede centrale del Jogye Order, la principale scuola del buddismo coreano, che riunisce oggi oltre 1.700 templi in tutto il paese.<br><br><b>Una rinascita legata alla resistenza coloniale</b><br>L'incarnazione moderna del tempio nacque nel 1910, con il nome di Gakhwangsa, per volontà di alcuni monaci di spicco, tra cui Han Yong-un, figura fondamentale sia per il buddismo coreano sia per il movimento indipendentista contro l'occupazione giapponese, essendo tra i firmatari della Dichiarazione d'Indipendenza del 1919. Nel 1937 il tempio fu trasferito e ricostruito nell'attuale sede, con i lavori completati il 25 ottobre 1938, quando assunse il nome di Taegosa.<br><br><b>Il nome definitivo e il movimento di purificazione</b><br>Solo nel 1954, dopo la fine dell'occupazione giapponese, un movimento di purificazione buddista portò all'adozione del nome attuale, Jogyesa. Fu inoltre il primo tempio moderno costruito all'interno delle antiche quattro porte storiche di Seoul.<br><br><b>Un episodio di cronaca internazionale</b><br>Alla fine del 1998, Jogyesa fu al centro di un episodio di attualità: un gruppo di monaci occupò il tempio nell'ambito di una lotta di potere interna al Jogye Order, restando all'interno per 40 giorni prima che la polizia antisommossa intervenisse.<br><br><b>Un albero secolare che ha viaggiato con il tempio</b><br>Accanto a Daeungjeon, la sala principale, cresce un pino bianco di circa 500 anni, dichiarato Monumento Naturale numero 9. Curiosamente, quando il tempio fu trasferito nella sua sede attuale, anche questo antico albero fu spostato insieme all'edificio.<br><br><b>Cosa troveremo</b><br>Daeungjeon è oggi il più grande edificio templare di tutta Seoul, circondato da edifici moderni che ne accentuano il contrasto. Il tempio è particolarmente spettacolare durante il Lotus Lantern Festival, in occasione del compleanno di Buddha, quando migliaia di lanterne colorate addobbano l'intero complesso.", img:"Jogyesa Temple.jpg", tip:"L'ingresso è gratuito e il tempio si trova a pochi passi da Insadong. Essendo un luogo di culto ancora attivo, conviene mantenere un comportamento rispettoso e un tono di voce basso.", move:"Partenza verso Namdaemun Market.<br><b>Indirizzo per Naver:</b><br><br>서울특별시 종로구 우정국로 55"},
   {n:"[8:30] Namdaemun Market", d:"<b>Il mercato più antico della Corea</b><br>Namdaemun Market affonda le proprie radici nel 1414, all'inizio della dinastia Joseon, sotto il regno di re Taejong: è considerato oggi il mercato più antico e più grande di tutta la Corea del Sud, ancora attivo dopo oltre 600 anni di storia ininterrotta. Le sue origini furono piuttosto umili, come mercato del pesce situato vicino all'antico porto di Mapo sul fiume Han. All'epoca era conosciuto come Chilpae Market, dal nome dei soldati reali di stanza nella zona.<br><br><b>Il nome che deriva dalla porta</b><br>Il mercato prende il nome proprio da Namdaemun, che significa grande porta del sud, un tempo il principale ingresso meridionale della città murata di Hanyang (ufficialmente chiamata Sungnyemun). Nel 1608 l'area divenne ufficialmente il mercato alimentare della capitale.<br><br><b>Un mercato sopravvissuto a ogni difficoltà</b><br>Nel corso dei secoli, Namdaemun ha attraversato numerose vicissitudini, tra cui incendi ricorrenti, l'occupazione coloniale giapponese e la guerra di Corea, ogni volta ricostruito sostanzialmente nelle stesse dimensioni.<br><br><b>Un detto popolare</b><br>Un proverbio coreano molto diffuso recita più o meno se non lo trovi a Namdaemun, non lo troverai da nessun'altra parte a Seoul: oggi conta oltre 10.000 negozi su una superficie di più di 64.000 metri quadrati, frequentati quotidianamente da circa 300.000 persone.<br><br><b>Cosa troveremo</b><br>A differenza di altri mercati coperti della città, gran parte di Namdaemun si sviluppa all'aperto, lungo vicoli stretti percorribili solo a piedi, affiancati da edifici a più piani dedicati al commercio all'ingrosso, principalmente abbigliamento. Di sera il mercato si trasforma ulteriormente, animandosi di bancarelle di street food.", img:"Namdaemun Market.jpg", tip:"Si trova a pochi minuti a piedi sia da Myeongdong sia dalla Stazione di Seoul, ed è comodo da abbinare a una visita a Sungnyemun Gate, proprio accanto. La fermata più vicina è Hoehyeon (linea 4, uscita 5). Chi cerca un'atmosfera più concentrata sul cibo da gustare sul posto troverà probabilmente più soddisfacente Gwangjang Market.", move:"Partenza verso Myeongdong (pochi minuti a piedi).<br><b>Indirizzo per Naver:</b><br><br>서울특별시 중구 남대문시장4길 21"},
   {n:"[9:30] Myeongdong", d:"<b>Da quartiere residenziale aristocratico a centro commerciale</b><br>Durante la dinastia Joseon, l'area oggi conosciuta come Myeongdong si chiamava Myeongnyebang, un tranquillo quartiere residenziale abitato soprattutto da funzionari governativi. La trasformazione in senso commerciale iniziò a prendere forma tra la fine del XIX secolo e i primi del Novecento.<br><br><b>La prima catena di grandi magazzini della Corea</b><br>Un momento chiave in questa trasformazione fu l'apertura, nel 1906, del grande magazzino Mitsukoshi, il primo punto vendita al dettaglio in stile moderno di tutta la Corea, seguito negli anni '20 da altri due grandi magazzini, Georgia e Minakai.<br><br><b>La Cattedrale di Myeongdong</b><br>Nel cuore del quartiere sorge anche la Cattedrale di Myeongdong, la cui costruzione iniziò nel 1894, progettata da missionari francesi e realizzata da artigiani cinesi con mattoni rossi e grigi. Completata nel 1898, fu all'epoca l'edificio più alto di Seoul, oltre che la prima cattedrale in stile gotico revival dell'intera Corea. Negli anni '70 e '80, durante i periodi di governo militare, la cattedrale ebbe un ruolo politico di primo piano, diventando un simbolo del movimento pro-democrazia coreano.<br><br><b>Il boom del dopoguerra e l'esplosione globale</b><br>Dopo la guerra di Corea, il settore finanziario si espanse fino a Myeongdong. Le Olimpiadi di Seoul del 1988 misero definitivamente il quartiere sulla mappa del turismo internazionale, mentre negli anni '90 e 2000 l'ondata globale del K-pop e dei K-drama contribuì a renderlo una tappa quasi obbligata, consolidando Myeongdong come epicentro mondiale del K-beauty.<br><br><b>Cosa troveremo</b><br>Oggi Myeongdong accoglie circa 2 milioni di visitatori al giorno. Le strade centrali sono pedonalizzate durante il giorno, animate da negozi di cosmetici, grandi magazzini come Lotte e Shinsegae, boutique di marchi internazionali e innumerevoli bancarelle di street food, tra cui spicca il dongaseu (cotoletta di maiale in stile coreano).", img:"Myeongdong.jpg", tip:"Si trova a pochi minuti a piedi da Namdaemun Market. La sera, quando le insegne al neon si accendono e le bancarelle di street food occupano le strade pedonali, l'atmosfera cambia notevolmente rispetto al giorno.", move:"Partenza alle 12:30 verso Myeongdong Kyoja per pranzo (nella stessa zona).<br><b>Indirizzo per Naver:</b><br><br>서울 중구 명동10길 29"},
   {n:"[12:30] Pranzo: Myeongdong Kyoja", d:"<b>Una storia che comincia con un nome diverso</b><br>Il ristorante ha aperto nel 1966, all'epoca con il nome di Myeongdong Kalguksu, in un'altra zona di Seoul, per poi trasferirsi pochi anni dopo nel quartiere che gli avrebbe dato fama. Con il tempo, il successo del locale generò numerosi imitatori con nomi simili: per distinguersi definitivamente dalla concorrenza, nel 1978 la famiglia proprietaria cambiò il nome nell'attuale Myeongdong Kyoja, usando il termine sino-coreano per mandu (kyoja) proprio per rendere il marchio più difficile da copiare.<br><br><b>Un menu che non cambia da decenni</b><br>Il locale è oggi un vero e proprio simbolo della cucina di conforto coreana a Seoul, tanto da essere stato ufficialmente designato Patrimonio Futuro della città. Il menu è rimasto sostanzialmente identico nel corso degli anni, limitato a soli quattro piatti: kalguksu, mandu, bibim guksu e, solo in estate, kongguksu. Il locale ha inoltre ottenuto il riconoscimento Bib Gourmand della Guida Michelin per diversi anni consecutivi.<br><br><b>Il piatto simbolo: un kalguksu diverso dal solito</b><br>A differenza del kalguksu tradizionale, generalmente preparato con un brodo di pesce chiaro, la versione di Myeongdong Kyoja utilizza un brodo ricco a base di pollo e ossa, fatto sobbollire a lungo fino a raggiungere una consistenza quasi cremosa. I noodle vengono ancora tagliati a mano ogni mattina, e il piatto viene servito con carne macinata saltata, cipollotto e quattro piccoli mandu triangolari nascosti tra i noodle.<br><br><b>Un contorno diventato quasi più famoso del piatto principale</b><br>Molti clienti abituali parlano quasi più del kimchi che accompagna ogni ordinazione, più aggressivo e piccante rispetto al classico baechu-kimchi, che dei noodle stessi.", img:"Myeongdong Kyoja.jpg", tip:"La sede principale si trova al 29 di Myeongdong 10-gil, con altre due filiali nelle vicinanze. Essendo un locale molto frequentato, conviene arrivare presto, idealmente proprio all'apertura (10:30). I mandu sono l'unico piatto disponibile anche da asporto. Un pasto completo per due persone si aggira comodamente sotto i 30.000 won.", move:"Partenza alle 14:30 verso Ihwa Mural Village.<br><b>Indirizzo per Naver:</b><br><br>서울 종로구 이화장길 27"},
   {n:"[14:30] Ihwa Mural Village", d:"<b>Un villaggio della luna</b><br>Ihwa-dong è uno dei quartieri più antichi di Seoul, situato ai piedi di Naksan, una delle montagne che circondano il centro storico della città, proprio lungo un tratto delle antiche mura Hanyangdoseong. Come molti quartieri collinari sorti in questa forma, era conosciuto come daldongnae, letteralmente villaggio della luna: durante la guerra di Corea, questi quartieri divennero rifugio per gli sfollati che non potevano permettersi di vivere nelle zone più centrali della città.<br><br><b>Un quartiere destinato alla demolizione</b><br>Con il passare dei decenni e il boom economico coreano, molti abitanti più giovani lasciarono il quartiere, lasciandolo decadere progressivamente. Entro i primi anni 2000, il quartiere era stato ufficialmente designato per la demolizione.<br><br><b>Il progetto artistico che lo ha salvato (per un po')</b><br>Nel 2006, il Ministero della Cultura, dello Sport e del Turismo lanciò l'iniziativa Art in the City: il progetto realizzato a Ihwa-dong, noto come Naksan Public Art Project, coinvolse oltre 70 tra artisti, studenti universitari e volontari, che nel giro di circa sei mesi dipinsero muri, scale e vicoli del quartiere con murales colorati.<br><br><b>Il conflitto con i residenti</b><br>Il successo del progetto ebbe però un effetto collaterale importante: il quartiere iniziò ad attirare un numero crescente di turisti, con conseguenti problemi di rumore, rifiuti abbandonati e comportamenti irrispettosi. Già circa un anno dopo l'avvio del progetto, gli stessi residenti iniziarono a chiedere la rimozione di alcuni murales, culminati nel 2016 con la cancellazione della celebre scalinata dei pesci koi, uno dei murales più fotografati e riconoscibili del villaggio, oggi visibile solo nelle cartoline vendute in un negozio di souvenir locale.<br><br><b>Cosa troveremo oggi</b><br>Il villaggio conserva ancora diversi murales, sebbene meno numerosi rispetto al progetto originale, sparsi tra vicoli stretti e scalinate che regalano scorci panoramici sorprendenti sulla città sottostante. Non lontano si trova Naksan Park, da cui si può camminare lungo un tratto delle antiche mura di Seoul. Nella stessa zona si trova anche Ehwajang, l'ex residenza del primo presidente della Corea del Sud, Syngman Rhee.", img:"Ihwa Mural Village.jpg", tip:"Essendo un quartiere ancora abitato e già segnato da tensioni passate legate al comportamento dei visitatori, è particolarmente importante mantenere un atteggiamento rispettoso, evitando di sbirciare o fotografare dentro le case private. Si raggiunge facilmente dalla stazione di Hyehwa (linea 4, uscita 2)."},

mento Bib Gourmand della Guida Michelin ha ulteriormente consacrato il locale.", img:"Imun Seolnongtang.jpg", tip:"Si trova in un vicolo appartato vicino a Insadong, all'indirizzo 38-13 Ujeongguk-ro, Jongno-gu, ed è comodamente raggiungibile dalla stazione di Jonggak (linea 1, uscita 3-1), a circa 150 metri di distanza. Apre presto, dalle 8:00, rendendolo un'ottima opzione anche per una colazione sostanziosa, con orario 8:00-21:00 nei giorni feriali e fino alle 20:00 la domenica, con una pausa pomeridiana dalle 15:00 alle 17:00. Sul tavolo si trovano sale e cipollotto per personalizzare il condimento, oltre a kimchi e kkakdugi illimitati."}

/* ============================================================
   RENDER
   ============================================================ */
const navContent = document.getElementById('navContent');
const page = document.getElementById('page');

function regionDays(key){ return DAYS.filter(d=>d.region===key); }

function emphasizeLast(str){
  const parts = str.split(' ');
  if(parts.length===1) return `<em>${str}</em>`;
  const last = parts.pop();
  return `${parts.join(' ')} <em>${last}</em>`;
}

function buildSidebar(){
  let html = `<div class="navgroup">
    <button class="infolink" data-target="info" id="navInfo">🧭 &nbsp;Prima di partire</button>
  </div>
  <div class="navgroup"><div class="navgroup-label">Itinerario giorno per giorno</div>`;

  Object.keys(REGIONS).forEach(key=>{
    if(key==="info") return;
    const r = REGIONS[key];
    const days = regionDays(key);
    if(!days.length) return;
    html += `<div class="region-block">
      <div class="region-head"><span class="dot" style="background:${r.color}"></span>${r.label}</div>`;
    days.forEach(d=>{
      html += `<button class="daylink" data-target="day-${d.id}" data-region="${key}" style="--accent:${r.color}">
        <span class="num">${String(d.id).padStart(2,'0')}</span> ${d.date.split(' ').slice(0,2).join(' ')}
      </button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  navContent.innerHTML = html;

  navContent.querySelectorAll('.daylink').forEach(btn=>{
    btn.addEventListener('click', ()=> showDay(parseInt(btn.dataset.target.replace('day-',''))));
  });
  document.getElementById('navInfo').addEventListener('click', showInfo);
}

function setActiveNav(target){
  document.querySelectorAll('.daylink, .infolink').forEach(el=>el.classList.remove('active'));
  const el = document.querySelector(`[data-target="${target}"]`);
  if(el) el.classList.add('active');
}

function galleryCardHTML(p, accent, i){
  const media = p.img
    ? `<img class="g-img" src="${p.img}" alt="${p.n}" loading="lazy">`
    : `<div class="g-img-ph" style="--accent:${accent}">${p.n}</div>`;
  return `<div class="g-card">
    ${media}
    <div class="g-cap"><h4>${p.n}</h4><span class="g-num">${String(i+1).padStart(2,'0')}</span></div>
    <p>${p.d}</p>
    ${p.tip ? `<div class="tip"><b>💡</b><span>${p.tip}</span></div>` : ''}
    ${p.move ? `<div class="tip"><b>🚗</b><span>${p.move}</span></div>` : ''}
  </div>`;
}

function showDay(id){
  const d = DAYS.find(x=>x.id===id);
  if(!d) return;
  const r = REGIONS[d.region];
  const idx = DAYS.findIndex(x=>x.id===id);
  const prev = DAYS[idx-1];
  const next = DAYS[idx+1];
  const heroImg = HERO_IMG[d.region] || '';

  page.innerHTML = `
    <div class="hero" style="--accent:${r.color};${heroImg ? `background-image:url('${heroImg}')` : `background:linear-gradient(135deg,${r.color},#20242c)`}">
      <div class="hero-inner">
        <div class="hero-eyebrow">§ ${String(d.id).padStart(2,'0')} / 16 <span class="sep">·</span> ${r.label} <span class="sep">·</span> ${d.date}</div>
        <h2>${emphasizeLast(d.city)}</h2>
        <div class="sub">${d.hotel && d.hotel !== '—' ? 'Pernottamento: ' + d.hotel : ''}</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat"><b>${String(d.id).padStart(2,'0')} / 16</b><span>Giorno di viaggio</span></div>
      ${d.flight ? `<div class="stat"><b>✈</b><span>${d.flight}</span></div>` : ''}
      <div class="stat"><b>${d.schedule && d.schedule.length ? d.schedule.length : '—'}</b><span>Tappe in programma</span></div>
    </div>

    ${d.note ? `<div class="note-box">${d.note}</div>` : ''}

    <div class="content-pad">
    ${d.schedule && d.schedule.length ? `
    <div class="block-title">Programma orario</div>
    <div class="legend" style="--accent:${r.color}">
      <span><i></i>Tappa/visita</span>
      <span><i class="meal-i"></i>Pasto</span>
      <span><i class="transfer-i"></i>Spostamento / partenza</span>
      <span><i class="logistics-i"></i>Sveglia · check-in/out · bagagli</span>
    </div>
    <div class="timeline" style="--accent:${r.color}">
      ${d.schedule.map(s=>`<div class="tl-item ${s.type}" style="--accent:${r.color}">
        <div class="tl-time">${s.time}</div>
        <div class="tl-text">${s.text}</div>
      </div>`).join('')}
    </div>` : ''}

    ${d.places && d.places.length ? `
    <div class="block-title">Cosa vedrete — info utili</div>
    <div class="gallery">
      ${d.places.map((p,i)=>galleryCardHTML(p, r.color, i)).join('')}
    </div>` : ''}
    </div>

    <div class="foot-nav">
      <button class="foot-btn" ${prev? '' : 'disabled'} id="prevBtn">
        <span class="lbl">← Giorno precedente</span>
        <span class="nm">${prev ? prev.city + ' — ' + prev.date : ''}</span>
      </button>
      <button class="foot-btn right" ${next? '' : 'disabled'} id="nextBtn">
        <span class="lbl">Giorno successivo →</span>
        <span class="nm">${next ? next.city + ' — ' + next.date : ''}</span>
      </button>
    </div>
  `;
  setActiveNav(`day-${id}`);
  window.scrollTo({top:0, behavior:'instant'});
  if(prev) document.getElementById('prevBtn').addEventListener('click', ()=>showDay(prev.id));
  if(next) document.getElementById('nextBtn').addEventListener('click', ()=>showDay(next.id));
  closeMobileNav();
}

function showInfo(){
  const totalDays = DAYS.length;
  const totalRegions = Object.keys(REGIONS).length - 1;
  page.innerHTML = `
    <div class="info-hero">
      <div class="info-hero-inner">
        <div class="hero-eyebrow">🧭 Guida rapida</div>
        <h2>Prima di <em>partire</em></h2>
        <p>${INFO.intro}</p>
      </div>
    </div>
    <div class="info-stats">
      <div class="stat"><b>${totalDays}</b><span>Giorni di viaggio</span></div>
      <div class="stat"><b>${totalRegions}</b><span>Tappe · regioni</span></div>
      <div class="stat"><b>15—30</b><span>Agosto 2026</span></div>
    </div>
    <div class="info-grid">
      ${INFO.cards.map(c=>`
        <div class="info-card">
          <h3>${c.icon} ${c.title}</h3>
          <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>
      `).join('')}
    </div>
  `;
  setActiveNav('info');
  window.scrollTo({top:0, behavior:'instant'});
  closeMobileNav();
}

/* mobile nav toggle */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
document.getElementById('menuToggle').addEventListener('click', ()=>{
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', ()=>{
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
});
function closeMobileNav(){
  if(window.innerWidth<=900){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
}

/* init */
buildSidebar();
showInfo();
</script>
</body>
