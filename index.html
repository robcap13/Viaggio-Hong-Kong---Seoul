    {n:"[9:00] Gamcheon Culture Village", d:"Inizieremo la giornata visitando il Gamcheon Culture Village. Il modo più classico per visitare il villaggio è seguire la mappa dei timbri, acquistabile al centro informazioni all'ingresso per 2.000 won (apre alle 9:00, ma si consiglia di arrivare un po' prima per evitare code), che guida i visitatori lungo un percorso tra installazioni artistiche, gallerie improvvisate e punti panoramici, incluse le celebri statue del Piccolo Principe e della volpe, tra le più fotografate di tutto il villaggio.<br><br><b>Le origini: un rifugio per gli sfollati della guerra</b><br>Le prime abitazioni sulla collina dove sorge oggi il villaggio furono costruite negli anni '20-'30 del Novecento per ospitare i lavoratori del vicino porto di Busan. La svolta demografica arrivò però con la guerra di Corea (1950-1953): Busan fu l'unica grande città del paese a non cadere mai sotto il controllo delle forze nordcoreane, e per questo divenne un rifugio per centinaia di migliaia di sfollati provenienti da tutto il paese. Tra questi, un ruolo particolare lo ebbero i seguaci del movimento religioso Taegukdo, un gruppo che si stabilì proprio su questa collina scoscesa e apparentemente inabitabile, costruendo case addossate le une alle altre secondo una disposizione a terrazze studiata apposta perché nessuna abitazione ne oscurasse un'altra, garantendo a tutti vista e luce naturale.<br><br><b>Da quartiere povero a simbolo della città</b><br>Per decenni Gamcheon rimase uno dei quartieri più poveri di Busan, isolato dal resto della città sia fisicamente, per la sua posizione sulla collina, sia socialmente. La svolta arrivò nel 2009, quando l'amministrazione cittadina avviò un progetto di rigenerazione urbana in collaborazione con artisti, studenti e gli stessi abitanti del quartiere, che dipinsero le case con colori vivaci e realizzarono murales, installazioni e piccole gallerie lungo i vicoli, mantenendo però i residenti originali nelle proprie abitazioni. Da allora il villaggio è diventato una delle mete più visitate di tutta la Corea del Sud, ed è oggi conosciuto con soprannomi come la Santorini della Corea o il Machu Picchu coreano, per la particolare disposizione delle case colorate lungo il pendio della vallata.<br><br><b>Un'eredità culturale della guerra, anche a tavola</b><br>Busan porta ancora oggi tracce culturali dirette di quel periodo: piatti come il milmyeon, un piatto di noodle di grano nato dall'incontro tra la tradizione culinaria nordcoreana portata dai profughi e l'influenza americana della presenza militare alleata, o il donkkaeguk (zuppa di ossa di maiale), inventato per sfruttare al massimo le poche parti di carne disponibili in tempo di guerra, restano oggi piatti tipici della cucina cittadina.<br><br><b>Un dettaglio da conoscere</b><br>Dietro la facciata colorata e instagrammabile, Gamcheon resta un quartiere abitato, non un parco a tema: negli ultimi anni il sovraffollamento turistico ha creato non poche tensioni con i residenti, alle prese con rumore, traffico pedonale e perdita di privacy nella vita quotidiana. È un aspetto utile da avere presente, magari mantenendo un atteggiamento rispettoso mentre si passeggia tra le case abitate.", img:"Gamcheon Culture Village.jpg", tip:"Il percorso ufficiale dei timbri (Route C, o Stamp Course) è pensato per durare circa 2 ore su carta, con circa 12-22 tappe/timbri a seconda della mappa. Nella pratica, però, quasi tutti finiscono per metterci di più: tra foto, code per la statua del Piccolo Principe e qualche sosta nei negozietti o nei caffè lungo il percorso, la maggior parte dei visitatori riporta un totale di 3-4 ore per completarlo davvero con calma. Ci sono anche due percorsi più brevi segnati sulla stessa mappa: uno di circa 40 minuti che copre solo la via principale, e uno intermedio di circa 1h20 con i punti più importanti.", move:"Partenza alle 11:00 verso Songdo Bay Station (circa 11 min).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 서구 송도해변로 171"},
    {n:"[11:30] Songdo (cabinovia, ponte sospeso, Sky Park)", d:"<b>Songdo Beach: la prima spiaggia pubblica della Corea</b><br>Prima di parlare delle attrazioni vere e proprie, vale la pena sapere che Songdo Beach, il punto di partenza di questo tratto di costa, è stata la prima spiaggia pubblica organizzata di tutta la Corea, un titolo che le ha dato un valore storico oltre che turistico, e che nel tempo ha portato alla riqualificazione di tutta l'area, oggi ricca di attrazioni concentrate in pochi chilometri di costa.<br><br><b>La cabinovia: da pionieristica a rinnovata</b><br>La cabinovia che parte da Songdo Bay Station, oggi nota come Busan Air Cruise, nacque nel 1964 come la prima linea di cabinovia di tutta la Corea del Sud. Rimasta poi chiusa e dismessa per diversi decenni, è stata completamente rinnovata e riaperta nel 2017 con il nome attuale. Il percorso, lungo circa 1,6 km, collega Songdo Bay Station, nel parco Songnim, con Songdo Sky Park, nel parco Amnam, offrendo dall'alto una vista panoramica sulla costa di Songdo Beach, sul ponte Namhang e sulle scogliere frastagliate della zona. Per chi vuole un'esperienza ancora più suggestiva, esiste anche la variante Crystal Cruise, con il fondo della cabina in vetro trasparente.<br><br><b>Songdo Yonggung Suspension Bridge: una storia di ricostruzione</b><br>Il ponte sospeso attuale ha una storia piuttosto travagliata. Un primo ponte sospeso, che collegava la stessa zona all'isolotto disabitato di Dongseom, fu gravemente danneggiato dal tifone Thelma nel 1987 e infine smantellato nel 2002. Solo il 4 giugno 2020, dopo 18 anni di assenza, è stato inaugurato l'attuale Songdo Yonggung Suspension Bridge, lungo 127,1 metri e largo 2 metri, che porta i visitatori fino a una sezione circolare che avvolge la sommità dell'isolotto. Il nome Yonggung significa letteralmente palazzo del drago, in riferimento al mitico palazzo sottomarino del Re Drago della tradizione popolare coreana, la stessa figura leggendaria che ricorre anche in altri luoghi della costa coreana legati al mare.<br><br><b>Songdo Sky Park</b><br>Songdo Sky Park, situato nel parco Amnam all'arrivo della cabinovia, è il punto di raccordo tra le diverse attrazioni della zona: da qui partono sia il sentiero verso il ponte sospeso, sia i percorsi panoramici di Amnam Park, un'area boschiva di pini che offre diversi sentieri escursionistici con vista sul mare, sulle navi in transito e sulle scogliere della costa.<br><br><b>Cosa troveremo</b><br>Il percorso ideale collega tutte queste tappe in sequenza: si parte con la cabinovia da Songdo Bay Station, si arriva a Songdo Sky Park, da cui si raggiunge a piedi in pochi minuti il ponte sospeso, per poi eventualmente proseguire lungo i sentieri di Amnam Park. Nel parcheggio di Amnam Park si trovano inoltre diversi ristoranti specializzati in vongole e frutti di mare alla griglia, una tappa gustosa per concludere la visita.", img:"Songdo.jpg", tip:"Gli orari di chiusura di cabinovia e ponte sospeso non sempre coincidono, quindi conviene organizzare la visita partendo dalla cabinovia per poi dirigersi verso il ponte, così da non rischiare di trovarlo già chiuso. Il ponte sospeso è generalmente aperto dalle 9:00 alle 18:00 nei mesi più caldi (marzo-settembre) e fino alle 17:00 negli altri mesi, con chiusura nel primo e terzo lunedì del mese. In caso di maltempo il ponte può essere chiuso per motivi di sicurezza, quindi vale la pena controllare le condizioni meteo prima di andare.", move:"Partenza alle 13:30 verso Jagalchi Market (circa 17 min).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 중구 자갈치해안로 52"},
    {n:"[14:00] Pranzo: Jagalchi Market, Gukje Market e BIFF Square", d:"<b>Un unico quartiere, tre anime diverse</b><br>Questi tre luoghi si trovano praticamente a due passi l'uno dall'altro nel quartiere di Nampo-dong, e condividono tutti una storia radicata nel dopoguerra e nella ricostruzione di Busan, pur avendo oggi caratteri molto diversi tra loro: un mercato del pesce, un mercato generalista e una piazza dedicata al cinema. Ci fermeremo qui per mangiare qualcosa.<br><br><b>Jagalchi Market</b><br>Il nome Jagalchi deriva da jagal, che significa ghiaia, un riferimento alla spiaggia sassosa su cui sorgeva originariamente il mercato. Le prime bancarelle di pesce nacquero già durante l'occupazione giapponese, ma fu soprattutto dopo la guerra di Corea (1950-1953) che il mercato si consolidò nella sua forma attuale, quando l'arrivo di enormi masse di profughi in una delle poche città mai conquistate dalle forze nordcoreane portò alla nascita di baraccopoli e di un'economia di sussistenza legata alla pesca. Oggi è il più grande mercato ittico della Corea del Sud, ed è conosciuto anche per le sue storiche venditrici, chiamate Jagalchi ajumeoni, che da generazioni animano il mercato e sono considerate un vero simbolo della città. L'edificio coperto che ospita il mercato oggi risale al 2006, ma il mercato all'aperto lungo il molo, con le bancarelle di pesce fresco esposte su cassette di legno, resta la parte più autentica e fotografata.<br><br><b>Gukje Market</b><br>Gukje significa letteralmente internazionale, un nome che racconta bene le sue origini: nacque anch'esso nei primi anni '50 per mano dei profughi della guerra di Corea, che qui vendevano beni di importazione, spesso surplus militare americano, e in alcuni casi merce di contrabbando, sfruttando la posizione di Busan come principale porto del paese. Da quel nucleo di bancarelle improvvisate si è sviluppato nel tempo uno dei più grandi mercati tradizionali della Corea del Sud, oggi un dedalo di vicoli coperti che vendono di tutto, dalla ferramenta ai tessuti, dagli elettrodomestici al cibo di strada. Il mercato è diventato anche protagonista cinematografico grazie al film del 2014 Ode to My Father (conosciuto in coreano proprio come Gukje Market), che racconta la storia di una famiglia di profughi proprio a partire da questi luoghi.<br><br><b>BIFF Square</b><br>BIFF sta per Busan International Film Festival, uno dei festival cinematografici più importanti di tutta l'Asia. La piazza, ufficialmente inaugurata il 13 settembre 1996 in occasione della prima edizione del festival, si trova all'estremità nord di Gukje Market e per decenni, già a partire dagli anni '60, il quartiere di Nampo-dong ospitava circa venti sale cinematografiche, rendendolo il vero e proprio cuore cinematografico storico della città ancora prima della nascita del festival. Lungo il marciapiede della piazza sono incastonati blocchi di cemento con le impronte delle mani di registi e attori che hanno partecipato al festival nel corso degli anni, tra cui anche nomi internazionali come Quentin Tarantino.", img:"Jagalchi Market.jpg", tip:"<b>Cibi tipici del Mercato di Jagalchi</b><br>Hoe (sashimi coreano) — pesce crudo appena pescato, come tonno, polpo e orata, servito con salse speciali.<br>Eomuk — polpetta di pasta di pesce, fritta o cotta nel brodo, spesso su spiedino.<br>Ganjang Gejang — granchio marinato in salsa di soia, dal sapore intenso, ottimo con riso.<br>Godeungeo-gui — sgombro grigliato marinato in salsa piccante, servito con kimchi.<br>Jogaetang — zuppa di vongole con verdure in brodo di pesce, leggermente piccante.<br><br><b>Cibi tipici del Mercato di Gukje</b><br>Gimbap — involtini di riso e alga.<br>Frittelle di frutti di mare — street food salato a base di pesce.<br>Hotteok — pancake dolce ripieno.<br>Sundae — salsiccia di sanguinaccio coreana.<br>Fish cake e tteokbokki — presso uno stand centrale molto affollato, tra i più apprezzati della città.", move:"Bosu Book Street è a pochi passi da qui, nello stesso quartiere.<br><b>Indirizzo per Naver:</b><br><br>부산광역시 중구 보수동1가 119"},
    {n:"[16:00] Bosu Book Street", d:"<b>Come è nata</b><br>La strada si trova nel quartiere di Bosu-dong, a Jung-gu, e le sue origini risalgono al periodo della guerra di Corea (1950-1953), quando Busan divenne la capitale provvisoria del paese, non essendo mai caduta sotto il controllo delle forze nordcoreane. Secondo il racconto tramandato dagli stessi commercianti della via, tutto iniziò quando una coppia di profughi provenienti dalla provincia nordcoreana di Hamgyong Settentrionale cominciò a vendere riviste e libri usati appoggiati su semplici scatole di cartone lungo la strada. Con l'arrivo di sempre più sfollati concentrati nella vicina Gukje Market, molti studenti e intellettuali si trovarono nella condizione di non poter più permettersi libri nuovi per continuare gli studi: da questa necessità nacque una fitta rete di librerie dell'usato, alimentata anche da chi, per sopravvivere, era costretto a vendere i propri libri pur di procurarsi cibo.<br><br><b>Una crescita continua nel dopoguerra</b><br>Nel corso degli anni '70 la strada arrivò a contare oltre 70 librerie, diventando un vero e proprio simbolo della voglia di conoscenza e istruzione che animava la Busan del dopoguerra, anche nei momenti più difficili, quando intere famiglie vivevano ammassate in un'unica stanza. Negli ultimi decenni, però, la diffusione delle grandi catene di librerie e degli e-book ha più che dimezzato il numero di negozi: oggi ne restano circa una trentina, ancora attivi lungo i circa 200 metri della via.<br><br><b>Il riconoscimento ufficiale</b><br>Nel 2019 l'amministrazione di Busan ha dichiarato la strada Patrimonio Futuro della città, un riconoscimento pensato per preservarne il valore storico e simbolico come spazio culturale dedicato agli amanti dei libri, attivo ormai da oltre settant'anni.<br><br><b>Un simbolo della sua rinascita</b><br>Un esempio recente degli sforzi per mantenere viva la strada è il caffè Scoula di Atene, aperto nel marzo 2023: il proprietario, che inizialmente progettava di costruire un normale edificio residenziale di 15 piani sul posto, decise invece di realizzare un edificio a tema letterario, con la facciata dipinta a imitare una fila di libri classici allineati su uno scaffale, proprio per rendere omaggio alla storia del luogo.<br><br><b>Cosa troveremo</b><br>Passeggiando lungo il vicolo si trovano ancora oggi librerie dell'usato una accanto all'altra, con libri in coreano ma anche in inglese, cinese e giapponese, spesso impilati fino al soffitto. Diverse librerie storiche si sono nel tempo trasformate in caffetterie a tema, dove è possibile sfogliare un libro sorseggiando una bevanda calda, mantenendo comunque viva l'atmosfera vintage e un po' nostalgica della via.", img:"Bosu Book Street.jpg", tip:"Essendo a pochi passi da BIFF Square e da Gukje Market, è la tappa ideale per una pausa più tranquilla e rilassata dopo la confusione dei mercati. Anche senza saper leggere il coreano, vale la pena passeggiarci per l'atmosfera e magari fermarsi in una delle librerie-caffetteria: bastano 20-30 minuti per un giro completo della via.", move:"Partenza alle 17:30 verso Yongdusan Park e Torre di Busan (circa 10 min).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 중구 용두산길 37-55"},
    {n:"[18:00] Yongdusan Park e Torre di Busan (Busan Diamond Tower)", d:"<b>Il nome: la montagna a forma di drago</b><br>Yongdusan significa letteralmente montagna testa di drago, un nome che deriva dalla forma stessa del rilievo, alto circa 69 metri, che ricorda proprio una testa di drago che emerge dal mare. In origine la montagna si chiamava Songhyeonsan, nome che alludeva alla vista sul mare che si apriva tra i pini della fitta foresta che un tempo la ricopriva. Secondo la tradizione popolare, la forma stessa del monte era ritenuta capace di proteggere la città dalle invasioni provenienti dal mare, quasi fosse davvero uno spirito guardiano.<br><br><b>Un luogo che ha attraversato la storia di Busan</b><br>Nel corso del tempo quest'area ha ospitato realtà molto diverse tra loro: durante la dinastia Joseon vi sorgeva un waegwan, un insediamento etnico giapponese autorizzato al commercio, mentre durante l'occupazione coloniale giapponese vi fu costruito un santuario shintoista. Con l'arrivo della guerra di Corea, la collina si riempì di baraccopoli costruite dagli sfollati che affluivano in massa nella città, fino alla cima stessa del monte: diversi incendi distrussero più volte queste abitazioni informali, lasciando la montagna praticamente spoglia. Fu proprio a partire da questa condizione che, nel 1953, subito dopo la fine della guerra, l'amministrazione cittadina decise di trasformare l'area in un parco pubblico, pensato come luogo di svago e sollievo per una popolazione reduce da anni durissimi, ripiantumando la vegetazione da zero.<br><br><b>I monumenti del parco</b><br>Oggi il parco ospita diversi monumenti stratificati nel tempo: la statua dell'ammiraglio Yi Sun-sin, comandante navale del XVI secolo passato alla storia per aver respinto le invasioni giapponesi con le sue celebri navi tartaruga, il Cheokhwabi, un'antica stele che commemorava l'esclusione delle potenze straniere dalla Corea, il Chunghontap, una torre commemorativa dedicata alle vittime della guerra di Corea, e un monumento dedicato alla rivoluzione del 19 aprile 1960, il movimento studentesco che portò alle dimissioni del presidente Syngman Rhee. Non manca inoltre un celebre orologio floreale e la campana dei cittadini, che viene suonata ogni anno a mezzanotte per salutare l'arrivo del nuovo anno.<br><br><b>La Torre di Busan</b><br>Costruita nel 1973, la torre è alta 120 metri ed è stata concepita fin dall'origine come struttura puramente ricreativa e panoramica, senza alcuna funzione di trasmissione radiotelevisiva. Nel 2021 è stata sottoposta a un'importante ristrutturazione e rinominata Busan Diamond Tower, con la sommità ridisegnata prendendo ispirazione dal baldacchino della pagoda Dabotap del tempio di Bulguksa a Gyeongju, uno dei tesori nazionali più importanti della Corea. Dalla terrazza panoramica si gode di una vista a 360 gradi sulla città, sul porto storico di Busan, che durante la guerra di Corea fu il punto di arrivo di centinaia di migliaia di rifugiati e degli aiuti militari americani, e sull'isola di Yeongdo.<br><br><b>Cosa troveremo</b><br>Oltre alla torre e ai monumenti, il parco offre diversi punti panoramici gratuiti anche senza salire in cima, ed è collegato al quartiere sottostante da una lunga scala mobile di 87 metri che parte da Gwangbok-ro, la strada dello shopping più famosa della zona, rendendo la salita più agevole. Alla base del parco si trova inoltre il Museo di Storia Moderna di Busan, che approfondisce proprio il ruolo della città come rifugio durante la guerra e come porta d'accesso economica della Corea verso il mondo.", img:"Yongdusan Park e Torre di Busan.jpg", tip:"Il parco è gratuito e sempre accessibile, mentre l'ingresso alla torre panoramica ha un costo (circa 12.000 won per gli adulti). Essendo proprio sopra Gwangbok-ro e a pochi minuti da Gukje Market, BIFF Square e Bosu Book Street, è la tappa ideale per chiudere la giornata: il tramonto e le prime luci notturne della città viste dall'alto della torre sono uno dei momenti più suggestivi di tutta Busan.", move:"Per cena ci sposteremo verso Gwangalli Beach, alla ricerca di un ristorante con vista sul ponte (ancora da scegliere).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 수영구 광안해변로 219"},
    {n:"[19:30] Cena: ristorante vista ponte a Gwangalli Beach", d:"Per cena ci sposteremo a Gwangalli Beach, in cerca di un ristorante con vista sul Gwangan Bridge (광안대교), il ponte illuminato che attraversa la baia — uno degli scorci più celebri di Busan, soprattutto di sera quando le luci LED del ponte cambiano colore. Il locale specifico non è stato ancora scelto.", img:"Gwangalli Beach.jpg", tip:"Non appena scegliamo un ristorante specifico, aggiungiamo qui indirizzo e dettagli."}

  places:[
    {n:"[9:30] Oryukdo Skywalk", d:"<b>Il nome: cinque o sei isole</b><br>Oryukdo significa letteralmente cinque o sei isole, un nome che nasce da un fenomeno legato alla marea: due delle formazioni rocciose, Bangpaeseom e Solseom, sono unite alla base ma separate in superficie, così che con la bassa marea appaiono come un'unica isola, mentre con l'alta marea l'acqua le separa visivamente in due, facendo apparire l'intero gruppo ora di cinque, ora di sei isole. Le sei formazioni, nell'ordine dalla costa verso il mare, sono Bangpaeseom, Solseom, Suriseom, Songgotseom, Gulseom e Deungdaeseom, quest'ultima sede di un faro costruito nel 1937 a guida delle navi dirette al porto di Busan.<br><br><b>Come si sono formate</b><br>Le isole fanno parte del Geoparco Nazionale di Busan e sono il risultato di processi vulcanici risalenti a circa 80 milioni di anni fa, che hanno dato origine alle scogliere quasi verticali e alle piattaforme rocciose che caratterizzano ancora oggi il paesaggio. L'area è stata dichiarata monumento naturale nazionale numero 24 nel 2007, dopo essere già stata riconosciuta come sito storico e panoramico di Busan fin dal 1972.<br><br><b>Da zona militare a parco pubblico</b><br>Fino al 1993 l'area di Oryukdo era una zona militare chiusa al pubblico, utilizzata per scopi di difesa costiera. Solo dopo la sua apertura è stata progressivamente trasformata nel parco panoramico che visitiamo oggi, con lo skywalk di vetro inaugurato nel 2013: una passerella a sbalzo lunga 15 metri, sospesa a circa 35 metri sul livello del mare, che permette di guardare le onde infrangersi direttamente sotto i piedi attraverso il pavimento trasparente.<br><br><b>Cosa troveremo</b><br>Oltre allo skywalk, il sito comprende Oryukdo Sunrise Park, punto di partenza del lunghissimo sentiero costiero Haeparang (770 km, il più lungo della Corea del Sud, che arriva fino alla provincia di Gangwon), e un piccolo molo chiamato Haenyeochon, dove le haenyeo, le pescatrici subacquee tradizionali, vendono il pescato fresco della giornata in un piccolo mercato informale.", img:"Oryukdo Skywalk.jpg", tip:"L'ingresso è gratuito e lo skywalk è aperto indicativamente dalle 9:00 alle 18:00 (fino alle 19:00 nei mesi estivi), ma può chiudere in caso di vento forte o pioggia. Ai piedi dello skywalk vengono fornite delle soprascarpe per proteggere il pavimento di vetro. Le ore migliori per la luce sono la mattina presto o il tardo pomeriggio."},
    {n:"[10:30] Igidae Coastal Trail", d:"<b>Il nome: la platea delle due gisaeng</b><br>Igidae significa letteralmente la platea delle due gisaeng, e il nome racconta una delle leggende più toccanti legate alla Guerra Imjin, l'invasione giapponese della Corea del 1592. Si narra che, dopo la conquista della fortezza di Suyeongseong da parte delle truppe giapponesi, i comandanti nemici organizzarono un banchetto per celebrare la vittoria proprio su queste scogliere, facendosi accompagnare da alcune gisaeng, le tradizionali intrattenitrici della dinastia Joseon. Due di loro afferrarono un generale giapponese ubriaco e si gettarono con lui in mare dalla scogliera, sacrificando la propria vita in un gesto di resistenza contro l'invasore. Nel 2013 sono state ritrovate nella zona quelle che si ritiene siano le tombe delle due donne.<br><br><b>Da zona militare a parco naturale</b><br>Come Oryukdo, anche quest'area fu per decenni una zona militare chiusa al pubblico, utilizzata per scopi di sorveglianza costiera, e lungo il percorso sono ancora visibili alcune vecchie postazioni di guardia. Il parco è stato aperto ufficialmente nel 1993, mentre il sentiero vero e proprio, oggi molto amato dagli abitanti di Busan, è diventato un percorso escursionistico organizzato a partire dal 2005.<br><br><b>Il paesaggio geologico</b><br>Igidae fa parte dello stesso geoparco nazionale di Oryukdo, ed è famoso per le sue formazioni rocciose modellate nei millenni da onde e vento, tra cui spiccano Nongbawi, una roccia in equilibrio precario sulla scogliera, e Chimabawi, un'ampia piattaforma di roccia liscia che si protende verso il mare. Il sentiero, lungo circa 4,7 km, collega Oryukdo Skywalk a Dongsaengmal, passando per punti panoramici come Igidae Eoulmadang, da cui si gode di una bella vista sul ponte Gwangan e sullo skyline di Haeundae.", img:"Igidae Coastal Trail.jpg", tip:"Il percorso completo richiede circa 2-2,5 ore a passo tranquillo; nel nostro caso ne percorreremo solo un tratto per poi dirigerci verso il pranzo. Consigliamo scarpe comode da cammino, dato che alcuni tratti sono sconnessi o con leggeri saliscendi, e di portare acqua, dato che lungo il sentiero ci sono pochi punti di ristoro.", move:"Partenza alle 13:00 verso il Mercato di Bujeon (circa 20 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 부산진구 중앙대로755번길 21"},
    {n:"[13:30] Pranzo: Mercato di Bujeon e Seomyeon", d:"Ci fermeremo qui per pranzo.<br><br><b>Bujeon Market: nato dai profughi della guerra</b><br>Il mercato di Bujeon è nato subito dopo la fine della guerra di Corea (1950-1953), quando profughi arrivati da ogni parte del paese si stabilirono nella zona e diedero vita a un mercato di sussistenza per sopravvivere nel dopoguerra. A differenza di Gukje Market o Jagalchi, rimasti nel tempo più orientati al turismo, Bujeon è rimasto un mercato quasi esclusivamente frequentato dagli abitanti della città: qui si respira davvero la vita quotidiana di Busan, senza insegne o percorsi pensati per i visitatori.<br><br><b>Cosa troveremo</b><br>Il mercato è oggi coperto da una struttura con cupola di vetro, che permette di visitarlo con qualsiasi condizione meteo, ed è organizzato in diverse sezioni tra cui un mercato del pesce (uno dei due principali di Busan insieme a Jagalchi), un'area dedicata al ginseng e persino un piccolo distretto di elettronica. È inoltre sede dello stabilimento principale di un noto marchio di eomuk (polpette di pasta di pesce), uno dei piatti più identitari di tutta la città. Tra i banchi più celebri ci sono anche quelli di dwaeji gukbap, la zuppa di riso con maiale tipica di Busan, e di kalguksu (tagliatelle in brodo) e gimbap giganti, molto amati dai residenti.<br><br><b>Il legame con Seomyeon</b><br>Il mercato si trova a pochi minuti a piedi sia dalla stazione di Bujeon sia da quella di Seomyeon, ed è cresciuto insieme al quartiere, diventando negli anni un contraltare più genuino e popolare rispetto all'anima commerciale e patinata che Seomyeon ha assunto nel tempo, come principale polo commerciale della città.", img:"Mercato di Bujeon e Seomyeon.jpg", tip:"Essendo un mercato molto vivo e frequentato soprattutto dai residenti, è normale essere urtati o dover farsi largo tra i banchi: fa parte dell'esperienza. È aperto generalmente dalle 6:00 alle 19:00, ed essendo un mercato del pesce vivo, capita di incontrare crostacei e molluschi ancora vivi nei secchi, quindi è un'informazione utile se qualcuno del gruppo fosse sensibile alla cosa. Bastano 30-45 minuti per un giro completo, prima di dedicarsi a Seomyeon vero e proprio.", move:"Partenza alle 14:50 verso Seomyeon (circa 5 min a piedi).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 부산진구 중앙대로 730"},
    {n:"[15:00] Seomyeon", d:"<b>Da villaggio a cuore commerciale della città</b><br>Seomyeon, il cui nome significa letteralmente lato ovest, si trova nel distretto di Busanjin-gu ed è cresciuta da un piccolo villaggio dell'epoca Joseon fino a diventare, a metà del XX secolo, un importante polo industriale: qui sorsero numerose fabbriche e aziende, tra cui i predecessori delle attuali Samsung e LG, favorite dalla vicinanza sia alla ferrovia sia al porto di Busan. Negli anni '70 l'area divenne particolarmente frequentata da lavoratori pendolari, oltre che da studenti universitari, grazie anche ai teatri e alle vie dello shopping che iniziarono a svilupparsi.<br><br><b>La svolta commerciale</b><br>A partire dagli anni '80 le fabbriche vennero progressivamente spostate verso la periferia della città, mentre nell'area cominciarono ad aprire centri commerciali, banche e uffici, consolidando il ruolo di Seomyeon come principale centro commerciale di Busan, un ruolo che mantiene tuttora. Oggi la stazione di Seomyeon è il principale snodo di interscambio tra le linee 1 e 2 della metropolitana cittadina, ed è collegata direttamente ai grandi magazzini Lotte e a un vasto centro commerciale sotterraneo, aperto negli anni '80 come uno dei primi del suo genere in città.<br><br><b>Cosa troveremo</b><br>Il quartiere si divide idealmente in due anime: il lato ovest, più legato allo shopping tradizionale, ai grandi magazzini e alla vita notturna, e il lato est, noto come Seomyeon 2-ga, più orientato ai giovani, con boutique, ristoranti e insegne luminose che di sera animano l'intera area.", img:"Seomyeon.jpg", tip:"Seomyeon è comoda per una pausa shopping o per curiosare tra il centro commerciale sotterraneo e le vie principali. Essendo il centro nevralgico della città, è facilmente raggiungibile da quasi ogni altra zona di Busan tramite la metropolitana.", move:"Partenza alle 15:50 verso Jeonpo Cafe Street (circa 10 min a piedi).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 부산진구 동천로 92"},
    {n:"[16:00] Jeonpo Cafe Street", d:"In zona abbiamo individuato Strut Coffee, dove fermarci per uno spuntino.<br><br><b>Da quartiere di ferramenta a polo creativo</b><br>Fino a poco più di un decennio fa, quella che oggi è conosciuta come Jeonpo Cafe Street era un anonimo quartiere di piccole officine e negozi di ferramenta, dove contrattisti e artigiani si rifornivano di attrezzi, chiodi e materiali da costruzione. A partire dal 2009-2010, giovani imprenditori iniziarono a rilevare questi spazi industriali dismessi, approfittando degli affitti bassi e del fascino grezzo degli ambienti, trasformandoli gradualmente in caffè, gallerie e piccoli locali dal design ricercato.<br><br><b>Il riconoscimento internazionale</b><br>La svolta definitiva è arrivata quando il quartiere è stato inserito dal New York Times tra le destinazioni di viaggio più interessanti al mondo, prima nel 2017 e poi di nuovo nel 2021 tra i 52 luoghi da visitare assolutamente: un riconoscimento che ha reso Jeonpo una tappa fissa negli itinerari di chi visita Busan, oltre che un caso di studio di rigenerazione urbana riuscita.<br><br><b>Cosa troveremo</b><br>Oggi l'area conta decine di caffè, gallerie, boutique e piccoli ristoranti, ricavati spesso in vecchi edifici industriali o abitazioni ristrutturate, con vicoli stretti e irregolari che mantengono comunque un'atmosfera più tranquilla rispetto alla vicina Seomyeon. Lungo la via principale si trovano ormai anche diverse catene (come Starbucks), mentre i locali più originali e caratteristici si sono spostati verso i vicoli laterali, quindi vale la pena allontanarsi un po' dal percorso più battuto. Ogni ottobre si tiene inoltre il Jeonpo Cafe Street Festival, un evento che anima ulteriormente il quartiere con musica ed eventi a tema.", img:"Jeonpo Cafe Street.jpg", tip:"Essendo composta da vicoli stretti, conviene arrivare a piedi da Seomyeon (circa 10 minuti) piuttosto che in auto, dato che i parcheggi sono limitati. È una buona zona anche per un dolce o un caffè dopo cena, prima di rientrare in hotel per la notte.", move:"Partenza alle 17:40 verso Dakbatgol Mural Village (circa 20 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 서구 동대신동2가 87-218"},
    {n:"[18:00] Dakbatgol Mural Village", d:"<b>Il nome: i campi di gelso della carta</b><br>Dakbatgol prende il nome da dak, il gelso da carta, e bat, campo: il toponimo ricorda gli antichi campi di questa pianta che un tempo prosperavano nella zona, la cui corteccia veniva raccolta e lavorata per produrre lo hanji, la tradizionale carta coreana. Il villaggio sorge sotto Mangyang-ro, una delle strade panoramiche di mezza costa più caratteristiche di Busan, nel distretto di Seo-gu.<br><br><b>Le origini: un quartiere nato dalla tragedia</b><br>L'insediamento risale al 1953, anno in cui un grande incendio devastò l'area attorno alla stazione di Busan: molte delle famiglie che persero la casa in quell'evento si trasferirono sulle colline circostanti, dando origine a diversi villaggi informali, tra cui proprio Dakbatgol. Ancora oggi la comunità celebra un festival locale, nato come cerimonia dangsan per scongiurare il ripetersi di incendi, poi trasformato nel tempo in una festa di quartiere più ampia.<br><br><b>Da quartiere popolare a villaggio di murales</b><br>La trasformazione artistica del villaggio è arrivata nel 2010, quando l'artista Koo Bon-ho, sulla scia di altri progetti simili avviati in città (primo fra tutti quello del villaggio di Amidong), coinvolse i residenti in un progetto di arte pubblica condivisa, dipingendo case, muri e scalinate con murales organizzati attorno a sei temi diversi. Tra le opere più originali ci sono alcuni murales realizzati con bottiglie di vetro di soju e birra riciclate, diventati uno dei tratti distintivi del villaggio.<br><br><b>La scalinata dei desideri</b><br>Il cuore simbolico del villaggio è la scalinata di 192 gradini, conosciuta come Scalinata della Speranza (o dei desideri): secondo una credenza locale, salirla o scenderla porterebbe fortuna ed esaudirebbe i desideri di chi lo fa. Per agevolare gli spostamenti dei residenti più anziani lungo la ripida collina, è stata inoltre installata una piccola monorotaia locale, pensata principalmente per uso residenziale ma che i visitatori possono talvolta provare, se non ci sono abitanti in attesa.<br><br><b>Cosa troveremo</b><br>Passeggiando tra i vicoli si incontrano scalinate colorate, piccoli spazi espositivi che raccontano la storia del quartiere e del distretto di Dong-gu, e un piccolo caffè, il Dakbatgol Book Café, unico punto di ristoro della zona, con un'area esterna particolarmente fotogenica. In primavera i ciliegi in fiore lungo la scalinata regalano una delle vedute più suggestive del villaggio, rendendolo anche una meta meno nota ma apprezzata per l'hanami locale.", img:"Dakbatgol Mural Village.jpg", tip:"Essendo un quartiere collinare e ancora abitato, conviene indossare scarpe comode e mantenere un atteggiamento rispettoso verso i residenti, come per Gamcheon. È molto meno turistico rispetto a Gamcheon Culture Village, quindi è una buona alternativa se cercate un'atmosfera più autentica e tranquilla, con meno folla. Bastano circa 1-1,5 ore per esplorarlo con calma.", move:"Partenza alle 19:15 verso Bupyeong Kkangtong Market (circa 15 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 중구 부평1길 48"},
    {n:"[19:30] Cena: Bupyeong Kkangtong Market", d:"<b>Una storia lunga oltre un secolo</b><br>Il mercato di Bupyeong ha radici sorprendentemente antiche: già nel 1910 fu designato come primo mercato pubblico della Corea aperto tutto l'anno, fatta eccezione per il Capodanno lunare, in un periodo in cui la maggior parte dei mercati coreani apriva solo in giorni prestabiliti del mese. Con la crescita della popolazione di Busan, il mercato fu ampliato notevolmente nel 1922, arrivando a contare, secondo le fonti storiche, oltre 500 negozi e circa 20.000 visitatori al giorno già negli anni '40.<br><br><b>Il nome: il mercato delle lattine</b><br>Il soprannome Kkangtong, che significa letteralmente lattina di latta, risale al periodo successivo alla guerra di Corea (1950-1953), quando i profughi che si stabilirono nella zona iniziarono a vendere soprattutto beni in scatola provenienti dalle basi militari americane, come conserve alimentari e altri surplus bellici. Per la varietà a volte stravagante della merce in vendita, il mercato guadagnò anche il soprannome informale di mercato dei goblin. Negli anni '70-'80 divenne inoltre un punto di riferimento per la vendita di prodotti giapponesi di importazione, come i primi walkman, distribuiti da qui in tutto il paese.<br><br><b>Il primo mercato notturno permanente della Corea</b><br>La svolta più recente risale al 29 ottobre 2013, quando il mercato ha inaugurato il primo mercato notturno permanente di tutta la Corea del Sud, ispirandosi al celebre Shilin Night Market di Taiwan. L'iniziativa ha avuto un tale successo da fare da apripista per la nascita di mercati notturni simili in numerose altre città del paese, diventando uno dei principali biglietti da visita di Busan.<br><br><b>Cosa troveremo</b><br>Di giorno il mercato mantiene la sua anima più tradizionale, con banchi di frutta, verdura, carne, pesce e banchali (i contorni coreani), oltre ad abbigliamento e prodotti per la casa, il tutto sotto un tetto trasparente che protegge dalle intemperie. Dalle 19:30 in poi, lungo la stretta via centrale di circa 110 metri si accendono invece decine di bancarelle di street food: tteokbokki, spiedini di pollo, samgyeop-mari (involtini di pancia di maiale), frutta candita tanghulu, polpette al cannello ricoperte di formaggio filante e persino piatti internazionali come kebab e okonomiyaki, a testimonianza di un mercato che nel tempo si è aperto anche a influenze straniere.", img:"Bupyeong Kkangtong Market.jpg", tip:"<b>Cibi tipici</b><br>Tteokbokki — gnocchi di riso piccanti in salsa di gochujang, qui in versione casereccia.<br>Hotteok — pancake dolce con zucchero, cannella e semi di girasole, cotto su piastra.<br>Eomuk — qui disponibile sia in brodo caldo che grigliato al barbecue.<br>Cibo internazionale — presente ma sempre rivisitato in chiave coreana.<br><br>Essendo attaccato a Gukje Market, molti finiscono per visitarli come un unico percorso. Il mercato notturno è aperto tutti i giorni dalle 19:30 fino a mezzanotte circa (il mercato diurno chiude prima, verso sera), ed essendo molto affollato, soprattutto nei weekend, non ci sono quasi mai posti a sedere: capita spesso di vedere le persone mangiare in piedi lungo la via. Conviene portare contanti, perché non tutti i banchi accettano carte."}

  places:[
    {n:"[5:00] Tempio Haedong Yonggungsa", d:"La sveglia oggi sarà all'alba per andare a vedere il Tempio Haedong Yonggungsa. Avendo dovuto anticipare l'Haeundae Blueline Park, non avremo opzioni alternative per visitare il tempio in altri momenti della giornata, a meno che qualcuno non preferisca rinunciare a parte del tempo di mare per andarci in mattinata e svegliarsi così più tardi.<br><br><b>Un tempio nato da un sogno</b><br>Secondo la tradizione del tempio, le sue origini risalgono al 1376, quando il monaco Naong Hyegeun, consigliere del re Gongmin durante la dinastia Goryeo, fece un sogno in cui gli apparve il dio del mare dell'Est. La divinità gli disse che, se avesse costruito un tempio sul monte Bongnae, proprio in quel punto, il regno sarebbe diventato più grande e stabile. Naong individuò così questo tratto di costa e vi fondò il tempio, inizialmente chiamato Bomunsa.<br><br><b>Distruzione e rinascita</b><br>Il tempio originale fu raso al suolo nel 1592 durante la Guerra Imjin, l'invasione giapponese della Corea, e rimase in stato di abbandono per oltre trecento anni. Fu ricostruito solo negli anni '30 del Novecento, ad opera del monaco Ungang del tempio di Tongdosa, con ulteriori ampliamenti realizzati negli anni '70 e nei primi anni 2000. Il nome attuale, Haedong Yonggungsa, che significa Tempio del Palazzo del Drago a est del mare, gli fu attribuito ufficialmente solo nel 1974.<br><br><b>Una storia non priva di dibattito</b><br>Vale la pena sapere che l'effettiva antichità del tempio è oggetto di una certa disputa storiografica: mentre la tradizione del tempio sostiene la fondazione trecentesca, alcuni giornali locali e ricerche storiche hanno sollevato dubbi, sostenendo che l'edificio attuale sia in realtà una costruzione sostanzialmente moderna, risalente proprio agli anni '30-'70. Al di là della disputa sulla data esatta, ciò che è certo è che si tratta di uno dei pochissimi templi buddisti coreani costruito direttamente sulla costa, invece che tra le montagne come da tradizione.<br><br><b>Perché è un luogo speciale nella tradizione buddista coreana</b><br>Haedong Yonggungsa è considerato uno dei tre templi coreani dedicati alla dea della misericordia, ed è il tempio più vicino al mare di tutta la Corea. Secondo la credenza popolare, chi vi prega con sincerità può veder esaudito un desiderio, il che lo rende meta di pellegrinaggio per chi cerca fortuna, prosperità o la nascita di un figlio maschio, a cui è dedicata una statua specifica, il Deuknam-bul.<br><br><b>Cosa troveremo</b><br>Il percorso di accesso, fiancheggiato da bancarelle di street food e souvenir, conduce a un ingresso decorato con le statue dei dodici animali dello zodiaco cinese, prima di scendere lungo la scalinata dei 108 gradini della longevità, un numero che nel buddismo rappresenta le 108 afflizioni terrene da superare per raggiungere l'illuminazione. Da qui si attraversa il ponte Yongmun-gyo, dove è tradizione lanciare monete sotto l'arco per buona fortuna, prima di arrivare al cuore del complesso: la sala principale Daeungjeon, la pagoda a sette piani e l'imponente statua del Buddha Haesu Gwaneum, la Bodhisattva della Compassione, che domina la scogliera con vista sul mare aperto.", img:"Haedong Yonggungsa.jpg", tip:"L'ingresso è gratuito. Il tempio è molto affollato durante il giorno, specialmente nei weekend, quindi chi vuole vederlo con più tranquillità, o assistere all'alba sul mare, può considerare di arrivare presto la mattina. Essendo costruito su una scogliera con molte scale, non è la scelta più comoda per chi ha difficoltà motorie. Mettete in conto circa 1-1,5 ore per la visita completa, incluso il tempo per il percorso di accesso.", move:"Partenza alle 08:10 verso Haeundae Blueline Park (circa 20 min in auto — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산 해운대구 달맞이길62번길 13"},
    {n:"[8:30] Haeundae Blueline Park e Cheongsapo Daritdol Skywalk", d:"<b>Da linea ferroviaria dismessa a parco turistico</b><br>L'intero parco nasce dalla riconversione ecologica di un tratto della Donghae Nambu Line, una linea ferroviaria costiera ormai in disuso che collegava Haeundae a Songjeong. Il progetto ha trasformato 4,8 km di ex sedime ferroviario, da Mipo a Cheongsapo fino a Songjeong, in un percorso turistico aperto al pubblico nell'ottobre 2020, diventando uno degli esempi più riusciti di riqualificazione di infrastrutture dismesse in tutta la Corea del Sud.<br><br><b>Due modi di percorrerlo</b><br>Il parco offre due esperienze distinte lungo lo stesso tracciato: la Haeundae Sky Capsule, una cabina panoramica a quattro posti che scorre per 2 km a 7-10 metri di altezza sul livello del mare, tra Mipo e Cheongsapo, e la Haeundae Beach Train, un trenino turistico a batteria (il primo del suo genere al mondo) che percorre l'intero tracciato di 4,8 km da Mipo a Songjeong passando per Cheongsapo, fermandosi in diverse stazioni e punti panoramici lungo il percorso, tra cui il celebre Dalmaji Tunnel, conosciuto anche come tunnel della luce lunare per la sua illuminazione colorata.<br><br><b>Cheongsapo: un antico villaggio di pescatori</b><br>Cheongsapo è un piccolo e caratteristico villaggio di pescatori lungo il percorso, oggi famoso anche per un passaggio a livello proprio di fronte alla stazione, diventato virale sui social perché ricorda molto da vicino una scena iconica dell'anime giapponese Slam Dunk, trasformandosi in uno dei punti fotografici più cercati dai visitatori più giovani. Il piccolo porto è inoltre riconoscibile per i suoi due fari gemelli, uno rosso e uno bianco, ai due estremi del molo.<br><br><b>Cheongsapo Daritdol Skywalk</b><br>Aperto nell'agosto 2017, lo skywalk si trova proprio a Cheongsapo ed è lungo 72,5 metri, sospeso a 20 metri sul livello del mare. È stato progettato a forma di drago blu, lo spirito guardiano tradizionalmente associato al villaggio di Cheongsapo secondo le credenze popolari locali, con la sezione terminale dotata di pavimento in vetro trasparente per un'esperienza ancora più suggestiva sospesa sull'acqua. Il nome Daritdol deriva da cinque scogli vicino al porto, che nella tradizione locale ricordavano delle pietre disposte come i gradini di un ponte.<br><br><b>Cosa troveremo</b><br>Lungo il percorso si incontrano diversi punti panoramici, tra cui l'osservatorio Haeundae Sea Sound (o Badassori Gallery), il piccolo villaggio di pescatori di Gudeokpo e diversi ristoranti di vongole grigliate e frutti di mare proprio a Cheongsapo, oltre a caffè come il Diart Coffee, apprezzato per la vista sul porto.", img:"Haeundae Blueline Park.jpg", tip:"I biglietti per la Sky Capsule vanno spesso esauriti in anticipo nei weekend e in alta stagione, quindi conviene prenotarli online con un po' di anticipo; il trenino Beach Train è invece più economico e generalmente più facile da trovare disponibile. Molti visitatori scelgono di fare la tratta di andata in capsula o treno e tornare a piedi lungo la stessa costa, così da vedere con calma entrambi gli skywalk incontrati lungo il percorso — il che si presta bene anche a tornare verso la spiaggia di Haeundae. Il periodo migliore per la visita è la primavera o l'autunno, mentre per lo skywalk di Cheongsapo il tardo pomeriggio, verso il tramonto, resta il momento più suggestivo."},
    {n:"[10:00] Spiaggia di Haeundae", d:"Passeremo il resto della mattinata e buona parte del pomeriggio in spiaggia, o comunque in prossimità di essa. Bisogna quindi attrezzarsi con il vestiario e lo zaino opportuno.<br><br><b>Il nome: mare e nuvole</b><br>Il nome Haeundae ha origini letterarie che risalgono a oltre mille anni fa: si deve allo studioso e poeta Choi Chi-won, vissuto nel IX secolo durante la dinastia Silla unificata, il cui nome letterario era proprio Haeun, che significa mare e nuvole. Si racconta che, durante uno dei suoi viaggi lungo la costa meridionale della penisola coreana, Choi Chi-won rimase talmente affascinato dalla vista che si godeva dalla collina di Dongbaekseom da incidere il proprio nome letterario su una roccia del promontorio, un'iscrizione che secondo la tradizione esiste ancora oggi. Lo stesso studioso diede il nome anche ad altri luoghi della costa meridionale coreana, come Cheongnyongdae e Mollundae.<br><br><b>Da villaggio di pescatori a spiaggia più famosa della Corea</b><br>Per secoli Haeundae rimase un tranquillo villaggio di pescatori e agricoltori, ai margini del principale porto di Busan. Lo sviluppo turistico dell'area cominciò a prendere forma nei primi decenni del XX secolo, legato inizialmente anche alla fama delle sorgenti termali locali, note fin dall'epoca Silla per le loro proprietà curative, per poi consolidarsi definitivamente nella seconda metà del Novecento, di pari passo con la modernizzazione della Corea del Sud e l'apertura del paese al turismo internazionale.<br><br><b>Un pezzo di cultura popolare coreana</b><br>Haeundae è protagonista anche di uno dei brani più rappresentativi della musica popolare di Busan, la canzone Torna al Porto di Busan (Doraowayo Busanhange), che racconta la nostalgia di chi, negli anni '60, lasciò la Corea in cerca di migliori opportunità di lavoro, guardando ai gabbiani sul porto in attesa di un fratello mai tornato. Una scultura con il testo della canzone si trova ancora oggi lungo la spiaggia. Più di recente, Haeundae è stata anche set cinematografico e televisivo, comparendo in produzioni come il film catastrofico Haeundae (2009) e in K-drama di successo internazionale come My Love from the Star.<br><br><b>Cosa troveremo</b><br>La spiaggia si estende per circa 1,5 km, con una sabbia fine chiara e un fondale poco profondo adatto alla balneazione, ed è oggi circondata da uno skyline di grattacieli, hotel di lusso e locali che la rendono una delle immagini più riconoscibili di tutta la Corea del Sud. D'estate accoglie oltre 10 milioni di visitatori, con ombrelloni organizzati e bagnini lungo tutto l'arenile. Ogni estate ospita inoltre il celebre Haeundae Sand Festival, con enormi sculture di sabbia realizzate da artisti provenienti da tutto il mondo.", img:"Spiaggia di Haeundae.jpg", tip:"Essendo la spiaggia più affollata della Corea, se cercate un po' di tranquillità conviene andarci presto la mattina o al tramonto. La zona è ben collegata dalla metro (linea 2, stazione Haeundae), ed essendo circondata da molte delle tappe già viste in questi giorni (Dongbaek Park, Busan X the Sky, Blueline Park), è un ottimo punto da cui organizzare gran parte della giornata a Haeundae.", move:"Il pranzo da Ribs of Legend è praticamente sulla spiaggia, non serve un vero spostamento.<br><b>Indirizzo per Naver:</b><br><br>부산광역시 해운대구 해운대해변로 277"},
    {n:"[13:30] Pranzo: Ribs of Legend Haeundae", d:"Pranzeremo in un ristorante in zona: al momento quello individuato è Ribs of Legend Haeundae. Altrimenti un altro BBQ con buone recensioni è 규우정. Un'altra opzione è Yulling, un po' più elegante, sempre a base di carne, ma con recensioni non altrettanto buone.", img:"Ribs of Legend Haeundae.jpg", tip:"", move:"Dongbaek Park è praticamente attaccato alla spiaggia, non serve un vero spostamento.<br><b>Indirizzo per Naver:</b><br><br>부산광역시 해운대구 동백로 67"},
    {n:"[15:00] Dongbaek Park (Dongbaekseom)", d:"Per chi si fosse annoiato di stare in spiaggia, è possibile fare una passeggiata al Dongbaek Park; è praticamente attaccato alla spiaggia. Altrimenti possiamo spostarci altrove per un pò di tempo libero.<br><br><b>Il nome: l'isola delle camelie</b><br>Dongbaekseom significa letteralmente isola delle camelie, da dongbaek, il nome coreano di questa pianta dai fiori rossi, e seom, isola. In origine si trattava davvero di un'isola separata dalla terraferma, ma nel corso dei secoli l'accumulo naturale di sabbia e sedimenti ha creato una lingua di terra che l'ha collegata stabilmente alla costa di Haeundae, pur mantenendo ancora oggi il nome e l'identità di isola. Da gennaio ad aprile le camelie fioriscono in tutto il parco, regalando un contrasto rosso acceso con il verde dei pini neri che ricoprono la maggior parte della superficie.<br><br><b>La leggenda della Principessa Hwangok</b><br>Lungo il sentiero costiero si incontra la statua di una sirena, dedicata alla Principessa Hwangok, un personaggio tratto dal Samguk yusa, un'antica raccolta di memorie e leggende dei Tre Regni di Corea. Si narra che la principessa provenisse da Naranda, un regno mitico oltre il mare, e fosse stata data in sposa a un re straniero, il re Eunhye. Sopraffatta dalla nostalgia per la sua terra natale, la principessa era solita, ad ogni luna piena, guardare il riflesso della patria lontana in una perla di topazio ricevuta dalla nonna, l'unico oggetto capace di consolare il suo dolore. La statua attuale, alta 2,5 metri, fu installata nel 1974, danneggiata da un tifone nel 1987 e successivamente restaurata mantenendo solo la parte superiore originale.<br><br><b>La Nurimaru APEC House</b><br>Sulla punta dell'isola sorge la Nurimaru APEC House, costruita appositamente per ospitare il vertice APEC (Cooperazione Economica Asia-Pacifico) del 2005, che riunì i leader di 21 economie della regione, incluso l'allora presidente statunitense George W. Bush. L'edificio, progettato in stile jeongja, il tradizionale padiglione coreano, reinterpretato con linee moderne e ampie vetrate, ospita ancora oggi la sala principale con il tavolo rotondo originale attorno a cui sedettero i capi di stato, oltre a fotografie e oggetti legati all'evento.<br><br><b>Cosa troveremo</b><br>Il sentiero costiero che circonda l'isola, lungo circa 950 metri, è percorribile in 30-40 minuti a passo tranquillo e regala una delle viste più belle su tutta Haeundae Beach, oltre a un faro panoramico da cui si vedono il ponte Gwangan e, nelle giornate più limpide, le isole di Oryukdo. Lungo il percorso si incontra anche una stele con incisa una poesia dello studioso Choi Chi-won, che secondo la tradizione soggiornò proprio su quest'isola. Il parco è inoltre uno dei punti migliori per ammirare il tramonto, con la Nurimaru APEC House e il faro che si stagliano contro la luce del cielo.", img:"Dongbaek Park.jpg", tip:"L'ingresso al parco è gratuito e il percorso è illuminato anche di sera, rendendolo una delle passeggiate serali più suggestive di Haeundae, con vista sulle luci notturne della spiaggia e del ponte Gwangan. Da qui è comodo proseguire a piedi fino a The Bay 101, un'area con caffè e ristoranti affacciati sul porticciolo turistico, per un aperitivo con vista sull'acqua.", move:"Partenza alle 16:40 verso Busan X the Sky (circa 20 min — stima di massima).<br><b>Indirizzo per Naver:</b><br><br>부산광역시 해운대구 달맞이길 30"},
    {n:"[18:30] Busan X the Sky", d:"<b>Un grattacielo nato in tempi record</b><br>Busan X the Sky si trova negli ultimi piani della Haeundae LCT Landmark Tower, il grattacielo più alto di Busan e il secondo più alto di tutta la Corea del Sud, dopo la Lotte World Tower di Seoul. La costruzione della torre iniziò nell'ottobre 2013 e si concluse nel novembre 2019, raggiungendo un'altezza di 411,6 metri su 101 piani. Fa parte di un complesso più ampio, che comprende anche altre due torri residenziali, rispettivamente terza e quarta più alte della Corea. L'osservatorio, che occupa gli ultimi tre piani della torre (dal 98° al 100°), ha aperto al pubblico il 17 luglio 2020, diventando rapidamente uno dei simboli della nuova skyline di Busan.<br><br><b>Il più grande osservatorio della Corea del Sud</b><br>Al di là dell'altezza della torre in sé, Busan X the Sky è oggi la piattaforma panoramica più estesa di tutto il paese, con una vista che nelle giornate più limpide arriva a scorgere persino l'isola giapponese di Tsushima, oltre 50 km al largo della costa. L'ascensore ad alta velocità, chiamato Sky Cruise, impiega appena 58 secondi per portare i visitatori fino in cima, con le pareti rivestite da schermi LED che simulano un'immersione nelle profondità marine durante la salita.<br><br><b>Cosa troveremo</b><br>Al 100° piano si trova la sezione più spettacolare, chiamata Shocking Bridge, un tratto di pavimento in vetro trasparente sospeso nel vuoto, da cui si vede Haeundae Beach direttamente sotto i piedi. L'osservatorio ospita inoltre zone fotografiche interattive, installazioni digitali e persino lo Starbucks più alto del mondo, oltre a un ristorante panoramico al 99° piano. Di sera, sui vetri dell'osservatorio vengono proiettati due spettacoli di luci a tema, chiamati Sky X Show e Sky Wave Show, entrambi replicati più volte dopo il tramonto.<br><br><b>Cosa si vede dall'alto</b><br>Dalla terrazza si gode di una vista a 360 gradi che spazia da Haeundae Beach all'isolotto di Dongbaekseom, dal ponte Gwangan alla scogliera di Igidae, fino allo skyline di Centum City e alle montagne che circondano la città: probabilmente il punto di osservazione più completo su tutta Busan.", img:"Busan X the Sky.jpg", tip:"Il momento migliore per la visita è il tardo pomeriggio, così da vedere la città sia in piena luce sia mentre si accendono le luci notturne dopo il tramonto. I biglietti, che si aggirano sui 27.000 won per gli adulti, possono essere acquistati online in anticipo per risparmiare tempo in coda. È raggiungibile a piedi in circa 15 minuti dalla stazione della metro di Haeundae (linea 2, uscita 3), oppure in taxi.", move:"Partenza alle 18:30 verso BAO HAUS (circa 30 min — stima di massima, Haeundae è piuttosto distante da Seomyeon).<br><b>Indirizzo per Naver:</b><br><br>부산진구 서전로38번길 62-9"},
    {n:"[19:30] Cena: BAO HAUS", d:"Per cena siamo liberi di spostarci dove preferiamo, ma nel caso esiste questo BAO HAUS vicino all'albergo che non sembra male, anche se dovrebbe essere cucina taiwanese. Chiude alle 20:00 quindi bisogna valutare che ora si sarà fatta.", img:"BAO HAUS.jpg", tip:"Locale piccolo e senza prenotazioni: mettete in conto una possibile attesa in piedi nei momenti di punta."}
  ]
},

    {n:"Grotta di Seokguram", d:"Santuario rupestre artificiale con una grande statua di Buddha in granito bianco, costruito nell'VIII secolo sul monte Tohamsan con vista sul mare.", tip:"Non si può fotografare l'interno della grotta: la statua è protetta da una vetrata."},

/* ============================================================
   RENDER
   ============================================================ */
const navContent = document.getElementById('navContent');
const page = document.getElementById('page');

function regionDays(key){ return DAYS.filter(d=>d.region===key); }

function emphasizeLast(str){
  const parts = str.split(' ');
  if(parts.length===1) return `<em>${str}</em>`;
  const last = parts.pop();
  return `${parts.join(' ')} <em>${last}</em>`;
}

function buildSidebar(){
  let html = `<div class="navgroup">
    <button class="infolink" data-target="info" id="navInfo">🧭 &nbsp;Prima di partire</button>
  </div>
  <div class="navgroup"><div class="navgroup-label">Itinerario giorno per giorno</div>`;

  Object.keys(REGIONS).forEach(key=>{
    if(key==="info") return;
    const r = REGIONS[key];
    const days = regionDays(key);
    if(!days.length) return;
    html += `<div class="region-block">
      <div class="region-head"><span class="dot" style="background:${r.color}"></span>${r.label}</div>`;
    days.forEach(d=>{
      html += `<button class="daylink" data-target="day-${d.id}" data-region="${key}" style="--accent:${r.color}">
        <span class="num">${String(d.id).padStart(2,'0')}</span> ${d.date.split(' ').slice(0,2).join(' ')}
      </button>`;
    });
    html += `</div>`;
  });
  html += `</div>`;
  navContent.innerHTML = html;

  navContent.querySelectorAll('.daylink').forEach(btn=>{
    btn.addEventListener('click', ()=> showDay(parseInt(btn.dataset.target.replace('day-',''))));
  });
  document.getElementById('navInfo').addEventListener('click', showInfo);
}

function setActiveNav(target){
  document.querySelectorAll('.daylink, .infolink').forEach(el=>el.classList.remove('active'));
  const el = document.querySelector(`[data-target="${target}"]`);
  if(el) el.classList.add('active');
}

function galleryCardHTML(p, accent, i){
  const media = p.img
    ? `<img class="g-img" src="${p.img}" alt="${p.n}" loading="lazy">`
    : `<div class="g-img-ph" style="--accent:${accent}">${p.n}</div>`;
  return `<div class="g-card">
    ${media}
    <div class="g-cap"><h4>${p.n}</h4><span class="g-num">${String(i+1).padStart(2,'0')}</span></div>
    <p>${p.d}</p>
    ${p.tip ? `<div class="tip"><b>💡</b><span>${p.tip}</span></div>` : ''}
    ${p.move ? `<div class="tip"><b>🚗</b><span>${p.move}</span></div>` : ''}
  </div>`;
}

function showDay(id){
  const d = DAYS.find(x=>x.id===id);
  if(!d) return;
  const r = REGIONS[d.region];
  const idx = DAYS.findIndex(x=>x.id===id);
  const prev = DAYS[idx-1];
  const next = DAYS[idx+1];
  const heroImg = HERO_IMG[d.region] || '';

  page.innerHTML = `
    <div class="hero" style="--accent:${r.color};${heroImg ? `background-image:url('${heroImg}')` : `background:linear-gradient(135deg,${r.color},#20242c)`}">
      <div class="hero-inner">
        <div class="hero-eyebrow">§ ${String(d.id).padStart(2,'0')} / 16 <span class="sep">·</span> ${r.label} <span class="sep">·</span> ${d.date}</div>
        <h2>${emphasizeLast(d.city)}</h2>
        <div class="sub">${d.hotel && d.hotel !== '—' ? 'Pernottamento: ' + d.hotel : ''}</div>
      </div>
    </div>
    <div class="stats-row">
      <div class="stat"><b>${String(d.id).padStart(2,'0')} / 16</b><span>Giorno di viaggio</span></div>
      ${d.flight ? `<div class="stat"><b>✈</b><span>${d.flight}</span></div>` : ''}
      <div class="stat"><b>${d.schedule && d.schedule.length ? d.schedule.length : '—'}</b><span>Tappe in programma</span></div>
    </div>

    ${d.note ? `<div class="note-box">${d.note}</div>` : ''}

    <div class="content-pad">
    ${d.schedule && d.schedule.length ? `
    <div class="block-title">Programma orario</div>
    <div class="legend" style="--accent:${r.color}">
      <span><i></i>Tappa/visita</span>
      <span><i class="meal-i"></i>Pasto</span>
      <span><i class="transfer-i"></i>Spostamento / partenza</span>
      <span><i class="logistics-i"></i>Sveglia · check-in/out · bagagli</span>
    </div>
    <div class="timeline" style="--accent:${r.color}">
      ${d.schedule.map(s=>`<div class="tl-item ${s.type}" style="--accent:${r.color}">
        <div class="tl-time">${s.time}</div>
        <div class="tl-text">${s.text}</div>
      </div>`).join('')}
    </div>` : ''}

    ${d.places && d.places.length ? `
    <div class="block-title">Cosa vedrete — info utili</div>
    <div class="gallery">
      ${d.places.map((p,i)=>galleryCardHTML(p, r.color, i)).join('')}
    </div>` : ''}
    </div>

    <div class="foot-nav">
      <button class="foot-btn" ${prev? '' : 'disabled'} id="prevBtn">
        <span class="lbl">← Giorno precedente</span>
        <span class="nm">${prev ? prev.city + ' — ' + prev.date : ''}</span>
      </button>
      <button class="foot-btn right" ${next? '' : 'disabled'} id="nextBtn">
        <span class="lbl">Giorno successivo →</span>
        <span class="nm">${next ? next.city + ' — ' + next.date : ''}</span>
      </button>
    </div>
  `;
  setActiveNav(`day-${id}`);
  window.scrollTo({top:0, behavior:'instant'});
  if(prev) document.getElementById('prevBtn').addEventListener('click', ()=>showDay(prev.id));
  if(next) document.getElementById('nextBtn').addEventListener('click', ()=>showDay(next.id));
  closeMobileNav();
}

function showInfo(){
  const totalDays = DAYS.length;
  const totalRegions = Object.keys(REGIONS).length - 1;
  page.innerHTML = `
    <div class="info-hero">
      <div class="info-hero-inner">
        <div class="hero-eyebrow">🧭 Guida rapida</div>
        <h2>Prima di <em>partire</em></h2>
        <p>${INFO.intro}</p>
      </div>
    </div>
    <div class="info-stats">
      <div class="stat"><b>${totalDays}</b><span>Giorni di viaggio</span></div>
      <div class="stat"><b>${totalRegions}</b><span>Tappe · regioni</span></div>
      <div class="stat"><b>15—30</b><span>Agosto 2026</span></div>
    </div>
    <div class="info-grid">
      ${INFO.cards.map(c=>`
        <div class="info-card">
          <h3>${c.icon} ${c.title}</h3>
          <ul>${c.items.map(i=>`<li>${i}</li>`).join('')}</ul>
        </div>
      `).join('')}
    </div>
  `;
  setActiveNav('info');
  window.scrollTo({top:0, behavior:'instant'});
  closeMobileNav();
}

/* mobile nav toggle */
const sidebar = document.getElementById('sidebar');
const overlay = document.getElementById('overlay');
document.getElementById('menuToggle').addEventListener('click', ()=>{
  sidebar.classList.toggle('open');
  overlay.classList.toggle('show');
});
overlay.addEventListener('click', ()=>{
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
});
function closeMobileNav(){
  if(window.innerWidth<=900){ sidebar.classList.remove('open'); overlay.classList.remove('show'); }
}

/* init */
buildSidebar();
showInfo();
</script>
</body>
</html>
