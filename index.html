  places:[
    {n:"[13:00] Pranzo: Gwangjang Market", d:"Dopo aver lasciato le valigie in albergo, ci fermeremo qui per pranzo.<br><br><b>Il primo mercato permanente della Corea</b><br>Gwangjang Market aprì nel 1905, ed è considerato il primo mercato permanente di tutta la Corea, oltre che quello tuttora attivo più antico del paese: un vero e proprio museo vivente, per usare l'espressione con cui viene spesso descritto dagli stessi coreani. Il nome deriva dall'unione dei nomi di due ponti storici della zona, Gwanggyo e Jangtong-gyo, entrambi un tempo situati lungo il torrente Cheonggyecheon, proprio nei pressi del quale il mercato fu originariamente costruito.<br><br><b>Un mercato nato per i tessuti</b><br>Fin dalle origini, Gwangjang Market si affermò soprattutto come il principale mercato di tessuti di Seoul, in particolare seta, raso e lino: il secondo piano del mercato conserva ancora oggi questa vocazione, con negozi specializzati in tessuti per la casa, yedan (i doni tradizionali che la sposa porta alla famiglia dello sposo) e hanbok, l'abito tradizionale coreano, rendendolo tuttora una tappa quasi obbligata per le coppie coreane che si preparano al matrimonio.<br><br><b>Da mercato di quartiere a fenomeno globale</b><br>Negli ultimi decenni la fama di Gwangjang Market si è spostata sempre di più verso la sua Meokjagolmok, la via del cibo di strada al centro del mercato, diventata celebre a livello internazionale anche grazie alla docuserie Netflix Street Food: Asia, oltre che a numerose apparizioni in show televisivi coreani come Running Man. Oggi il mercato riceve fino a 65.000 visitatori al giorno, mantenendo comunque un'anima autentica e poco patinata rispetto ad altri mercati più turistici della città.<br><br><b>Cosa troveremo</b><br>Il piatto più iconico è senza dubbio il bindaetteok, una frittella spessa e dorata di fagioli mung macinati, germogli, kimchi e cipollotto, fritta in abbondante olio: passeggiando tra i banchi si sente ancora il rumore delle tradizionali macine di pietra che trasformano i fagioli in impasto. Altri piatti da provare sono il mayak gimbap, piccoli involtini di riso e alga chiamati letteralmente gimbap-droga per quanto danno dipendenza, lo yukhoe (tartare di manzo cruda) e il kalguksu (tagliatelle tagliate a coltello in brodo).", img:"Gwangjang Market.jpg", tip:"Il mercato generale è aperto indicativamente dalle 9:00 alle 18:00, mentre l'area food resta attiva fino alle 23:00. La stazione più comoda è Jongno 5-ga (linea 1, uscita 8), a pochi minuti a piedi. Molti banchi accettano solo contanti, quindi conviene portarne un po' con sé. Per evitare la ressa, il pranzo nei giorni feriali (11:30-13:30) resta il momento migliore, mentre i weekend, specialmente la sera, possono essere piuttosto affollati.", move:"Partenza verso il Palazzo Changdeokgung.<br><b>Indirizzo per Naver:</b><br><br>서울 종로구 율곡로 99"},
    {n:"[14:00] Palazzo Changdeokgung", d:"<b>Il nome: il palazzo della virtù illustre</b><br>Changdeokgung significa palazzo della virtù illustre, e fu costruito a partire dal 1405 per volere di re Taejong, terzo sovrano della dinastia Joseon, come palazzo secondario rispetto a Gyeongbokgung. I lavori si conclusero nel 1412 con la costruzione del cancello principale, Donhwamun. Il complesso fu poi ampliato sotto re Sejo, che vi aggiunse circa 500.000 metri quadrati di terreno, includendo quello che sarebbe diventato il celebre Giardino Segreto.<br><br><b>Un'architettura pensata per assecondare la natura</b><br>A differenza di Gyeongbokgung, costruito secondo una rigida simmetria geometrica tipica dell'urbanistica confuciana classica, Changdeokgung fu progettato seguendo i principi del pungsu, l'equivalente coreano del feng shui cinese: invece di imporre un ordine artificiale al paesaggio, gli architetti scelsero di preservare colline, valli e corsi d'acqua naturali, integrando gli edifici nel terreno esistente ai piedi del monte Baegaksan. Questo approccio organico è considerato oggi uno dei motivi principali per cui, tra i cinque grandi palazzi di Seoul, Changdeokgung è l'unico dichiarato Patrimonio Mondiale UNESCO, ottenuto nel 1997.<br><br><b>Distruzione e lunga centralità nella storia Joseon</b><br>Come Gyeongbokgung, anche Changdeokgung fu raso al suolo durante l'invasione giapponese del 1592, e subì ulteriori danni durante l'invasione manciù del 1636. Fu però ricostruito già nel 1610, molto prima di Gyeongbokgung, che restò in rovina per quasi 270 anni: per questo motivo Changdeokgung divenne, di fatto, la residenza principale e la sede del potere della dinastia Joseon per gran parte dei tre secoli successivi, un ruolo che il nome di palazzo secondario non lascerebbe immaginare.<br><br><b>L'ultima dimora della famiglia reale coreana</b><br>Changdeokgung ha un legame diretto e sorprendentemente recente con la storia coreana: fu qui che vissero, e morirono, gli ultimi discendenti della famiglia reale Joseon, tra cui l'imperatrice Sunjeong e la principessa Deokhye, l'ultima delle quali si spense proprio all'interno del palazzo nel 1989, meno di quarant'anni fa.<br><br><b>Il periodo coloniale e il restauro moderno</b><br>Durante l'occupazione giapponese (1910-1945), il palazzo fu danneggiato e in parte fuso amministrativamente con il vicino Changgyeonggung, un intervento che ne alterò profondamente l'integrità storica. A partire dagli anni '80 sono stati avviati importanti lavori di restauro, con l'obiettivo di restituire al complesso il suo aspetto originario dell'epoca Joseon, un processo tuttora in corso.", img:"Palazzo Changdeokgung.jpg", tip:"Poco distante si trova anche il Santuario di Jongmyo, altro sito UNESCO dedicato ai riti ancestrali della famiglia reale, che si presta bene a essere abbinato nella stessa giornata."},
    {n:"[15:00] Giardino Segreto di Changdeokgung", d:"Alle spalle del palazzo si estende Huwon, il celebre Giardino Segreto, un'area di circa 32 ettari con oltre 26.000 esemplari di un centinaio di specie arboree diverse, alcuni alberi con più di 300 anni di vita. In origine chiamato semplicemente Bugwon o Geumwon, ricevette il nome di Giardino Segreto (Biwon) solo più tardi, sotto il regno dell'imperatore Gojong. Per secoli fu un'area riservata esclusivamente alla famiglia reale e alle dame di corte, inaccessibile alla popolazione comune, usata dai sovrani per allontanarsi dalle pressioni della vita di corte, comporre poesie e studiare i classici confuciani. Tra i punti più suggestivi ci sono il padiglione Buyongjeong che si affaccia sullo stagno Buyongji, il padiglione Juhamnu, Aeryeonjeong e l'area di Ongnyucheon, il ruscello di giada.", img:"Giardino Segreto di Changdeokgung.jpg", tip:"Il Giardino Segreto è visitabile solo con visita guidata a orari prestabiliti e con un numero limitato di posti giornalieri, quindi conviene prenotare online con anticipo, specialmente nei mesi di alta stagione.", move:"Partenza verso il Palazzo Changgyeonggung (collegamento interno).<br><b>Indirizzo per Naver:</b><br><br>서울시 종로구 창경궁로 185"},
    {n:"[16:00] Palazzo Changgyeonggung", d:"<b>Il nome: il palazzo della gioia fiorente</b><br>Changgyeonggung significa più o meno palazzo della gioia fiorente, e fu costruito nel 1484 per volere di re Seongjong, non come sede del potere ma come residenza per la nonna e la madre del sovrano, le regine madri di corte: un ruolo che spiega perché, a differenza degli altri grandi palazzi di Seoul, la sua sala del trono principale, Myeongjeongjeon, sia orientata verso est invece che verso sud, come da tradizione, privilegiando la praticità rispetto al protocollo formale.<br><br><b>Un palazzo gemello di Changdeokgung</b><br>Changgyeonggung è collegato direttamente al vicino Changdeokgung, formando insieme quello che veniva chiamato Donggwol, il Palazzo Orientale: pur condividendo un muro di cinta e facendo parte dello stesso complesso storico, i due palazzi restano oggi siti distinti e visitabili separatamente.<br><br><b>Distruzione e ricostruzione</b><br>Come gli altri palazzi di Seoul, anche Changgyeonggung fu distrutto durante l'invasione giapponese del 1592-1598, e ricostruito nel 1616 sotto re Gwanghaegun. Myeongjeongjeon, la sala del trono ricostruita in quell'occasione, è oggi considerata la sala principale più antica tra tutti i Cinque Grandi Palazzi di Seoul.<br><br><b>L'umiliazione coloniale: da palazzo a zoo</b><br>Il capitolo più duro della storia di Changgyeonggung riguarda il periodo coloniale giapponese. Dopo il trattato di Eulsa del 1905, che istituì il protettorato giapponese sulla Corea, le autorità coloniali iniziarono a smantellare sistematicamente il palazzo: nel 1907 fu ufficialmente declassato da gung (palazzo) a won (giardino), assumendo il nome di Changgyeongwon, e trasformato in un parco pubblico in stile occidentale, sul modello dell'Ueno Park di Tokyo. Nel 1909 vi fu costruito il primo zoo della Corea, seguito nel 1911 da un giardino botanico e da un museo, oltre alla piantumazione di ciliegi per l'hanami, la tradizionale contemplazione dei fiori di ciliegio giapponese. Si tratta di un gesto ampiamente riconosciuto dagli storici come una vera e propria umiliazione culturale deliberata: elefanti sfilavano davanti a Myeongjeongjeon, e scimmie vivevano in gabbie proprio vicino a quelli che un tempo erano gli appartamenti reali.<br><br><b>Il ritorno alla dignità di palazzo</b><br>Solo nel 1983 il governo coreano avviò un progetto sistematico di restauro, trasferendo zoo e giardino botanico al Seoul Grand Park e ricostruendo, tra il 1983 e il 1986, gli edifici principali sulla base di documenti storici e ricerche archeologiche, per restituire al sito il suo status e il suo nome originari di palazzo.<br><br><b>Cosa troveremo</b><br>Tra le poche testimonianze rimaste del periodo coloniale c'è Daeonsil, la prima serra in stile occidentale costruita in Corea, oggi utilizzata come giardino botanico coperto dall'atmosfera quasi fiabesca. Nelle vicinanze si trovano gli stagni Chundangji, in parte creati proprio dai giapponesi al posto di un'antica risaia che i sovrani coltivavano simbolicamente per comprendere la fatica dei contadini, e una pagoda in pietra a sette piani, di origine cinese (dinastia Ming, XV secolo). Da segnalare anche Gwancheondae, un'antica piattaforma osservativa usata per l'osservazione astronomica di corte, e i tre tesori nazionali del sito: il cancello principale Honghwamun (1616), il ponte in pietra Okcheongyo (1483, il più antico tra quelli conservati nei palazzi reali di Seoul) e la già citata Myeongjeongjeon.", img:"Palazzo Changgyeonggung.jpg", tip:"Essendo più piccolo e meno affollato rispetto a Gyeongbokgung e Changdeokgung, è una tappa piacevole se cercate un ritmo più tranquillo dopo aver già visitato gli altri palazzi. È collegato direttamente a Changdeokgung tramite un ingresso interno, quindi conviene visitarli in sequenza nella stessa giornata, magari acquistando il biglietto cumulativo che include entrambi (oltre agli altri palazzi e a Jongmyo).", move:"Partenza alle 17:00 verso London Bagel Museum Anguk.<br><b>Indirizzo per Naver:</b><br><br>서울특별시 종로구 북촌로4길 20"},
    {n:"[17:00] Spuntino: London Bagel Museum Anguk", d:"Un'altra pausa dolce, questa volta a base di bagel: il locale è stato aperto nel 2021 dallo stesso team creativo dietro Artist Bakery, già assaggiata qualche giorno fa. È diventato uno dei fenomeni da fila interminabile della scena bakery di Seoul, con un'estetica da boulangerie vintage in salsa londinese.", img:"London Bagel Museum Anguk.jpg", tip:"Le file possono superare l'ora d'attesa; su weekend affollati conviene mettere in conto tempo extra o provare a prenotare tramite l'app CatchTable.", move:"Rientro in albergo (Gyedong Hanok 125) per il check-in, poi partenza verso Namsan Mountain Park.<br><b>Indirizzo per Naver:</b><br><br>서울 용산구 남산공원길 105"},
    {n:"[18:30] Namsan Mountain Park e N Seoul Tower", d:"<b>Una montagna strategica fin dalla fondazione di Seoul</b><br>Namsan, che significa letteralmente montagna del sud, è considerata strategica fin dalla fondazione della dinastia Joseon nel 1392, quando fu inclusa tra le quattro montagne guardiane che proteggevano simbolicamente e militarmente la capitale Hanyang (l'odierna Seoul), facendo parte del sistema fortificato dell'Hanyangdoseong, l'antica cinta muraria della città, di cui restano ancora oggi alcuni tratti visibili lungo i pendii del parco.<br><br><b>Il sistema dei fari di segnalazione</b><br>Sulla vetta della montagna sorgeva per secoli un bonghwadae, una stazione di segnalazione a fuoco facente parte del più ampio sistema bonghwa: una rete di fari collinari che permetteva di trasmettere rapidamente messaggi militari attraverso l'intera penisola coreana tramite segnali di fumo di giorno e di fuoco di notte. Il sito, noto come Mongmyeoksan Beacon, è stato ricostruito nel 1993 sulla base dei disegni originali del celebre geografo e cartografo Kim Jeong-ho, ed è oggi visitabile gratuitamente insieme al resto del parco.<br><br><b>N Seoul Tower: una torre nata per continuare quella tradizione</b><br>Quando, alla fine degli anni '60, l'architetto Jang Jong-ryul progettò una moderna torre di trasmissione sulla stessa vetta, stava di fatto proseguendo, forse inconsapevolmente, una tradizione di comunicazione a distanza lunga oltre 600 anni. I lavori iniziarono il 15 dicembre 1969 sotto il governo del presidente Park Chung-hee, con l'obiettivo di consolidare in un unico punto le numerose antenne di trasmissione televisiva e radiofonica della città. La torre, alta 236,7 metri, sorge sulla vetta di Namsan a 243 metri sul livello del mare, raggiungendo così quasi 480 metri di altitudine complessiva nel punto più alto, più della sommità dell'Empire State Building. Curiosamente, pur essendo completata nei primi anni '70, restò chiusa al pubblico per decreto presidenziale fino al 1980, probabilmente per ragioni di sicurezza legate alla sua funzione di trasmissione strategica.<br><br><b>Cosa troveremo</b><br>Oltre alla torre panoramica, il parco offre Palgakjeong, un padiglione ottagonale tradizionale da cui si gode gratuitamente di un'ampia vista sulla città, e il celebre muro dei Lucchetti dell'Amore, dove le coppie appendono lucchetti come simbolo di un legame duraturo, secondo una leggenda locale per cui i desideri espressi in cima a Namsan si avvererebbero. Alla base della montagna, sul versante nord, si trova anche Namsangol Hanok Village, un piccolo villaggio con cinque case tradizionali restaurate in stile Joseon, un giardino coreano classico e uno spazio per spettacoli.", img:"Namsan Mountain Park e N Seoul Tower.jpg", tip:"Il parco è aperto 24 ore su 24 e l'ingresso è gratuito, mentre l'accesso alla torre panoramica ha un costo. Per raggiungere la cima si può camminare, prendere la funivia (Namsan Cable Car) o un autobus navetta; la torre è aperta indicativamente dalle 10:00 alle 22:30. Il tardo pomeriggio, verso il tramonto, resta il momento più consigliato: si vede la città in piena luce e, poco dopo, le luci notturne che si accendono su tutta Seoul, con la torre stessa che si illumina di blu nei giorni in cui la qualità dell'aria è buona.", move:"Partenza verso Hwangsaengga Kalguksu per cena.<br><b>Indirizzo per Naver:</b><br><br>서울 종로구 북촌로5길 78"},
    {n:"[20:30] Cena: Hwangsaengga Kalguksu", d:"Specialità kalguksu (noodle tagliati a coltello) in brodo di ossa di manzo, con mandu enormi fatti a mano all'ingresso con ingredienti freschi di mercato. Popolari anche il maiale bollito in stile antico e il kongguksu di stagione.", img:"Hwangsaengga Kalguksu.jpg", tip:"Aperto tutto il giorno, code frequenti. Si trova a Jongno-gu, fascia di prezzo economica (₩)."}

   {n:"[8:30] Tempio di Jongmyo", d:"<b>Il primo edificio costruito dalla nuova dinastia</b><br>Secondo i principi confuciani dell'urbanistica coreana, ripresi dagli antichi testi classici cinesi, la fondazione di una nuova capitale richiedeva la costruzione prioritaria di due installazioni sacre prima ancora del palazzo reale: il Sajikdan, un altare dedicato alle divinità della terra e dei raccolti, e Jongmyo, il santuario destinato a custodire gli spiriti dei sovrani defunti. Fu proprio per questo che, quando nel 1392 il generale Yi Seong-gye (poi re Taejo) fondò la dinastia Joseon e trasferì la capitale a Hanyang, l'odierna Seoul, Jongmyo fu il primo grande edificio a essere completato, già nel 1394-1395, addirittura prima del palazzo di Gyeongbokgung.<br><br><b>Un santuario che parla attraverso l'assenza</b><br>A differenza dei palazzi reali riccamente decorati con il dancheong, i tradizionali motivi colorati dell'architettura coreana, Jongmyo colpisce proprio per la sua austerità: nessun intaglio elaborato, nessun ornamento, solo il colore e la venatura naturale del legno invecchiato. Questa scelta rifletteva l'estetica confuciana perseguita dagli studiosi Joseon, per cui la reverenza doveva prevalere sulla decorazione, e la sincerità sull'ostentazione. Jeongjeon, la sala principale, è talmente lunga che risulta impossibile vederne un'estremità dall'altra restando davanti all'edificio, ed era considerata all'epoca della sua costruzione uno degli edifici in legno più lunghi di tutta l'Asia.<br><br><b>Distruzione e ricostruzione</b><br>Come gran parte degli edifici storici di Seoul, anche Jongmyo fu completamente distrutto durante l'invasione giapponese del 1592-1598, e ricostruito nel 1601, mantenendo da allora sostanzialmente intatta la propria forma originaria: un fattore che lo rende oggi il più antico e autentico tra i santuari ancestrali confuciani ancora esistenti, non solo in Corea ma nell'intera area culturale confuciana, dato che in Cina questo tipo di rituale non viene più celebrato.<br><br><b>Un triplice riconoscimento UNESCO</b><br>Jongmyo detiene tre distinti riconoscimenti UNESCO, un caso più unico che raro: il sito stesso è stato dichiarato Patrimonio Mondiale nel 1995, mentre il rituale che vi si celebra, Jongmyo Jerye, e la musica e danza rituale che lo accompagnano, Jongmyo Jeryeak, sono stati entrambi riconosciuti come Patrimonio Culturale Immateriale dell'Umanità nel 2001.<br><br><b>Il rituale ancora vivo: Jongmyodaeje</b><br>La cerimonia, che prevede offerte di cibo e vino agli spiriti dei sovrani insieme a canti, danze e musica rituale, seguiva durante l'epoca Joseon un calendario fisso di cinque celebrazioni annuali, finché non fu abolita durante l'occupazione coloniale giapponese. Fu ripristinata solo nel 1969, e da allora si tiene ogni anno la prima domenica di maggio, preceduta da una spettacolare processione in costume tradizionale, eogahaengnyeol, che attraversa le vie della Seoul moderna prima di raggiungere il santuario, dove tuttora discendenti della famiglia reale e oltre 1.000 partecipanti in abiti di corte celebrano il rito secondo un ordine cerimoniale definito già nel XV secolo e rimasto pressoché invariato.<br><br><b>Cosa troveremo</b><br>Il complesso si estende su un'area ovale di circa 19,4 ettari, e comprende, oltre a Jeongjeon, anche Yeongnyeongjeon (la Sala della Pace Eterna, un santuario ausiliario), Mangmyoru, una struttura in legno dove il re si raccoglieva in memoria degli antenati, e Hyangdaecheong, l'edificio che custodiva gli utensili rituali. All'interno delle sale principali sono conservate le tavolette spirituali di 49 tra re e regine della dinastia Joseon, ciascuna corredata da un pannello che ne riassume i meriti e i risultati durante il regno.", img:"Tempio di Jongmyo.jpg", tip:"Essendo un luogo di grande solennità, l'atmosfera a Jongmyo è decisamente più raccolta e silenziosa rispetto ai vicini palazzi di Changdeokgung e Changgyeonggung. Nei giorni feriali l'accesso è spesso possibile solo con visita guidata a orari prestabiliti, mentre nei weekend si può girare liberamente: conviene verificare in anticipo la modalità del giorno prescelto.", move:"Partenza verso Rain Report Rainbow.<br><b>Indirizzo per Naver:</b><br><br>서울시 종로구 종로 157"},
   {n:"[9:30] Spuntino: Rain Report Rainbow", d:"Una pausa dolce prima di proseguire verso il DDP. [Nota: il documento non include una scheda dettagliata per questo locale — aggiungi qui le info se ne hai.]", img:"Rain Report Rainbow.jpg", tip:"", move:"Partenza verso Dongdaemun Design Plaza.<br><b>Indirizzo per Naver:</b><br><br>서울시 중구 을지로 281"},
   {n:"[10:00] Dongdaemun Design Plaza (DDP)", d:"<b>Un sito stratificato nella storia di Seoul</b><br>L'area su cui sorge oggi il DDP ha una storia lunga e complessa. Durante la dinastia Joseon, questa zona ospitava un campo di addestramento militare e sfilate dell'esercito reale coreano, proprio in corrispondenza dell'antica porta orientale della cinta muraria di Seoul, Dongdaemun, da cui l'intero quartiere prende il nome. Nel 1925, durante l'occupazione coloniale giapponese, sul sito fu costruito lo stadio di Dongdaemun, il primo impianto sportivo moderno della Corea, utilizzato per baseball e calcio: rimase in funzione per oltre 80 anni, sopravvivendo alla guerra di Corea e diventando un luogo carico di significato per generazioni di seoulesi, oltre a essere per decenni sede di un vivace mercato di venditori ambulanti.<br><br><b>Una scelta architettonica controversa</b><br>Nel 2007 l'amministrazione della città di Seoul indisse un concorso internazionale per trasformare l'area in un nuovo polo dedicato al design, nell'ambito del più ampio progetto Design Seoul. Il progetto vincitore, intitolato Metonymic Landscape, fu firmato da Zaha Hadid, l'architetta anglo-irachena diventata nel 2004 la prima donna a vincere il Premio Pritzker, il massimo riconoscimento internazionale in architettura. La scelta non fu priva di polemiche: la demolizione dello storico stadio comportò lo sgombero della comunità di venditori ambulanti che vi lavorava da decenni, e diversi critici locali contestarono sia il costo elevato del progetto (circa 450 milioni di dollari) sia la scelta di affidarlo a un'archistar straniera invece che ad architetti coreani.<br><br><b>Un ponte tra passato e futuro</b><br>Durante i lavori di scavo, gli archeologi riportarono alla luce resti dell'antica cinta muraria Joseon e altri reperti storici della zona, che furono integrati nel progetto finale invece di essere rimossi: oggi questi ritrovamenti sono visibili nel Dongdaemun History & Culture Park, il parco archeologico che circonda l'edificio, e in un piccolo museo gratuito che racconta la storia stratificata del sito, comprese due delle luci originali dello stadio, lasciate come memoria del passato.<br><br><b>Un'architettura senza linee rette</b><br>Il DDP, inaugurato nel marzo 2014, è considerato il più grande edificio 3D atipico al mondo, cioè privo di linee rette o angoli retti nella sua forma esterna, un flusso continuo di curve che si ispira, secondo il concept originale, all'osservazione satellitare del corso del fiume Han. La superficie esterna è rivestita da oltre 45.000 pannelli di alluminio, ciascuno diverso dall'altro, per una superficie complessiva di quasi 87.000 metri quadrati. Zaha Hadid è scomparsa nel 2016, ma il DDP resta una delle sue opere più fotografate e visitate al mondo.<br><br><b>Cosa troveremo</b><br>Il complesso ospita sale espositive, un museo del design, spazi per sfilate di moda, conferenze e un mercato del design aperto 24 ore su 24. Dal giovedì alla domenica, dalle 19:00 a mezzanotte, la piazza esterna ospita anche il DDP Night Market, con circa 100 bancarelle di giovani designer coreani che vendono accessori fatti a mano, moda, ceramiche e street food.", img:"DDP.jpg", tip:"L'ingresso all'edificio e al parco è gratuito, salvo per alcune mostre temporanee a pagamento. È particolarmente suggestivo di sera, quando l'illuminazione LED esalta le curve della struttura. Essendo nel cuore del quartiere di Dongdaemun, famoso per lo shopping 24 ore su 24, si presta bene a una visita serale che unisca il DDP a una passeggiata tra i grandi magazzini della zona.", move:"Partenza alle 12:00 verso Pyongyang Myeonok.<br><b>Indirizzo per Naver:</b><br><br>서울 중구 장충단로 207"},
   {n:"[12:00] Pranzo: Pyongyang Myeonok", d:"<b>Il piatto della divisione: cos'è il naengmyeon di Pyongyang</b><br>Il naengmyeon, letteralmente noodle freddo, è originario del Nord della penisola coreana, in particolare delle regioni di Pyongyang e Hamhung, oggi in Corea del Nord. Con la divisione della Corea e la guerra del 1950-1953, migliaia di profughi provenienti da quelle zone si stabilirono a Seoul portando con sé le proprie ricette, dando così origine a molti dei ristoranti di naengmyeon oggi considerati istituzioni della capitale sudcoreana. Mangiare un piatto di naengmyeon di Pyongyang a Seoul è, in un certo senso, partecipare in piccolo a questa storia di migrazione e memoria: non a caso, il piatto è tornato agli onori della cronaca internazionale nel 2018, quando fu servito durante lo storico vertice intercoreano tra i leader di Nord e Sud Corea.<br><br><b>La differenza rispetto al naengmyeon più piccante</b><br>Esistono principalmente due grandi scuole di naengmyeon: quello di Pyongyang, dal brodo limpido e delicato a base di manzo (e in alcune varianti anche dongchimi, la salamoia di ravanello fermentato), e quello di Hamhung, più piccante e speziato, condito con gochujang. Pyongyang Myeonok appartiene alla prima categoria, quella più sobria e considerata dagli appassionati la forma più autentica e difficile da replicare, tanto da essere paragonata a un vero e proprio hamburger nordcoreano per la sua diffusione e importanza identitaria.<br><br><b>Una storia di famiglia lunga tre generazioni</b><br>Il locale è nato a Jangchung-dong, un quartiere a nord del fiume Han, ed è oggi gestito dalla terza generazione della stessa famiglia, che ha mantenuto la ricetta pressoché invariata nel tempo. Fa parte di quella cerchia di locali storici, insieme a nomi come Woo Lae Oak (attivo dal 1946) ed Eulji Myeonok, che vengono considerati collettivamente tra i migliori indirizzi di Seoul per il naengmyeon di Pyongyang tradizionale.<br><br><b>Cosa troveremo</b><br>Oltre al naengmyeon, servito nella versione in brodo (mul-naengmyeon) e in quella con kimchi (kimchi-mari naengmyeon), il menu comprende mandu al vapore (ravioli) e bossam, pancia di maiale bollita da avvolgere in foglie di kimchi o lattuga.", img:"Pyongyang Myeonok.jpg", tip:"Il naengmyeon è tradizionalmente un piatto estivo, ma i veri appassionati sostengono che il periodo migliore per gustarlo sia in realtà l'autunno-inverno. Come da tradizione, ai tavoli si trovano spesso forbici per tagliare i lunghi noodle di grano saraceno, oltre ad aceto e senape da aggiungere a piacere.", move:"Partenza alle 13:30 verso Starfield Library.<br><b>Indirizzo per Naver:</b><br><br>서울 강남구 영동대로 513"},
   {n:"[13:30] Starfield Library", d:"<b>Il complesso COEX: la prima grande infrastruttura congressuale della Corea</b><br>Starfield Library si trova all'interno di COEX Mall, il centro commerciale sotterraneo più grande al mondo, che affonda le proprie origini nel 1979, quando fu inaugurato come primo grande centro internazionale per convegni ed esposizioni della Corea del Sud (da cui l'acronimo COEX, Convention and Exhibition). Il centro commerciale si è ampliato negli anni fino a coprire circa 154.000-165.000 metri quadrati su un unico piano interrato, ospitando oggi oltre 320 negozi, un acquario, un cinema e più di 100 ristoranti.<br><br><b>Dal centro commerciale al fenomeno social</b><br>Nel 2014 la gestione del complesso passò al gruppo Shinsegae, che avviò un'importante ristrutturazione e ribattezzò l'area Starfield COEX Mall. Fu però solo nel 2017 che venne inaugurata Starfield Library, ufficialmente chiamata anche Byeolmadang Library in coreano: da allora è diventata rapidamente uno dei luoghi più fotografati e condivisi sui social media di tutta Seoul, un fenomeno piuttosto insolito per una biblioteca.<br><br><b>Un'architettura pensata per stupire</b><br>Il tratto distintivo della biblioteca sono le enormi librerie alte 13 metri, che si estendono lungo un atrio di circa 2.800 metri quadrati, illuminato da un soffitto semitrasparente che lascia filtrare la luce naturale. La collezione conta tra i 50.000 e i 70.000 volumi, spaziando tra saggistica, economia, hobbistica e una sezione dedicata a libri in lingua straniera, oltre a quasi 600 riviste coreane e internazionali consultabili liberamente.<br><br><b>Uno spazio pubblico aperto a tutti</b><br>A differenza di quanto suggerirebbe l'aspetto scenografico, Starfield Library è concepita come uno spazio pubblico gratuito e aperto a chiunque voglia semplicemente sedersi, leggere o studiare: sono disponibili tavoli con prese elettriche per PC portatili, e il luogo ospita regolarmente eventi culturali. Vale la pena sapere, però, che gran parte dei libri esposti sulle pareti più alte sono difficilmente raggiungibili e in gran parte decorativi, per cui l'esperienza resta più visiva che di reale consultazione.", img:"Starfield Library.jpg", tip:"L'ingresso è gratuito e la biblioteca è aperta tutti i giorni dalle 10:30 alle 22:00. Si raggiunge facilmente dalla stazione della metro di Samseong (linea 2, uscite 5 o 6): conviene seguire la segnaletica blu a terra all'interno di COEX, poiché i collegamenti sotterranei possono risultare labirintici alla prima visita.", move:"Partenza alle 14:30 verso Four Stones Coffee Roasters Samseong.<br><b>Indirizzo per Naver:</b><br><br>서울 강남구 영동대로 513"},
   {n:"[14:30] Caffè: Four Stones Coffee Roasters Samseong", d:"Una pausa caffè prima di proseguire verso il tempio di Bongeunsa, proprio nella stessa zona. [Nota: il documento non include una scheda dettagliata per questo locale — aggiungi qui le info se ne hai.]", img:"Four Stones Coffee Roasters.jpg", tip:"", move:"Partenza verso il Tempio di Bongeunsa.<br><b>Indirizzo per Naver:</b><br><br>서울특별시 강남구 봉은사로 531"},
   {n:"[15:00] Tempio di Bongeunsa", d:"<b>Le origini nel regno di Silla</b><br>Bongeunsa fu fondato nel 794, sotto il regno di re Wonseong di Silla, per mano del monaco Yeonhoe, all'epoca il religioso di rango più elevato di tutto il regno. Il tempio, originariamente chiamato Gyeonseongsa, sorgeva circa un chilometro a sud-ovest della sua posizione attuale.<br><br><b>Rinascita durante la repressione confuciana</b><br>Durante la dinastia Joseon, il buddismo coreano fu sottoposto a una severa repressione da parte del governo confuciano. Nel 1498, però, il tempio fu ricostruito e ampliato per volere della regina Jeonghyeon, che lo ribattezzò Bongeunsa, un nome che significa più o meno l'atto di onorare il re, inteso come preghiera per la vita eterna di re Seongjong. Fu poi trasferito nella sua posizione attuale durante il regno di Myeongjong, tra il 1545 e il 1567.<br><br><b>Il ruolo cruciale della regina Munjeong</b><br>La vera svolta arrivò a metà del XVI secolo, quando la regina Munjeong promosse una breve ma intensa rinascita del buddismo coreano, offrendo un sostegno decisivo a Bongeunsa: grazie al suo patrocinio, il tempio divenne nel 1551 la sede principale del buddismo Seon (l'equivalente coreano dello Zen), un ruolo che mantenne fino al 1936. Il monaco Bo-wu, nominato capo del tempio nel 1548 dalla stessa regina Munjeong, fu però ucciso poco dopo, quando le fazioni anti-buddiste tornarono a prevalere alla corte Joseon.<br><br><b>Un monaco che salvò centinaia di vite</b><br>Nel 1902 Bongeunsa fu designato come uno dei 14 templi principali della Corea, e durante l'occupazione coloniale giapponese divenne il centro amministrativo di oltre 80 templi minori nell'area di Seoul. In questo periodo si distinse la figura del monaco capo Cheongho, che nel 1922 e di nuovo nel 1929 salvò oltre 700 persone dall'annegamento nel fiume Han, un gesto eroico che gli valse un monumento commemorativo ancora oggi visibile nel tempio.<br><br><b>Un'oasi verde tra i grattacieli di Gangnam</b><br>Prima degli anni '60, l'area attorno al tempio era ancora circondata da campagna e frutteti; con la rapidissima crescita di Gangnam, oggi uno dei quartieri più ricchi e trafficati di Seoul, Bongeunsa è diventato un contrasto quasi surreale tra un sito buddista di oltre 1.200 anni e i grattacieli che lo circondano da ogni lato, incluso lo stesso COEX Mall proprio di fronte.<br><br><b>Cosa troveremo</b><br>Il tempio, esteso su circa 36.000 metri quadrati con oltre 20 edifici, ospita una grande statua del Buddha Maitreya, simbolo di speranza e meditazione, e Daeungjeon, la sala principale con la triade di statue del Buddha Sakyamuni, riccamente decorata con i tradizionali motivi colorati dancheong. Due volte al giorno, alle 4:10 e alle 18:40, i monaci celebrano una cerimonia percussiva con quattro strumenti, ciascuno pensato per risvegliare esseri di un diverso regno.", img:"Tempio di Bongeunsa.jpg", tip:"L'ingresso è gratuito e il tempio è aperto tutti i giorni dalle 3:00 alle 22:00. Rispetto al più centrale e affollato Jogyesa a Insadong, Bongeunsa offre un'atmosfera più raccolta e boscosa.", move:"Partenza alle 16:00 verso Seokchon Lake.<br><b>Indirizzo per Naver:</b><br><br>서울 송파구 삼학사로 136"},
   {n:"[16:00] Seokchon Lake", d:"<b>Un'isola scomparsa nel fiume Han</b><br>La storia di questo luogo comincia molto prima che diventasse un lago: l'area di Jamsil, oggi uno dei quartieri più moderni di Seoul, era originariamente una vera isola fluviale, chiamata Burido, che divideva il corso del fiume Han in due rami. Nel 1971, nell'ambito di un più ampio progetto di sistemazione del fiume Han, fu avviata un'opera di bonifica che collegò l'isola alla terraferma, colmando il ramo settentrionale del fiume: da quell'intervento nacque l'attuale quartiere di Jamsil, mentre una porzione del vecchio corso d'acqua fu volutamente lasciata intatta, dando origine al lago artificiale che oggi conosciamo come Seokchon Lake.<br><br><b>Il nome: il ricordo di un antico approdo</b><br>Il nome ufficiale del parco che lo circonda è Songpanaru, in memoria dell'antico porto fluviale (naru) che sorgeva proprio in questa zona. Il nome più diffuso, Seokchon, che significa villaggio di pietra, è però quello con cui la maggior parte dei residenti conosce ancora oggi il lago.<br><br><b>Da area trascurata a parco cittadino</b><br>Solo nel 1981 fu ufficialmente inaugurato come parco pubblico. Nel 2001 l'amministrazione del distretto di Songpa avviò un importante progetto di riqualificazione ambientale, trasformandolo finalmente nel parco curato e apprezzato che è oggi. Il lago è oggi diviso in due bacini, est e ovest, separati dalla trafficata Songpa-daero.<br><br><b>Cosa troveremo</b><br>Il lago è oggi circondato da un percorso pedonale pianeggiante di circa 2,5-2,6 km, molto amato dai residenti per passeggiate, jogging e picnic. Al centro del bacino ovest si trova Lotte World Magic Island, un'isola artificiale a forma di castello fiabesco collegata al resto del parco divertimenti Lotte World tramite una piccola monorotaia, mentre sullo sfondo si staglia la Lotte World Tower, il grattacielo più alto della Corea del Sud. Lungo il lago si trovano anche due pianoforti pubblici a disposizione di chiunque voglia suonare.<br><br><b>Il periodo più spettacolare: la fioritura dei ciliegi</b><br>Seokchon Lake è oggi una delle mete di hanami più famose e affollate di tutta la Corea del Sud: durante il picco della fioritura, tra fine marzo e metà aprile, l'area arriva a ricevere fino a 2-3 milioni di visitatori in una singola settimana.", img:"Seokchon Lake.jpg", tip:"Si raggiunge comodamente dalla stazione della metro di Jamsil (uscite 2 o 3), proprio accanto sia al vecchio Lotte Mall sia al nuovo Lotte World Mall. Essendo proprio accanto a Lotte World e alla torre panoramica Seoul Sky, si presta bene a essere abbinato a una giornata dedicata interamente a Jamsil.", move:"Partenza alle 18:30 verso Namhansanseong - West Gate (zona esterna alla città, mettete in conto un tragitto più lungo).<br><b>Indirizzo per Naver:</b><br><br>경기도 광주시 남한산성면 산성리 (남한산성 서문)"},
   {n:"[18:30] Namhansanseong - West Gate e punto panoramico", d:"<b>Una fortezza-capitale d'emergenza</b><br>Namhansanseong (letteralmente fortezza del monte a sud del fiume Han) fu costruita a partire dall'epoca della Silla Unificata, nell'VIII secolo, e ampliata più volte nei secoli successivi come sistema difensivo strategico per proteggere Hanyang, l'antica Seoul, insieme alla gemella Bukhansanseong a nord della città. Non era una semplice fortificazione militare, ma una vera e propria capitale d'emergenza pianificata: al suo interno sorgevano un palazzo reale temporaneo (l'Haenggung), depositi per le provviste militari e alloggi pensati per ospitare l'intera corte in caso di guerra o invasione. Nel 2014 è stata dichiarata Patrimonio Mondiale UNESCO.<br><br><b>Il capitolo più drammatico: l'invasione manciù del 1636</b><br>Il momento più significativo nella storia della fortezza risale al 1636, durante la Seconda Invasione Manciù della Corea (Byeongja Horan). Il re Injo, incalzato dalle truppe dell'appena fondata dinastia Qing, si rifugiò proprio qui insieme alla corte, resistendo per circa 47 giorni sotto assedio. Fu proprio nei pressi del cancello ovest, quello di cui parliamo oggi, che si combatté uno degli scontri più cruenti contro le truppe Qing. Alla fine, senza speranza di soccorsi, re Injo e il principe ereditario Sohyeon furono costretti a uscire proprio da questo cancello per recarsi all'accampamento nemico a Samjeondo e arrendersi formalmente, in un episodio ricordato come una delle umiliazioni più cocenti della storia coreana: il sovrano fu costretto a inginocchiarsi e a battere la testa a terra per tre volte, nove volte in totale, davanti all'imperatore Qing, come segno di sottomissione totale.<br><br><b>Perché è chiamato anche cancello destro</b><br>Nel sistema tradizionale di orientamento dei quattro cancelli della fortezza, quello orientale era considerato il cancello sinistro, mentre quello occidentale, di cui parliamo oggi, era conosciuto come il cancello destro. Si trova a circa 450 metri di altitudine, sul lato orientale della montagna, in un punto dal pendio piuttosto ripido.<br><br><b>Il punto panoramico più fotografato di Seoul</b><br>Oggi, proprio nei pressi del cancello ovest, si trova uno dei punti di osservazione più amati dai fotografi di tutta la capitale coreana: da qui, in condizioni di buona visibilità, si allineano perfettamente all'orizzonte la Lotte World Tower, il fiume Han e la N Seoul Tower su Namsan, regalando uno scatto notturno considerato tra i più iconici di Seoul. Nelle giornate più terse, si dice che sia possibile scorgere persino il mare in lontananza.", img:"Namhansanseong West Gate.jpg", tip:"Essendo un punto molto ambito dai fotografi, soprattutto al tramonto e di sera, conviene arrivare con un certo anticipo se si vuole un buon posto per il treppiede. Si raggiunge con la metro (linea 8, stazione Namhansanseong o Sanseong) seguita da un autobus locale (linee 9, 9-1 o 52), oppure in auto fino al parcheggio Rotary o Nammun, da cui si cammina per raggiungere il cancello. Consigliamo scarpe comode da cammino.", move:"Partenza alle 20:30 verso Samwon Garden per cena (zona Apgujeong-Cheongdam, mettete in conto un buon tragitto in auto).<br><b>Indirizzo per Naver:</b><br><br>서울 강남구 언주로 835"},
   {n:"[20:30] Cena: Samwon Garden", d:"<b>Quasi cinquant'anni di storia</b><br>Samwon Garden ha aperto nel 1976 nel quartiere di Apgujeong, e per decenni è stato considerato il ristorante più grande di tutta Seoul, oltre che un vero punto di riferimento per la cucina coreana tradizionale di alta qualità. Nel corso di quasi cinquant'anni di attività, il locale ha contribuito a definire lo standard stesso del barbecue coreano moderno (gogigui), trovando un equilibrio tra comfort familiare e cucina più ricercata, uno stile che gli è valso negli ultimi anni un piatto Michelin nella Guida Michelin di Seoul (2023-2026).<br><br><b>Una tecnica di taglio brevettata</b><br>Uno degli elementi distintivi del ristorante è la sua tecnica di taglio della carne, chiamata Diamond Cut, un metodo brevettato pensato per esaltare al massimo la tenerezza e la marinatura del manzo hanwoo, la pregiata razza bovina coreana, prima della cottura alla griglia.<br><br><b>Un'oasi verde nel cuore di Apgujeong-Cheongdam</b><br>Il ristorante si trova in una delle zone più esclusive di Seoul, Apgujeong-Cheongdam, un quartiere che rivaleggia con Sinsa e Garosugil per fama di lusso. In netto contrasto con la frenesia urbana circostante, Samwon Garden accoglie i clienti con un giardino curato, una cascata artificiale, soffitti alti e ampie vetrate, offrendo un'atmosfera di quiete piuttosto insolita per il centro di Gangnam.<br><br><b>Cosa troveremo</b><br>Il piatto più celebre è probabilmente il hanu bulgogi, manzo hanwoo marinato e grigliato con la tecnica del taglio a diamante, ma il menu comprende anche il galbi marinato (yangnyeom galbi), il galbi non marinato alla griglia (saenggalbi), lo yukhoe di manzo hanwoo crudo, il ttukbaegi bulgogi (bulgogi servito in una casseruola di terracotta bollente) e, per chiudere il pasto, un naengmyeon di grano saraceno. Il ristorante dispone anche di diverse sale private.", img:"Samwon Garden.jpg", tip:"Si trova a pochi minuti dalla stazione di Apgujeong, all'indirizzo 835 Eonju-ro. Essendo un locale storico molto frequentato, conviene prenotare in anticipo, soprattutto per cena o nei weekend. I prezzi sono nella fascia alta rispetto alla media dei ristoranti di barbecue coreano."}

  {n:"[8:30] Paldalmun Gate", d:"<b>Una fortezza costruita per amore filiale</b><br>Paldalmun è il cancello meridionale della fortezza Hwaseong di Suwon, costruita tra il 1794 e il 1796 per volere di re Jeongjo, uno dei sovrani più illuminati della tarda dinastia Joseon. Il progetto nacque da una motivazione profondamente personale: nel 1789 re Jeongjo fece trasferire le spoglie del padre, il principe ereditario Sado, dal monte Baebongsan al monte Hwasan, proprio nei pressi di Suwon. La vicenda del principe Sado è tra le più tragiche della storia della dinastia Joseon: accusato di comportamenti violenti e instabili, fu condannato a morte dal proprio padre, re Yeongjo, che lo fece rinchiudere vivo in una cassa di riso, dove morì dopo otto giorni di agonia. Costruendo Hwaseong e trasferendo la tomba paterna in questo luogo, re Jeongjo intendeva onorarne la memoria e, secondo alcuni storici, anche consolidare la propria base di potere lontano dalla vecchia aristocrazia di corte di Hanyang.<br><br><b>Un cantiere all'avanguardia per l'epoca</b><br>La costruzione dell'intera fortezza, che si estende per circa 5,74 km di mura su 130 ettari, fu diretta dallo studioso riformista Jeong Yak-yong, figura di spicco del movimento Silhak (apprendimento pratico), che introdusse tecniche costruttive innovative per l'epoca, tra cui speciali gru e sistemi di carrucole (geojunggi) capaci di sollevare pesi enormi, riducendo drasticamente i tempi e i costi di costruzione rispetto ai metodi tradizionali. Il risultato fu riconosciuto come un capolavoro di ingegneria militare, tanto da valere a Hwaseong l'iscrizione nella lista del Patrimonio Mondiale UNESCO nel 1997.<br><br><b>Il nome: strade aperte in ogni direzione</b><br>Il nome Paldalmun significa letteralmente strade aperte in ogni direzione, un riferimento alla sua funzione di porta principale verso sud, sufficientemente ampia da permettere il passaggio del re in visita, accompagnato da cavalli e portantine reali. È oggi classificato come Tesoro Nazionale numero 402, ed è considerato l'unico dei quattro cancelli principali di Hwaseong ad aver conservato la struttura lignea originale del tardo XVIII secolo.<br><br><b>Un'architettura pensata per la difesa</b><br>Sopra il portale in pietra a forma di arco si eleva una struttura a due piani, circondata da un basso parapetto sulla terrazza superiore. All'esterno del cancello si trova inoltre Ongseong, un bastione semicircolare in muratura pensato per rallentare e intrappolare eventuali assalitori prima che potessero raggiungere il cancello vero e proprio.<br><br><b>Cosa troveremo</b><br>A differenza di molti siti storici coreani rimasti isolati dal tessuto urbano, Paldalmun si trova oggi nel bel mezzo del centro cittadino di Suwon, circondato da una rotonda stradale trafficata, mercati tradizionali, negozi e bancarelle di street food. Nei pressi si trova anche una grande campana che i visitatori possono suonare, e salendo sulla collina di Paldalsan, alle spalle del cancello, si gode di una bella vista panoramica su Suwon e sulle mura della fortezza.", img:"Paldalmun Gate.jpg", tip:"L'ingresso al cancello è gratuito, mentre visitare altri punti della fortezza o il museo annesso può richiedere un biglietto. Essendo circondato da strade trafficate, conviene fare attenzione nell'attraversamento; consigliamo scarpe comode, dato che il modo migliore per apprezzare la fortezza resta camminare lungo un tratto delle mura.", move:"Partenza verso Hwaseong Haenggung Palace (pochi passi).<br><b>Indirizzo per Naver:</b><br><br>경기도 수원시 팔달구 정조로 825"},
  {n:"[9:00] Hwaseong Haenggung Palace", d:"<b>Un palazzo temporaneo, ma il più grande del suo genere</b><br>Haenggung significa letteralmente palazzo temporaneo o rifugio, ed era il termine usato in epoca Joseon per indicare le residenze secondarie dove il re risiedeva durante i propri spostamenti fuori dalla capitale. Costruito tra il 1789 e il 1796, questo complesso di oltre 1.200 metri quadrati e 22 edifici è considerato il più grande haenggung mai costruito durante l'intera dinastia Joseon.<br><br><b>Le funzioni del palazzo</b><br>Re Jeongjo lo utilizzò principalmente in due occasioni: come rifugio in caso di guerra o pericolo per la capitale, e come residenza durante i suoi frequenti viaggi per rendere omaggio alla tomba del padre, il principe Sado. Oltre alla funzione residenziale, il palazzo ospitava anche gli uffici amministrativi del governo locale di Suwon.<br><br><b>Il grande banchetto del 1795</b><br>L'evento più celebre mai ospitato nel palazzo fu la processione Eulmyo Hwaseong del 1795: un corteo cerimoniale sontuoso che percorse l'intero tragitto da Changdeokgung, a Seoul, fino a Hwaseong, organizzato da re Jeongjo per celebrare il sessantesimo compleanno della madre, Lady Hyegyeong. Il banchetto vero e proprio si tenne nella sala Bongsudang, ancora oggi il punto più significativo della visita.<br><br><b>L'albero sacro</b><br>All'ingresso del cortile del palazzo si trova uno zelkova secolare, con oltre 600 anni di vita: secondo la tradizione locale, l'albero custodirebbe ancora oggi lo spirito di re Jeongjo, e chi scrive un desiderio su un foglio di carta e lo lega alla corda di paglia attorno al tronco potrebbe vederlo esaudito.<br><br><b>Distruzione e restauro</b><br>Nel 1923, durante l'occupazione coloniale giapponese, le autorità demolirono una parte consistente del palazzo per costruire un ospedale pubblico della provincia del Gyeonggi. Solo nel 1989 fu istituito un comitato dedicato al suo restauro, contribuendo anche al riconoscimento di Hwaseong come Patrimonio Mondiale UNESCO nel 1997.<br><br><b>Cosa troveremo</b><br>Il palazzo ospita oggi spettacoli e dimostrazioni culturali regolari, incluse rievocazioni di arti marziali tradizionali, ed è il fulcro dell'annuale Suwon Hwaseong Cultural Festival, che si tiene ogni ottobre. Tra maggio e ottobre, in alcune sere, il palazzo resta aperto più a lungo con un'illuminazione scenografica.", img:"Hwaseong Haenggung Palace.jpg", tip:"Si trova all'indirizzo 825 Jeongjo-ro, Paldal-gu, Suwon-si, ed è aperto tutto l'anno dalle 9:00 alle 18:00, con ultimo ingresso alle 17:00; il biglietto è separato rispetto alla semplice passeggiata gratuita lungo le mura. La zona è famosa per il wang-galbi in stile Suwon, costolette di manzo marinate alla griglia.", move:"Partenza verso Haenggung-dong Mural Village (pochi minuti a piedi).<br><b>Indirizzo per Naver:</b><br><br>수원 화성행궁 (cerca per nome)"},
  {n:"[10:30] Haenggung-dong Mural Village", d:"<b>Il quartiere più vivace di Suwon per due secoli</b><br>Haenggung-dong è il nome collettivo di 12 quartieri, tra cui Jangan-dong e Sinpung-dong, che si sviluppano proprio a ridosso della fortezza di Hwaseong e del palazzo temporaneo. Per circa 220 anni, dalla costruzione della fortezza fino a pochi decenni fa, quest'area è stata il cuore pulsante e più animato di tutta Suwon.<br><br><b>Il paradosso della protezione UNESCO</b><br>Con la designazione di Hwaseong Fortress come sito Patrimonio Mondiale UNESCO nel 1997, l'area circostante fu sottoposta a severe restrizioni edilizie, pensate per proteggere l'integrità storica e visiva della fortezza. Se da un lato questo ha preservato il tessuto urbano storico, dall'altro ha di fatto congelato lo sviluppo del quartiere, che cadde in un progressivo declino e abbandono.<br><br><b>La rinascita attraverso l'arte</b><br>Fu proprio da questa condizione di stallo che, a partire dal 2010, residenti, associazioni civiche e artisti locali decisero di collaborare per restituire vita al quartiere, dipingendo murales sulle facciate delle case, molte delle quali risalenti agli anni '70. L'iniziativa ha avuto un successo tale da trasformare Haenggung-dong in un'attrazione turistica capace oggi di attirare quasi lo stesso numero di visitatori della vicina fortezza.<br><br><b>Un quartiere diviso per temi</b><br>Il villaggio dei murales è organizzato in sei vicoli tematici distinti, tra cui la via della Felicità (Haengbokha-gil) e la via dell'Amore (Saranghada-gil), oltre a diverse zone fotografiche allestite appositamente.<br><br><b>Un set cinematografico tra le vie del quartiere</b><br>Negli ultimi anni il quartiere è diventato anche una meta ambita dagli appassionati di K-drama, essendo comparso come location in diverse produzioni di successo internazionale, tra cui Lovely Runner, Our Beloved Summer, Twenty-Five Twenty-One, Extraordinary Attorney Woo e Queen of Tears.<br><br><b>Cosa troveremo</b><br>Oltre ai murales, il quartiere ospita piccole gallerie ricavate in abitazioni anni '70 riconvertite, e diversi caffè in stile newtro. Proprio di fronte al palazzo si trova anche il Suwon Museum of Art.", img:"Haenggung-dong Mural Village.jpg", tip:"L'accesso è libero e gratuito in qualunque momento, ma la luce migliore per fotografare i murales resta quella diurna. Si trova a pochi passi da Hwaseong Haenggung Palace: la stazione più comoda è Hwaseo (uscite 5 o 6). Come per Gamcheon a Busan, ricordate che è un quartiere ancora abitato: rispetto per i residenti, voce bassa.", move:"Partenza verso Jidong Mural Village.<br><b>Indirizzo per Naver:</b><br><br>경기도 수원시 팔달구 창룡문로 75-5"},
  {n:"[11:30] Jidong Mural Village", d:"<b>Un quartiere lungo le mura orientali di Hwaseong</b><br>Jidong Mural Village sorge lungo il tratto orientale delle mura della fortezza di Hwaseong, non lontano da Haenggung-dong, ma con un'identità e un carattere distinti. Anche qui i murales si sono sviluppati come iniziativa di rigenerazione urbana dal basso, coinvolgendo residenti e artisti locali.<br><br><b>Sette temi lungo 6 km di vicoli</b><br>Le opere si sviluppano lungo un percorso di circa 6 km, organizzato attorno a sette temi differenti, che rendono la passeggiata tra i vicoli tortuosi del quartiere una sorta di caccia al tesoro visiva.<br><br><b>Un set per Our Beloved Summer</b><br>Il quartiere è diventato una meta molto ambita dai fan dei K-drama grazie alla serie di successo internazionale Our Beloved Summer, che ha scelto proprio uno dei vicoli di Jidong come casa del personaggio principale, Kook Yeon-soo. Il celebre cancello verde della sua abitazione, situato accanto al Jidong Supermarket, è oggi uno dei punti fotografici più cercati dai visitatori.<br><br><b>Cosa troveremo</b><br>Oltre ai murales e ai punti fotografici legati al drama, il quartiere offre piccoli caffè, botteghe artigiane a conduzione familiare e alcuni programmi di village experience organizzati dalla provincia del Gyeonggi.", img:"Jidong Mural Village.jpg", tip:"Come per Haenggung-dong, valgono le stesse raccomandazioni di rispetto per i residenti. Le prime ore del mattino o il tardo pomeriggio restano il momento migliore per la luce fotografica.", move:"Partenza verso Jidong Market per pranzo.<br><b>Indirizzo per Naver:</b><br><br>수원 지동시장 (cerca per nome)"},
  {n:"[12:30] Pranzo: Jidong Market", d:"<b>L'unico mercato della storia coreana fondato da un re</b><br>Jidong Market fa parte di un complesso più ampio conosciuto come Paldalmun Market, nato dall'unione di due mercati contigui, Yeongdong Market e Jidong Market, entrambi situati proprio nei pressi del cancello meridionale di Suwon. Ciò che rende questo mercato particolarmente insolito è la sua origine: fu lo stesso re Jeongjo, nel corso della costruzione di Hwaseong nel tardo XVIII secolo, a volere la creazione di un'area commerciale proprio a ridosso della nuova fortezza, rendendolo di fatto l'unico mercato nella storia coreana ad essere stato fondato direttamente per volontà di un sovrano.<br><br><b>Un'eredità di commercio del bestiame</b><br>Il commercio in questa zona di Suwon affonda le proprie radici nei primi del Novecento, ma la fama storica dell'area risale ancora più indietro: dall'epoca Joseon fino agli anni '40 del Novecento, Suwon ospitava qui il più grande mercato del bestiame di tutta la Corea.<br><br><b>Il cuore gastronomico: Sundae Alley</b><br>Il tratto più celebre e visitato del mercato è senza dubbio Sundaegolmok, il vicolo del sundae, il tradizionale insaccato coreano a base di sangue di maiale, glass noodle e altri ingredienti, servito qui in numerose varianti, tra cui il sundae-gopchang (con trippa alla griglia). Il mercato è famoso anche per i suoi mandu, i ravioli coreani, venduti sia bolliti sia fritti.<br><br><b>Cosa troveremo</b><br>Passeggiando tra le bancarelle si trovano prodotti freschi, spezie, tessuti e casalinghi fianco a fianco con lo street food più tipico coreano, tra cui tteokbokki, hotteok e carne grigliata al momento.", img:"Jidong Market.jpg", tip:"È aperto tutti i giorni indicativamente dalle 6:15 alle 22:00, ma buona parte delle bancarelle di cibo di strada è più attiva a partire dal tardo mattino e nel primo pomeriggio. Si trova a pochi minuti a piedi da Paldalmun e da Jidong Mural Village.", move:"Partenza alle 14:00 verso Dongjangdae.<br><b>Indirizzo per Naver:</b><br><br>수원 동장대 / 연무대 (cerca per nome)"},
  {n:"[14:00] Dongjangdae - Comando Est (Yeonmudae)", d:"<b>Un doppio nome per una doppia funzione</b><br>Dongjangdae, che significa letteralmente comando est, è conosciuto anche come Yeonmudae, nome che riflette la sua seconda funzione storica: quella di campo di addestramento militare. Fu costruito nel 1795, e si trova su un'altura tra il cancello orientale Changnyongmun e la porta ad acqua settentrionale Hwahongmun, in una posizione strategica che garantiva un'ampia visuale sull'interno della fortezza.<br><br><b>Comando e scuola di guerra insieme</b><br>Inizialmente concepito come posto di guardia a difesa della residenza reale, Dongjangdae divenne ben presto anche un vero e proprio campo di addestramento per le truppe Joseon, dove i soldati si esercitavano nell'uso di spada, lancia e arco.<br><br>Il sistema difensivo di Hwaseong nel suo complesso</b><br>Dongjangdae fa parte di un più ampio sistema di strutture pensate a scopo militare lungo il perimetro della fortezza, che comprende anche i gongsimdon, particolari torri di osservazione a pianta circolare, e i bongdon, torri di segnalazione a fuoco.<br><br><b>Cosa troveremo</b><br>Oggi Dongjangdae è uno dei punti più tranquilli e meno affollati dell'intero complesso, un cortile racchiuso da mura con una bella vista panoramica sulla città di Suwon. È possibile provare l'esperienza del tiro con l'arco tradizionale coreano indossando un'uniforme militare d'epoca, oltre a un piccolo caffè ricavato in un edificio in stile hanok al piano superiore.", img:"Dongjangdae.jpg", tip:"L'ingresso è gratuito e l'orario varia stagionalmente, indicativamente dalle 9:30 alle 16:30 da novembre a febbraio e fino alle 17:30 da marzo a ottobre. Si raggiunge con una piacevole camminata di circa 8 minuti lungo le mura partendo da Hwaseomun, oppure con il trenino turistico Hwaseong Trolley.", move:"Partenza verso Café Paletscent.<br><b>Indirizzo per Naver:</b><br><br>경기도 수원시 팔달구 정조로 904-1"},
  {n:"[15:00] Spuntino/caffè: Café Paletscent", d:"<b>Cos'è</b><br>Paletscent (letteralmente palette + profumo, dall'unione delle parole inglesi palette e scent) è un caffè molto popolare di Suwon, situato al secondo piano di un edificio proprio di fronte a Janganmun, il cancello settentrionale e principale di Hwaseong Fortress, nel quartiere di Haenggung-dong.<br><br><b>Il vero motivo per cui è famoso: la vista</b><br>Il punto di forza del locale è senza dubbio la vista sulla terrazza panoramica sul tetto, da cui si gode di un'inquadratura diretta e senza ostacoli su Janganmun, uno degli scatti più fotografati di tutta Suwon. Il secondo piano, con grandi vetrate, offre un'alternativa comoda nei giorni troppo freddi o piovosi per salire sul rooftop.<br><br><b>Cosa troveremo</b><br>Il menu comprende caffè, tè e bevande a base di frutta (ade), oltre a proposte più originali come il popcorn latte e il matcha cream latte, insieme al drink firmato dal locale, il Paletscent Latte. Non manca una selezione di dolci, tra cui cookie, scone e cheesecake bruciacchiata.", img:"Café Paletscent.jpg", tip:"Si trova all'indirizzo 904-1 Jeongjo-ro, Paldal-gu, Suwon-si, con orario indicativamente dalle 11:30/12:00 alle 21:00, chiuso il martedì. Essendo molto richiesto, soprattutto per i posti in terrazza, conviene arrivare presto. Le scale per accedere al locale sono piuttosto ripide.", move:"Partenza verso Janganmun (proprio di fronte).<br><b>Indirizzo per Naver:</b><br><br>수원 장안문 (cerca per nome)"},
  {n:"[15:30] Janganmun - La Porta Nord", d:"<b>Il nome: l'ambizione di una nuova capitale</b><br>Janganmun è il cancello settentrionale della fortezza di Hwaseong, ed è il più grande tra i quattro cancelli principali ancora esistenti. Il nome Jangan porta con sé un duplice significato: capitale e benessere del popolo, una scelta linguistica tutt'altro che casuale, che rifletteva l'ambizione di re Jeongjo di trasformare Suwon in una vera e propria capitale secondaria del regno, alternativa a Hanyang (l'odierna Seoul).<br><br><b>Il cancello del re</b><br>A differenza della maggior parte delle fortezze coreane, dove il cancello meridionale rappresenta tradizionalmente l'ingresso principale, a Hwaseong fu Janganmun a ricoprire questo ruolo: essendo la direzione da cui il re arrivava in visita da Hanyang, situata a nord, questo cancello era il primo che il sovrano attraversava. Costruito tra il 28 febbraio e il 5 settembre 1794, è oggi anche più grande di Sungnyemun (Namdaemun), il celebre cancello meridionale della stessa Seoul.<br><br><b>Un'architettura pensata per intimidire e proteggere</b><br>La struttura si sviluppa su una solida base in pietra, sormontata da un elegante padiglione ligneo a due piani con tetto a padiglione, decorato con i tradizionali motivi colorati dancheong. All'esterno del cancello vero e proprio si trova ongseong, un bastione semicircolare in mattoni.<br><br><b>Distruzione e ricostruzione</b><br>Come molti altri edifici storici coreani, anche Janganmun fu danneggiato durante la guerra di Corea (1950-1953), e ricostruito fedelmente nel 1975 sulla base degli Hwaseong Seongyeok Uigwe, i dettagliatissimi registri di costruzione originali della fortezza.<br><br><b>Cosa troveremo</b><br>È possibile salire fino alla parte superiore del cancello, da cui si gode di una bella vista panoramica sulla città e sul tratto di mura circostante. Da qui parte anche una delle passeggiate più suggestive lungo l'intero perimetro fortificato, che si estende per oltre 5,5 km.", img:"Janganmun.jpg", tip:"L'accesso al cancello e all'area circostante è gratuito e sempre aperto, 24 ore su 24. È particolarmente suggestivo anche in versione notturna.", move:"Passeggiata lungo le mura verso Hwaseomun.<br><b>Indirizzo per Naver:</b><br><br>수원 화서문 (cerca per nome)"},
  {n:"[16:30] Fortezza di Hwaseong", d:"<b>Una fortezza costruita per amore filiale e per un sogno politico</b><br>Hwaseong fu costruita tra il 1794 e il 1796 per volere di re Jeongjo, ventiduesimo sovrano della dinastia Joseon, in seguito al trasferimento della tomba del padre, il principe Sado, sul vicino monte Hwasan. Dietro il gesto di pietà filiale si celava però anche un'ambizione politica più ampia: fare di Suwon una nuova città fortificata, moderna e prospera, capace persino di diventare una seconda capitale del regno.<br><br><b>Un capolavoro di ingegneria illuminista coreana</b><br>La fortezza si estende per circa 5,74 km di mura su un'area di 130 ettari. Il progetto fu diretto dallo studioso riformista Jeong Yak-yong, esponente di spicco del movimento Silhak, che introdusse tecniche costruttive rivoluzionarie, incluse speciali gru a carrucola, i geojunggi. Hwaseong fu inoltre la prima grande opera pubblica della storia coreana interamente finanziata dallo stato e retribuita ai lavoratori, invece di ricorrere al lavoro forzato.<br><br><b>Un sistema difensivo completo</b><br>Lungo il perimetro murario si trovano quattro cancelli principali orientati ai punti cardinali, oltre a due comandi militari, torri di osservazione circolari (gongsimdon), torri di segnalazione a fuoco (bongdon), porte ad acqua e numerosi bastioni.<br><br><b>Il riconoscimento UNESCO</b><br>Hwaseong Fortress è stata dichiarata Patrimonio Mondiale dell'UNESCO nel 1997, un riconoscimento che comprende l'intero sistema fortificato insieme al palazzo temporaneo di Hwaseong Haenggung al suo interno.<br><br><b>Un patrimonio ancora vivo</b><br>Ogni ottobre, la fortezza e il palazzo ospitano il Suwon Hwaseong Cultural Festival. In alcune sere, tra la primavera e l'autunno, viene inoltre organizzato il Moonlight Tour, una visita guidata serale alla luce delle lanterne.", img:"Fortezza di Hwaseong.jpg", tip:"La passeggiata lungo le mura è gratuita e sempre accessibile, mentre l'ingresso a Hwaseong Haenggung Palace richiede un biglietto separato. Non è necessario percorrerla per intero: conviene scegliere un tratto in base al tempo a disposizione."},
  {n:"[18:00] Porta Hwaseomun - La Porta Ovest", d:"<b>Un cancello più semplice, ma non meno prezioso</b><br>Hwaseomun fu costruito tra il 1795 e il 1796, nel diciannovesimo anno di regno di re Jeongjo, come cancello occidentale della fortezza di Hwaseong. A differenza di Janganmun e Paldalmun, entrambi a due piani per sottolineare la dignità reale, Hwaseomun e il suo gemello orientale Changnyongmun furono costruiti con un padiglione a un solo piano, più semplice ma non per questo meno curato. È oggi classificato come Tesoro Nazionale numero 403.<br><br><b>Un collegamento strategico verso la costa</b><br>Dal punto di vista strategico, Hwaseomun rappresentava la via di collegamento verso Namyangman e la costa occidentale della provincia del Gyeonggi. Come gli altri cancelli della fortezza, presenta una struttura a semicerchio (ongseong) a protezione dell'ingresso.<br><br><b>Un cancello sopravvissuto quasi intatto</b><br>Hwaseomun è tra i pochi elementi della fortezza ad aver conservato la propria struttura praticamente inalterata nel corso dei secoli, senza le distruzioni subite invece da Paldalmun durante la guerra di Corea.<br><br><b>Cosa troveremo</b><br>Proprio accanto al cancello si trova Seobuk Gongsimdon, la torre di osservazione nord-occidentale, una delle strutture più originali di tutta Hwaseong per la sua caratteristica forma ovale. Salendo pochi gradini si raggiunge la sommità del cancello, da cui si gode di una vista suggestiva sia sulle mura sia sul traffico moderno della città.", img:"Hwaseomun.jpg", tip:"Come gli altri cancelli, l'accesso è gratuito e sempre aperto. I visitatori consigliano di visitarlo verso le 16:00, così da poter ammirare sia la luce del tardo pomeriggio sia l'illuminazione serale.", move:"Partenza verso Seojangdae.<br><b>Indirizzo per Naver:</b><br><br>수원 서장대 (cerca per nome)"},
  {n:"[19:00] Seojangdae - Comando Ovest", d:"<b>Il punto più alto dell'intera fortezza</b><br>Seojangdae fu costruito tra l'11 agosto e il 29 settembre 1794, nel diciottesimo anno di regno di re Jeongjo, sulla sommità del monte Paldalsan, all'interno delle mura di Hwaseong: è il punto più elevato di tutta la fortezza, scelto proprio per la sua posizione strategica, capace di garantire una visuale a 360 gradi sull'intera area fortificata.<br><br><b>Un'iscrizione scritta di pugno dal re</b><br>Sulla trabeazione del padiglione principale è appesa un'iscrizione con il nome Hwaseongjangdae, scritta personalmente da re Jeongjo. Non a caso, il 12 febbraio 1795, subito dopo essersi recato in visita alla tomba del padre, il principe Sado, re Jeongjo si diresse proprio a Seojangdae, dove rimase fino a tarda notte per assistere e dirigere personalmente le esercitazioni difensive delle truppe Joseon.<br><br><b>Le strutture militari circostanti</b><br>Accanto al comando si trova Seonodae, una piattaforma ottagonale in mattoni pensata per l'utilizzo di balestre multiple. Poco distante si trova anche la grande Campana Hyowon, che i visitatori possono suonare dietro un piccolo contributo.<br><br><b>Un set fotografico e cinematografico</b><br>Il tratto di mura che sale verso Seojangdae, con il suo caratteristico arco, è diventato negli anni una delle location più fotografate della fortezza, complice anche la sua comparsa nel K-drama Twenty-Five Twenty-One.<br><br><b>Cosa troveremo</b><br>Dalla cima si gode di un panorama che spazia sull'intera fortezza e sulla città circostante, particolarmente apprezzato al tramonto e di sera.", img:"Seojangdae.jpg", tip:"Nonostante alcuni cartelli indichino un ingresso a pagamento, l'accesso a questa parte del sito risulta generalmente gratuito. La salita dalla base del monte richiede circa 15 minuti, oppure è possibile raggiungere l'area con il trenino turistico Hwaseong.", move:"Partenza alle 20:30 verso Suwon Chicken Street per cena.<br><b>Indirizzo per Naver:</b><br><br>경기도 수원시 팔달구 정조로800번길 16"},
  {n:"[20:30] Cena: Suwon Chicken Street (통닭거리)", d:"<b>Un vicolo nato negli anni '70</b><br>Suwon Chicken Street si trova in un piccolo vicolo lungo il Gaecheon, il torrente che scorre nei pressi di Namsumun Gate, all'interno dell'area del mercato di Paldalmun. Il negozio più antico della via ha aperto nel 1970, ed è considerato il punto di partenza di una tradizione gastronomica che nel tempo ha attirato altre attività simili, fino a formare oggi una fila di circa 11 ristoranti specializzati nello stesso piatto lungo appena 100-400 metri di strada.<br><br><b>Una tecnica di cottura antica</b><br>Il tratto distintivo del pollo fritto di Suwon, chiamato tongdak, è il metodo di cottura: il pollo intero viene fritto in enormi calderoni di ghisa, i gamasot, un tipo di pentola tradizionale coreana che affonda le proprie origini nel periodo Goryeo, intorno al XIII-XIV secolo.<br><br><b>I nomi storici della via</b><br>Tra i locali più celebri spicca Maehyang Tongdak, gestito ancora oggi dalla stessa signora che iniziò a vendere pollo fritto negli anni '70. Altrettanto rinomati sono Yongseong Tongdak, attivo da oltre 30 anni, e Jinmi Tongdak.<br><br><b>Il boom grazie al cinema</b><br>La fama della via è cresciuta ulteriormente grazie alla commedia coreana Extreme Job (2019), un enorme successo al botteghino: il film ha reso celebre in tutta la Corea la variante wang-galbi tongdak, pollo fritto glassato con una salsa dolce-salata ispirata al bulgogi.<br><br><b>Cosa troveremo</b><br>Il menu nella maggior parte dei locali resta volutamente semplice, diviso tra pollo fritto classico e pollo fritto condito piccante, generalmente accompagnato da maekju (birra) secondo la celebre combinazione chimaek.", img:"Suwon Chicken Street.jpg", tip:"Si trova a pochi minuti da Hwaseong Haenggung Palace ed è anche una delle fermate del trenino turistico della fortezza. Essendo molto frequentata nei weekend, soprattutto in orario di cena, conviene mettere in conto una possibile attesa nei locali più popolari.", move:"Partenza alle 22:00 verso Seoul (circa 40 min)."}
]
