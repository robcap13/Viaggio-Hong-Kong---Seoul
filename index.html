<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hong Kong + Corea — Itinerario di viaggio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,400;1,9..144,500;1,9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12151b;
    --ink-2:#181c24;
    --line-dark:#323a46;
    --paper:#f7f3e8;
    --paper-2:#efe8d4;
    --paper-line:#ddd2b3;
    --text:#211f19;
    --text-soft:#736c58;
    --cream:#f3efe2;
    --text-dim:#9aa3ae;
    --hk:#ff5d73;
    --jeju:#e08e2b;
    --busan:#2f8fd6;
    --gj:#b6903a;
    --seoul:#8a5fc0;
    --info:#59c2a6;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--text);
    font-family:'Space Grotesk',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  .mono{font-family:'JetBrains Mono',monospace;}
  em{font-family:'Fraunces',serif;font-style:italic;}

  /* ---------- layout shell ---------- */
  .shell{display:flex;min-height:100vh;}

  /* ---------- sidebar ---------- */
  .sidebar{
    width:280px;flex-shrink:0;
    background:var(--ink-2);
    border-right:1px solid var(--line-dark);
    padding:24px 0 40px;
    position:sticky;top:0;height:100vh;overflow-y:auto;
  }
  .brand{padding:0 22px 18px;border-bottom:1px solid var(--line-dark);margin-bottom:10px;}
  .brand .stamp{
    display:inline-block;font-family:'JetBrains Mono',monospace;font-size:10.5px;
    letter-spacing:.12em;color:var(--info);border:1px solid var(--info);
    border-radius:20px;padding:3px 9px;text-transform:uppercase;margin-bottom:10px;
  }
  .brand h1{font-size:22px;margin:0 0 4px;line-height:1.12;color:var(--cream);font-weight:600;}
  .brand h1 em{color:var(--info);}
  .brand p{margin:0;font-size:12px;color:var(--text-dim);font-family:'JetBrains Mono',monospace;}

  .navgroup{margin-top:6px;}
  .navgroup-label{
    padding:14px 22px 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text-dim);font-family:'JetBrains Mono',monospace;
  }
  .region-block{margin-bottom:2px;}
  .region-head{
    display:flex;align-items:center;gap:9px;padding:9px 22px;cursor:default;
    font-size:13.5px;color:var(--cream);font-weight:600;font-family:'Fraunces',serif;
  }
  .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
  .daylink{
    display:flex;align-items:baseline;gap:10px;width:100%;text-align:left;
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    padding:7px 22px 7px 39px;font-size:13px;font-family:'Space Grotesk',sans-serif;
    border-left:2px solid transparent;transition:.15s;
  }
  .daylink:hover{color:var(--text);background:rgba(255,255,255,.03);}
  .daylink.active{color:var(--cream);border-left-color:var(--accent,var(--info));background:rgba(255,255,255,.05);font-weight:600;}
  .daylink .num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim);}
  .infolink{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:none;border:none;
    color:var(--text-dim);cursor:pointer;padding:9px 22px;font-size:13px;font-family:'Space Grotesk',sans-serif;
    border-left:2px solid transparent;
  }
  .infolink:hover{color:var(--text);}
  .infolink.active{color:var(--cream);border-left-color:var(--info);background:rgba(255,255,255,.05);font-weight:600;}

  .menu-toggle{display:none;}

  /* ---------- main ---------- */
  main{flex:1;min-width:0;background:var(--paper);color:var(--text);}
  .page{max-width:960px;margin:0 auto;padding:0 0 110px;}

  /* ---------- hero ---------- */
  .hero{
    position:relative;min-height:400px;display:flex;align-items:flex-end;
    background-size:cover;background-position:center;color:#fff;
    padding:40px 44px 34px;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg, rgba(10,12,16,.15) 0%, rgba(10,12,16,.35) 45%, rgba(10,12,16,.92) 100%),
               linear-gradient(90deg, var(--accent) 0%, transparent 55%);
    opacity:.9;
  }
  .hero-inner{position:relative;z-index:1;width:100%;}
  .hero-eyebrow{
    font-family:'JetBrains Mono',monospace;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    opacity:.9;margin-bottom:10px;display:flex;align-items:center;gap:10px;
  }
  .hero-eyebrow .sep{opacity:.5;}
  .hero h2{font-size:44px;line-height:1.03;margin:0 0 10px;font-weight:500;}
  .hero h2 em{font-weight:400;}
  .hero .sub{font-size:15px;opacity:.92;font-family:'JetBrains Mono',monospace;}

  .stats-row{
    display:flex;flex-wrap:wrap;gap:0;
    background:var(--ink);color:var(--cream);position:relative;z-index:1;
  }
  .stat{
    flex:1;min-width:150px;padding:16px 22px;border-right:1px solid rgba(255,255,255,.12);
  }
  .stat:last-child{border-right:none;}
  .stat b{display:block;font-family:'Fraunces',serif;font-size:19px;font-weight:500;margin-bottom:2px;}
  .stat span{font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;}

  .content-pad{padding:0 44px;}

  /* section blocks */
  .block-title{
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--text-soft);
    font-family:'JetBrains Mono',monospace;margin:44px 0 16px;display:flex;align-items:center;gap:10px;
  }
  .block-title::before{content:"§";color:var(--accent);font-family:'Fraunces',serif;font-style:italic;font-size:14px;}
  .block-title::after{content:"";flex:1;height:1px;background:var(--paper-line);}

  .note-box{
    background:var(--paper-2);border:1px dashed var(--paper-line);border-radius:10px;
    padding:16px 18px;font-size:14px;line-height:1.6;color:var(--text-soft);font-style:italic;margin:20px 44px 0;
  }

  /* timeline */
  .timeline{border-left:2px solid var(--paper-line);margin-left:6px;padding-left:22px;}
  .tl-item{position:relative;padding-bottom:14px;display:flex;gap:14px;align-items:flex-start;}
  .tl-item::before{content:"";position:absolute;left:-28px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent);}
  .tl-time{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);font-weight:600;
    flex-shrink:0;width:52px;padding-top:1px;}
  .tl-text{font-size:14.5px;line-height:1.45;padding:7px 12px;border-radius:9px;flex:1;}
  .tl-item.visit .tl-text{background:#fffdf8;border:1px solid var(--paper-line);}
  .tl-item.meal .tl-text{background:#fbeed9;border:1px solid #e9d7ae;}
  .tl-item.meal .tl-text::before{content:"🍜 ";}
  .tl-item.logistics .tl-text{background:transparent;border:1px dashed #c9bd9c;color:var(--text-soft);font-style:italic;font-size:13.3px;}
  .tl-item.transfer{opacity:.92;}
  .tl-item.transfer .tl-text{background:none;border:none;padding:2px 0 2px 2px;color:#6d6656;font-size:13px;
    font-family:'JetBrains Mono',monospace;}
  .tl-item.transfer .tl-text::before{content:"→ ";color:var(--accent);font-weight:700;}
  .tl-item.transfer .tl-time{color:#8a8271;font-weight:500;}
  .tl-item.transfer::before{background:transparent;border:2px solid var(--accent);}

  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-bottom:16px;font-size:12px;color:var(--text-soft);font-family:'JetBrains Mono',monospace;}
  .legend span{display:flex;align-items:center;gap:6px;}
  .legend i{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent);}
  .legend i.meal-i{background:#e0a94a;border-radius:3px;}
  .legend i.transfer-i{background:none;border:2px solid var(--accent);}
  .legend i.logistics-i{background:none;border:1px dashed #8a8271;}

  /* gallery / place cards */
  .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:26px;}
  .g-card{display:flex;flex-direction:column;}
  .g-img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block;background:var(--paper-2);border-radius:2px;}
  .g-img-ph{
    width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;
    font-family:'Fraunces',serif;font-style:italic;font-size:17px;color:#fff;text-align:center;padding:14px;
    background:linear-gradient(135deg,var(--accent),#20242c);border-radius:2px;
  }
  .g-cap{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 4px;gap:10px;}
  .g-cap h4{margin:0;font-size:17px;font-family:'Fraunces',serif;font-weight:600;}
  .g-num{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--accent);flex-shrink:0;}
  .g-card p{margin:0 0 9px;font-size:13.3px;line-height:1.55;color:#4a4638;}
  .tip{
    font-size:12.3px;line-height:1.5;color:var(--text-soft);display:flex;gap:7px;
    border-top:1px solid var(--paper-line);padding-top:8px;font-style:italic;
  }
  .tip b{flex-shrink:0;color:var(--accent);font-style:normal;}

  .foot-nav{display:flex;justify-content:space-between;margin:56px 44px 0;gap:14px;border-top:1px solid var(--paper-line);padding-top:22px;}
  .foot-btn{
    flex:1;background:none;border:none;color:var(--text);padding:0;
    cursor:pointer;text-align:left;font-family:'Space Grotesk',sans-serif;transition:.15s;
  }
  .foot-btn:hover .nm{color:var(--accent);}
  .foot-btn.right{text-align:right;}
  .foot-btn .lbl{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-soft);margin-bottom:6px;}
  .foot-btn .nm{font-size:16px;font-family:'Fraunces',serif;transition:.15s;}
  .foot-btn:disabled{opacity:.3;cursor:default;}

  /* info page */
  .info-hero{
    position:relative;background:linear-gradient(180deg, rgba(10,12,16,.2) 0%, rgba(10,12,16,.94) 100%),
    url('https://commons.wikimedia.org/wiki/Special:FilePath/Seoul%20at%20N%20Seoul%20Tower.jpg?width=1600');
    background-size:cover;background-position:center;
    color:#fff;padding:50px 44px 34px;min-height:320px;display:flex;align-items:flex-end;
  }
  .info-hero-inner{max-width:640px;}
  .info-hero .hero-eyebrow{color:var(--info);}
  .info-hero h2{font-size:38px;margin:0 0 12px;font-family:'Fraunces',serif;font-weight:500;}
  .info-hero p{margin:0;font-size:14.5px;line-height:1.6;opacity:.95;}
  .info-stats{display:flex;flex-wrap:wrap;background:var(--ink);color:var(--cream);}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:32px 44px 0;}
  @media(max-width:720px){.info-grid{grid-template-columns:1fr;}}
  .info-card{background:#fffdf8;border:1px solid var(--paper-line);border-radius:2px;padding:20px 22px;}
  .info-card h3{margin:0 0 12px;font-size:16.5px;font-family:'Fraunces',serif;font-weight:600;display:flex;align-items:center;gap:9px;}
  .info-card ul{margin:0;padding-left:18px;font-size:13.5px;line-height:1.65;color:#3d3a30;}
  .info-card li{margin-bottom:7px;}
  .info-card p{font-size:13.5px;line-height:1.65;color:#3d3a30;margin:0 0 8px;}

  .hidden{display:none !important;}

  /* mobile */
  @media(max-width:900px){
    .sidebar{
      position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:.25s;
      box-shadow:10px 0 30px rgba(0,0,0,.4);width:270px;
    }
    .sidebar.open{transform:translateX(0);}
    .menu-toggle{
      display:flex;align-items:center;gap:8px;position:fixed;top:16px;left:16px;z-index:50;
      background:var(--ink-2);color:var(--cream);border:1px solid var(--line-dark);border-radius:10px;
      padding:10px 14px;font-family:'JetBrains Mono',monospace;font-size:12px;cursor:pointer;
    }
    .hero{padding:80px 22px 26px;min-height:320px;}
    .hero h2{font-size:32px;}
    .content-pad{padding:0 22px;}
    .note-box{margin:20px 22px 0;}
    .info-grid{margin:28px 22px 0;}
    .info-hero{padding:80px 22px 26px;}
    .foot-nav{margin:44px 22px 0;}
    .overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:30;}
    .overlay.show{display:block;}
  }
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle">☰ &nbsp;Itinerario</button>
<div class="overlay" id="overlay"></div>

<div class="shell">
  <nav class="sidebar" id="sidebar">
    <div class="brand">
      <span class="stamp">✈ boarding pass</span>
      <h1>Hong Kong<br>+ <em>Corea del Sud</em></h1>
      <p>15 — 30 agosto 2026 · 16 giorni</p>
    </div>
    <div id="navContent"></div>
  </nav>

  <main>
    <div class="page" id="page"></div>
  </main>
</div>

<script>
/* ============================================================
   DATA
   ============================================================ */
const REGIONS = {
  info:   { label:"Prima di partire", color:"var(--info)" },
  hk:     { label:"Hong Kong",  color:"var(--hk)" },
  jeju:   { label:"Isola di Jeju", color:"var(--jeju)" },
  busan:  { label:"Busan", color:"var(--busan)" },
  gj:     { label:"Gyeongju", color:"var(--gj)" },
  seoul:  { label:"Seoul", color:"var(--seoul)" },
};

const HERO_IMG = {
  hk:    "https://commons.wikimedia.org/wiki/Special:FilePath/Hong%20Kong%20Night%20Skyline.jpg?width=1600",
  jeju:  "https://commons.wikimedia.org/wiki/Special:FilePath/Seongsan%20Ilchulbong%2C%20Jeju%20Island.jpg?width=1600",
  busan: "https://commons.wikimedia.org/wiki/Special:FilePath/Gamcheon%20Cultural%20Village%2C%20Busan.jpg?width=1600",
  gj:    "https://commons.wikimedia.org/wiki/Special:FilePath/Daeungjeon%2C%20Seokgatap%20and%20Dabotap.jpg?width=1600",
  seoul: "https://commons.wikimedia.org/wiki/Special:FilePath/Seoul%20Gyeongbokgung%20palace%20exterior%20view.jpg?width=1600",
};

const DAYS = [
{
  id:1, region:"hk", date:"Sab 15 Agosto", city:"Hong Kong", hotel:"Hotel a Hong Kong (da confermare)",
  flight:"Volo Napoli → Hong Kong (Lufthansa)",
  schedule:[
    {time:"09:30", text:"Arrivo Vittorio", type:"logistics"},
    {time:"10:30", text:"Arrivo Francesco", type:"logistics"},
    {time:"13:30", text:"Arrivo Roberto", type:"logistics"},
    {time:"15:00", text:"Check-in in albergo", type:"logistics"},
    {time:"17:00", text:"Star Ferry", type:"visit"},
    {time:"18:30", text:"Victoria Harbour", type:"visit"},
    {time:"19:30", text:"Cena: Yat Tung Heen - Eaton HK", type:"meal"},
    {time:"21:30", text:"Porto Victoria", type:"visit"},
    {time:"23:00", text:"Mong Kok", type:"visit"}
  ],
  places:[
  {n:"[15:00] Check-in in albergo", d:"Arrivi scaglionati durante la giornata (Vittorio alle 9:30, Francesco alle 10:30, Roberto alle 13:30): chi arriva prima può aspettare gli altri in aeroporto o muoversi in autonomia verso l'hotel. Check-in al B P International verso le 15:00, tempo per sistemarsi prima di uscire per la prima serata.", img:"BP International.jpg", tip:"L'aeroporto di Hong Kong è collegato al centro dall'Airport Express (circa 24 minuti fino a Hong Kong Station) oppure da taxi (30-45 minuti a seconda del traffico e della destinazione)."},

{n:"[17:00] Star Ferry", d:"<b>Un fornaio che inventò un traghetto</b><br>Tutto cominciò nel 1880 con Dorabjee Naorojee Mithaiwala, un immigrato parsi che gestiva un forno e aveva bisogno di trasportare il pane tra Kowloon e Central: acquistò un piccolo battello a vapore, il Morning Star, inizialmente solo per uso personale e dei propri operai. Accortosi che il servizio poteva essere redditizio anche per i passeggeri, fondò nel 1888 la Kowloon Ferry Company, che nel 1898 assunse il nome attuale, Star Ferry Company — il nome deriva dal fatto che ogni imbarcazione della flotta porta la parola Star nel nome (Morning Star, Evening Star, Twinkling Star...), un omaggio alla poesia Crossing the Bar di Alfred Tennyson, che Mithaiwala amava.<br><br><b>Un simbolo che ha attraversato le proteste</b><br>Nel 2006 lo storico molo di Edinburgh Place, con il suo caratteristico orologio, fu demolito per far spazio ai lavori di bonifica di Central: la decisione scatenò forti proteste da parte dei conservazionisti, che vedevano nella demolizione la perdita di un pezzo importante dell'identità cittadina. Ancora prima, nel 1966, un aumento delle tariffe aveva innescato uno sciopero della fame di uno studente proprio al molo di Central, degenerato nei disordini noti come le Star Ferry Riots.<br><br><b>Perché resta un'esperienza da non perdere</b><br>Nonostante oggi esistano la metro e i tunnel stradali sotto il porto, molto più rapidi, la traversata in Star Ferry resta uno dei modi più economici e panoramici per attraversare Victoria Harbour — il National Geographic Traveler l'ha inserita tra i 50 luoghi da vivere almeno una volta. Il tragitto dura circa 10 minuti e collega Tsim Sha Tsui a Central (Pier 7) e Wan Chai.", img:"Star Ferry.jpg", tip:"Costa pochissimo (circa 5-6 HKD a tratta) e si paga con Octopus card o gettone alla biglietteria. Il lato superiore (\"upper deck\") offre la vista migliore; se possibile, sedetevi dal lato rivolto verso lo skyline invece che verso il mare aperto.", move:"Partenza verso Victoria Harbour (stesso molo/promenade)."},

{n:"[18:30] Victoria Harbour", d:"Il porto naturale attorno a cui è cresciuta tutta Hong Kong, e ancora oggi il suo cuore visivo: da un lato lo skyline di Hong Kong Island con l'IFC e il Bank of China Tower, dall'altro la promenade di Tsim Sha Tsui, con l'Avenue of Stars dedicata al cinema di Hong Kong (incluse le impronte di Bruce Lee). Il nome deriva dalla regina Vittoria, e il porto è stato per oltre un secolo e mezzo il motivo stesso dell'esistenza della colonia britannica, scelta proprio per le sue acque profonde e riparate, ideali per l'attracco delle navi.", img:"Victoria Harbour.jpg", tip:"Se possibile, organizzatevi per essere sulla promenade di Tsim Sha Tsui verso le 20:00: ogni sera va in scena il Symphony of Lights, lo spettacolo di luci sincronizzate sui grattacieli del lato di Hong Kong Island.", move:"Partenza verso Yat Tung Heen per cena."},

{n:"[19:30] Cena: Yat Tung Heen - Eaton HK", d:"Ristorante cantonese all'interno dell'Eaton HK Hotel, specializzato in dim sum e piatti cantonesi raffinati, con diverse stelle Michelin ottenute nel corso degli anni. Un buon modo per iniziare il viaggio con un pasto curato prima di lanciarsi nell'esplorazione più informale dei giorni successivi.", img:"Yat Tung Heen.jpg", tip:"Essendo un ristorante più formale rispetto alla media dei locali che troverete nei prossimi giorni, conviene prenotare in anticipo, specialmente se siete in un gruppo numeroso.", move:"Partenza verso il porto (zona Victoria/Wan Chai)."},

{n:"[21:30] Porto Victoria", d:"Una passeggiata serale lungo il porto, con lo skyline illuminato di entrambe le sponde — un buon modo per digerire la cena e ambientarsi nell'atmosfera della città prima di spostarsi verso Mong Kok.", img:"Victoria Harbour notte.jpg", tip:""},

{n:"[23:00] Mong Kok", d:"Uno dei quartieri più densamente popolati al mondo, nel cuore di Kowloon: insegne al neon, mercati notturni (incluso il celebre Ladies' Market), negozi di elettronica e street food a ogni angolo. È il posto giusto per un primo assaggio del lato più caotico e verticale di Hong Kong, aperto fino a tardi.", img:"Mong Kok.jpg", tip:"La stazione MTR di Mong Kok (linee Tsuen Wan e Kwun Tong) è il punto di riferimento più comodo per orientarsi nella zona."}
]
},
{
  id:2, region:"hk", date:"Dom 16 Agosto", city:"Hong Kong", hotel:"Hotel a Hong Kong (da confermare)",
  schedule:[
    {time:"04:00", text:"Sveglia", type:"logistics"},
    {time:"05:00", text:"Victoria Peak", type:"visit"},
    {time:"07:30", text:"Sai Wan Swimming Shed", type:"visit"},
    {time:"08:00", text:"Little Cove Espresso", type:"meal"},
    {time:"09:00", text:"Kennedy Town Playground (basketball courts)", type:"visit"},
    {time:"10:00", text:"Hill Road", type:"visit"},
    {time:"11:00", text:"Sai Ying Pun", type:"visit"},
    {time:"11:30", text:"Man Mo Temple", type:"visit"},
    {time:"13:00", text:"Mid-Levels Escalator / SoHo", type:"visit"},
    {time:"14:00", text:"Lok Ku Road e 11 Aberdeen St", type:"visit"},
    {time:"15:00", text:"Ice House St - fermata bus", type:"transfer"},
    {time:"15:30", text:"Pranzo: Sun Hing Restaurant", type:"meal"},
    {time:"16:30", text:"Yick Cheong Building (Monster Building)", type:"visit"},
    {time:"18:00", text:"Pak Fuk Rd", type:"visit"},
    {time:"19:00", text:"Braemar Hill", type:"visit"},
    {time:"20:30", text:"Red Incense Burner Summit (tramonto)", type:"visit"},
    {time:"21:00", text:"Cena", type:"meal"},

places:[{n:"[5:00] Victoria Peak", d:"<b>Dalla sedia a portantina alla prima funicolare d'Asia</b><br>A metà Ottocento i coloni britannici scelsero la cima del Peak (allora Chek Lap Kok, ribattezzato in onore della regina Vittoria) come residenza estiva per sfuggire al caldo umido della città bassa. Fino al 1888 l'unico modo per arrivarci era la sedia a portantina; quell'anno aprì il Peak Tram, la prima funicolare di tutta l'Asia, che in pochi minuti collega Garden Road (Central) alla vetta con una pendenza che arriva quasi al 50%, tanto da far sembrare inclinati gli edifici che si vedono dai finestrini durante la salita.<br><br><b>Un simbolo di segregazione coloniale</b><br>Per decenni l'accesso residenziale al Peak fu regolato dal Peak District Reservation Ordinance, che di fatto escludeva i residenti non europei dall'area, rendendo la collina un simbolo fisico del privilegio coloniale — una condizione che durò fino a metà Novecento.<br><br><b>Cosa vedremo</b><br>Dal Peak Tower e dal vicino Sky Terrace 428 si gode di una delle viste più celebri al mondo su Victoria Harbour e sullo skyline di Hong Kong Island, particolarmente spettacolare all'alba, quando la foschia mattutina si dirada sopra i grattacieli.", img:"Victoria Peak.jpg", tip:"Salendo così presto probabilmente il Peak Tram non è ancora in servizio (apre generalmente alle 7:00): valutate un taxi o, se in forma, una delle strade panoramiche pedonali che salgono dal centro. L'alba a quest'altitudine può essere piuttosto ventosa: portate una giacca leggera anche in piena estate.", move:"Partenza verso Sai Wan Swimming Shed."},

{n:"[7:30] Sai Wan Swimming Shed", d:"Una piattaforma di legno storica sul mare, usata dagli abitanti del quartiere per fare il bagno fin dai primi del Novecento, oggi diventata uno dei punti fotografici più amati di Hong Kong Island per l'atmosfera vintage e la vista aperta sul porto verso ovest, spesso definita uno scorcio quasi rurale nel cuore della città.", img:"Sai Wan Swimming Shed.jpg", tip:"È un impianto storico, non un'attrazione turistica organizzata: comportatevi con rispetto verso chi lo usa ancora per nuotare davvero."},

{n:"[8:00] Colazione: Little Cove Espresso", d:"Un caffè in stile australiano molto amato dagli espatriati e dai locali della zona di Kennedy Town/Sai Wan, noto per la qualità del caffè e per una colazione più occidentale rispetto alla media dei locali di quartiere — un buon momento di pausa dopo la levataccia per l'alba al Peak.", img:"Little Cove Espresso.jpg", tip:""},

{n:"[9:00] Kennedy Town Playground", d:"Un campo da basket colorato affacciato sul mare, uno dei tanti sparsi per Hong Kong diventati soggetti fotografici molto ricercati per il contrasto tra i colori vivaci del campo, i palazzi residenziali sullo sfondo e il porto aperto. Kennedy Town, all'estremità occidentale della linea MTR dell'isola, è un quartiere in piena trasformazione, tra vecchi magazzini e nuovi locali.", img:"Kennedy Town Playground.jpg", tip:"La luce del mattino presto, con il sole ancora basso, è la migliore per fotografare questi campi da basket colorati."},

{n:"[10:00] Hill Road", d:"Una passeggiata tra le stradine residenziali di Sai Wan, tra edifici più vecchi e la vita di quartiere quotidiana, lontano dalle zone più turistiche dell'isola.", img:"Hill Road.jpg", tip:""},

{n:"[11:00] Sai Ying Pun", d:"Un quartiere storico dell'ovest di Hong Kong Island, un tempo zona di magazzini e negozi di erboristeria e prodotti secchi (pesce essiccato, abalone, pinne di squalo, ancora oggi visibili lungo Des Voeux Road West), oggi anche animato da nuovi caffè e ristoranti ricavati negli edifici più antichi. Il mercato mattutino del quartiere resta un buon modo per vedere la Hong Kong più quotidiana.", img:"Sai Ying Pun.jpg", tip:"", move:"Partenza verso Man Mo Temple (circa 10-15 min a piedi lungo Hollywood Road)."},

{n:"[11:30] Man Mo Temple", d:"<b>Un tempio dedicato a due divinità</b><br>Costruito tra il 1847 e il 1862 da facoltosi mercanti cinesi, è il più antico e importante tempio taoista di Hong Kong Island. Il nome deriva dalle due divinità a cui è dedicato: Man Cheong, dio della letteratura, e Mo Tai, dio della guerra — entrambi venerati tradizionalmente dagli studenti in cerca di successo negli esami imperiali. Il complesso comprende in realtà tre edifici distinti: il tempio vero e proprio, Lit Shing Kung (dedicato a tutte le divinità celesti) e Kung Sor, che serviva come luogo di incontro e mediazione per la comunità cinese del quartiere.<br><br><b>Un centro comunitario, non solo religioso</b><br>Prima che Hong Kong avesse un sistema amministrativo cinese strutturato, Kung Sor funzionava come una sorta di municipio informale, dove i residenti cinesi discutevano e risolvevano le proprie dispute. Dal 1908 il tempio è affidato in gestione al Tung Wah Hospital, la più grande organizzazione benefica di Hong Kong.<br><br><b>Cosa troveremo</b><br>L'atmosfera è resa unica dalle enormi spirali di incenso appese al soffitto, che bruciano per settimane intere, avvolgendo l'interno in una luce fioca e un profumo intenso. È un edificio di Grado 1 e Monumento Dichiarato, con splendide decorazioni in ceramica, intagli in granito e legno.", img:"Man Mo Temple.jpg", tip:"Ingresso gratuito, aperto indicativamente dalle 8:00 alle 18:00. Essendo un luogo di culto attivo, evitate il flash e mantenete un tono di voce basso.", move:"Partenza verso Mid-Levels Escalator / SoHo."},

{n:"[13:00] Mid-Levels Escalator / SoHo", d:"La scala mobile coperta più lunga del mondo (circa 800 metri, 20 tratti distinti), costruita nel 1993 per collegare i quartieri residenziali dei Mid-Levels con Central, risparmiando ai residenti una salita altrimenti molto ripida. Attraversa diversi quartieri, incluso SoHo (il nome gioca su South of Hollywood Road, oltre che sul più celebre quartiere londinese), oggi pieno di ristoranti, bar e gallerie d'arte ricavati in vecchi edifici.", img:"Mid-Levels Escalator.jpg", tip:"La scala scende verso il basso al mattino (per chi va al lavoro in centro) e sale verso l'alto dalle 10:00 in poi: verificate la direzione prima di salire, così da non dovervi fare tutta la salita a piedi per errore.", move:"Partenza verso Lok Ku Road."},

{n:"[14:00] Lok Ku Road e 11 Aberdeen St", d:"Lok Ku Road è famosa soprattutto per Cat Street (Upper Lascar Row), un mercatino di oggetti vintage, antiquariato e curiosità di ogni genere, proprio accanto a Hollywood Road, la via degli antiquari di Hong Kong. 11 Aberdeen Street è un edificio storico riconvertito in spazio creativo e gallerie, esempio del recupero architettonico che sta interessando molte vecchie strutture di questa zona di Central/Sheung Wan.", img:"Lok Ku Road.jpg", tip:"", move:"Partenza verso la fermata bus di Ice House Street."},

{n:"[15:00] Ice House St - fermata bus", d:"Il nome della strada (letteralmente via della ghiacciaia) deriva da un vecchio deposito di ghiaccio costruito nell'Ottocento per conservare il ghiaccio importato dagli Stati Uniti, prima dell'avvento della refrigerazione moderna — un piccolo dettaglio di storia urbana nel cuore di Central.", img:"Ice House St.jpg", tip:"", move:"Partenza verso Sun Hing Restaurant per pranzo."},

{n:"[15:30] Pranzo: Sun Hing Restaurant", d:"Un tradizionale ristorante di dim sum a Sai Ying Pun, storicamente aperto già dalle prime ore del mattino per servire i lavoratori del vicino mercato del pesce — un'istituzione locale più che un ristorante turistico.", img:"Sun Hing Restaurant.jpg", tip:"Essendo un locale molto informale, non aspettatevi un servizio raffinato: fa parte del fascino dell'esperienza."},

{n:"[16:30] Yick Cheong Building (Monster Building)", d:"<b>Cinque edifici, un solo soprannome</b><br>Il cosiddetto Monster Building non è in realtà un singolo edificio, ma un complesso a forma di E composto da cinque palazzi distinti — Fook Cheong Building, Yick Cheong Building, Yick Fat Building, Montane Mansion e Oceanic Mansion — costruiti negli anni '60-'70 a Quarry Bay come edilizia popolare sovvenzionata dal governo, per rispondere al boom demografico del dopoguerra. Ospitano ancora oggi circa 2.200 unità abitative per circa 10.000 residenti.<br><br><b>Da edilizia popolare a fenomeno cinematografico</b><br>Il complesso è rimasto per decenni un semplice quartiere residenziale, fino a diventare celebre a livello internazionale dopo essere apparso come location in Transformers: Age of Extinction (2014) e nel remake live-action di Ghost in the Shell (2017): la fitta disposizione dei palazzi, che crea un effetto tunnel guardando verso l'alto dal cortile centrale, si è rivelata perfetta per un'estetica da metropoli futuristica.<br><br><b>Un luogo ancora abitato</b><br>Dal 2018 alcuni residenti hanno affisso cartelli che chiedono ai visitatori di chiedere permesso prima di fotografare, per la crescente affluenza di turisti e influencer — un problema di privacy simile a quello già visto in altri quartieri fotogenici di questo viaggio.", img:"Yick Cheong Building.jpg", tip:"Indirizzo: 1010-1040 King's Road, Quarry Bay. Stazione MTR Quarry Bay o Tai Koo, poi pochi minuti a piedi. Il cortile orientale, meno noto, è spesso meno affollato di quello occidentale (il più fotografato). Mantenete rispetto per i residenti: non entrate negli appartamenti né disturbate chi gioca a basket nei campi dell'estate.", move:"Partenza verso Pak Fuk Rd."},

{n:"[18:00] Pak Fuk Rd", d:"Una strada panoramica sul versante nord-est di Hong Kong Island, punto di passaggio verso Braemar Hill, con scorci già suggestivi sul porto e sulle isole al largo.", img:"Pak Fuk Rd.jpg", tip:"", move:"Partenza verso Braemar Hill."},

{n:"[19:00] Braemar Hill", d:"Una zona residenziale collinare con diversi punti panoramici affacciati su Victoria Harbour e sull'area di North Point, meno battuta dai turisti rispetto al Peak ma altrettanto suggestiva, soprattutto quando le luci della città iniziano ad accendersi.", img:"Braemar Hill.jpg", tip:"", move:"Partenza verso Red Incense Burner Summit per il tramonto."},

{n:"[20:30] Red Incense Burner Summit", d:"Uno dei punti panoramici più amati dai fotografi di Hong Kong per il tramonto e le luci notturne, con vista aperta su tutta Victoria Harbour e sullo skyline di entrambe le sponde. Il nome (letteralmente vetta del bruciatore d'incenso rosso) deriva dalla forma rocciosa della collina stessa.", img:"Red Incense Burner Summit.jpg", tip:"Arrivate con un certo anticipo rispetto al tramonto vero e proprio per assicurarvi un buon punto di osservazione, dato che è una meta molto ambita dai fotografi locali.", move:"Partenza verso il ristorante per cena."},

{n:"[21:00] Cena", d:"Cena libera, da scegliere in base alla zona in cui ci si trova dopo il tramonto — nessun locale specifico ancora individuato per questa tappa.", img:"", tip:""},

{n:"[22:00] Temple Street Night Market", d:"<b>Il nome viene dal tempio, non il contrario</b><br>Il mercato prende il nome dal Tin Hau Temple di Yau Ma Tei, costruito nella seconda metà dell'Ottocento (le fonti divergono tra il 1864 e il 1865) e dedicato a Tin Hau, dea protettrice dei marinai e dei pescatori — un omaggio al passato di Hong Kong come villaggio di pescatori. Le prime mappe della zona, risalenti al 1887, dividevano già la strada in due tratti rispetto al tempio.<br><br><b>Da quartiere residenziale a Men's Street</b><br>Negli anni '20 iniziò a formarsi una piazza informale di venditori ambulanti proprio davanti al tempio; nel tempo la via si specializzò in articoli tipicamente maschili (da cui il soprannome Men's Street), anche se oggi si trova praticamente di tutto. Il mercato è diventato celebre a livello internazionale a partire dalla seconda metà del Novecento, complice anche numerosi film hongkonghesi ambientati proprio qui.<br><br><b>Cosa troveremo</b><br>Bancarelle di abbigliamento, elettronica, gadget e souvenir, ma soprattutto un'atmosfera unica fatta di indovini che leggono la mano o il volto (kau cim), cantanti di opera cantonese improvvisati, giocatori di scacchi accovacciati sotto le luci al neon, e un'infinità di bancarelle di street food (claypot rice, spiedini, frutti di mare).", img:"Temple Street Night Market.jpg", tip:"Il mercato si anima davvero dopo le 19:00 e resta vivo fino a mezzanotte. Contrattare sul prezzo è normale e quasi ci si aspetta che lo facciate. Le sedute di indovini partono da circa 100 HKD per 15 minuti — un'esperienza curiosa anche solo per vedere come funziona, pur senza crederci davvero."}
]
},

places:[{n:"[7:30] Colazione: Australia Dairy Company", d:"<b>Non è australiano, nonostante il nome</b><br>Nonostante il nome faccia pensare a specialità importate, il locale nasce nel 1970 grazie a un marinaio hongkonghese che, dopo aver trascorso alcuni mesi in Australia, tornò in città talmente ispirato dai latticini che vi aveva assaggiato da aprire un cha chaan teng in loro omaggio. In realtà nel menu non c'è nulla di davvero australiano: per il latte si usa quello locale Kowloon Dairy, mentre per le zuppe di noodle viene impiegato brodo di pollo Campbell's.<br><br><b>Un'istituzione del cha chaan teng</b><br>È oggi uno dei cha chaan teng (locali ibridi cantonesi-occidentali, tipici di Hong Kong) più celebri della città, noto soprattutto per il budino di latte al vapore (steamed milk pudding), le uova strapazzate su toast burroso e lo yuan yang, la miscela di tè al latte e caffè tipica hongkonghese.<br><br><b>Cosa troveremo</b><br>Il locale propone tre fasce di menu durante la giornata (colazione, tè pomeridiano, pasto veloce), in un ambiente spartano con tavoli condivisi, tipico di questi locali storici.", img:"Australia Dairy Company.jpg", tip:"Aspettatevi codice di comportamento un po' brusco e servizio velocissimo, tipico di questi locali storici: fa parte del fascino. Indirizzo: 47-49 Parkes Street, Jordan.", move:"Partenza alle 08:30 verso Lantau Island (circa 30 min fino a Tung Chung, poi su verso Ngong Ping)."},

{n:"[9:30] Lantau Island, Big Buddha e Po Lin Monastery", d:"<b>Un monastero nato come capanna</b><br>Po Lin Monastery fu fondato nel 1906 da tre monaci in visita dalla provincia dello Jiangsu, con il nome iniziale di Tai Mao Pung, letteralmente la grande capanna di paglia. Solo nel 1924 il monastero ricevette il nome attuale, Po Lin, che significa loto prezioso. Per decenni restò un ritiro remoto tra le montagne di Lantau, praticamente sconosciuto ai turisti.<br><br><b>La svolta: il Grande Buddha</b><br>Tutto cambiò con la costruzione della statua del Tian Tan Buddha, comunemente chiamata Big Buddha: pianificata già dal 1973, la costruzione vera e propria iniziò nel 1981 e si concluse nel 1993, dopo aver fuso 202 lastre di bronzo nella città di Nanchino, in Cina. Alta 34 metri (26,4 metri solo la statua, senza contare base e loto), è tuttora una delle statue di Buddha seduto in bronzo più alte al mondo.<br><br><b>Il significato del nome e dei simboli</b><br>Il nome Tian Tan deriva dalla base della statua, modellata su quella del Tempio del Cielo di Pechino. Rivolta verso nord, in direzione della Cina continentale, il Buddha ha la mano destra alzata in un gesto di benedizione, mentre la sinistra poggiata sul ginocchio simboleggia la felicità. Alla base si trovano 268 gradini, e all'interno del piedistallo un piccolo museo su tre piani custodisce reliquie buddiste.<br><br><b>Ngong Ping Village e la cabinovia</b><br>Il villaggio ai piedi del Buddha, Ngong Ping Village, è un'aggiunta relativamente recente, sviluppata insieme alla cabinovia Ngong Ping 360 (aperta nel 2006), che collega la stazione di Tung Chung al plateau in circa 25 minuti, offrendo viste sull'aeroporto di Hong Kong e sul mare.", img:"Big Buddha Po Lin Monastery.jpg", tip:"La cabinovia apre alle 10:00 e le code, specialmente nei weekend, possono superare l'ora: se salite in taxi/bus (come previsto oggi) evitate il problema, e potete comunque prenderla al ritorno quando le code si riducono nel primo pomeriggio. Il monastero ha anche un ristorante vegetariano molto apprezzato, se volete pranzare direttamente lassù invece che a Jordan più tardi.", move:"Partenza alle 13:00 con la cabinovia in discesa, poi verso Choi Hung (circa 1h totale)."},

{n:"[14:30] Choi Hung Estate Rooftop Basketball Court", d:"<b>Il primo grande quartiere popolare arcobaleno</b><br>Choi Hung significa letteralmente arcobaleno, ed è uno dei primi grandi complessi di edilizia popolare di Hong Kong, costruito tra il 1962 e il 1964 dalla allora Hong Kong Housing Authority per rispondere al boom demografico del dopoguerra. Gli 11 blocchi, alti fino a 20 piani, sostituirono un'area precedentemente rurale, offrendo case sicure e moderne a migliaia di famiglie che prima vivevano in baraccopoli o alloggi di fortuna.<br><br><b>Da edilizia popolare a icona fotografica</b><br>Per decenni il complesso è stato semplicemente un quartiere residenziale come tanti altri. Negli ultimi anni, però, il campo da basket sul tetto del parcheggio, circondato dai palazzi dalle facciate dipinte nei colori dell'arcobaleno, è diventato uno dei soggetti fotografici più iconici e condivisi di tutta Hong Kong, complice l'estetica quasi grafica del contrasto tra i colori pastello e lo skyline sullo sfondo.<br><br><b>Una corsa contro il tempo</b><br>Il complesso è stato ufficialmente destinato alla demolizione, con lo sfollamento dei residenti previsto a partire dal 2028: questo lo rende oggi una delle mete fotografiche più urgenti di Hong Kong, dato che tra pochi anni non esisterà più nella sua forma attuale.", img:"Choi Hung Estate.jpg", tip:"Uscita C della stazione MTR di Choi Hung. Comportatevi con rispetto: è un quartiere ancora abitato, non fotografate dentro le abitazioni private, ed evitate di disturbare chi sta effettivamente giocando a basket sul campo mentre fate foto.", move:"Partenza verso Mak Man Kee Noodle Shop per pranzo."},

{n:"[15:30] Pranzo: Mak Man Kee Noodle Shop (Jordan)", d:"<b>Da dai pai dong a stella Michelin</b><br>Il locale nasce nel 1957 come dai pai dong, le tradizionali bancarelle di street food a cielo aperto tipiche della Hong Kong del dopoguerra, prima di trasferirsi nell'attuale sede fissa su Parkes Street. Nel 2017 ha ottenuto una stella nella Guida Michelin di Hong Kong, un riconoscimento raro per un locale così piccolo e informale — praticamente un buco nel muro, per usare l'espressione con cui viene spesso descritto.<br><br><b>Cosa lo rende speciale</b><br>La specialità sono i wonton di gambero, considerati tra i migliori di tutta la città: pasta sottilissima che avvolge gamberi interi e succosi, serviti sia in brodo sia asciutti (la versione secca, con la pasta condita e i wonton a parte, è quella più consigliata dai conoscitori).", img:"Mak Man Kee Noodle Shop.jpg", tip:"Indirizzo: 51 Parkes Street, Yau Ma Tei/Jordan. Aperto tutti i giorni da mezzogiorno fino a mezzanotte e mezza. Essendo pochissimi tavoli, mettete in conto una possibile attesa nelle ore di punta.", move:"Partenza verso Yau Ma Tei Tin Hau Temple (pochi minuti a piedi)."},

{n:"[16:30] Yau Ma Tei Tin Hau Temple", d:"Il tempio che dà il nome a Temple Street, che visiteremo tra qualche giorno la sera. Costruito nell'Ottocento (le fonti oscillano tra il 1864 e il 1865) e dedicato a Tin Hau, la dea protettrice dei marinai e dei pescatori, riflette le origini di Yau Ma Tei come villaggio costiero prima dell'urbanizzazione di Kowloon. Oltre a Tin Hau, al suo interno si venera anche Pak Tai, divinità del nord, e i fedeli vi si recano per pregare per la sicurezza, la salute e la buona sorte.", img:"Yau Ma Tei Tin Hau Temple.jpg", tip:"È un buon momento per vederlo con calma, prima che la zona si animi la sera con Temple Street: l'atmosfera diurna è molto più raccolta.", move:"Partenza verso Goldfish Market."},

{n:"[18:00] Goldfish Market", d:"<b>Un mercato nato all'alba</b><br>Le origini del mercato risalgono agli anni '50-'60, quando allevatori di pesci ornamentali provenienti dai New Territories vendevano la propria merce in un mercato all'ingrosso mattutino su Boundary Street, vicino all'attuale Mong Kok Stadium, operando dalle 4 del mattino fino all'alba, con il pesce trasportato in treno e venduto da secchi e scatole per strada. Con la ricostruzione della stazione ferroviaria tra fine anni '60 e primi anni '70, i venditori si spostarono gradualmente su Tung Choi Street, dove si trovano ancora oggi.<br><br><b>Perché proprio i pesci rossi</b><br>La popolarità dei pesci ornamentali a Hong Kong è legata alle credenze del feng shui: il pesce rosso è considerato un simbolo di prosperità e fortuna, e in cinese il suono della parola pesce (yu) richiama quello di abbondanza — non a caso, tenere un acquario in casa o in negozio è ancora oggi una pratica diffusissima.<br><br><b>Cosa troveremo</b><br>Un tratto di circa 300 metri di Tung Choi Street, tra Mong Kok Road e Nullah Road, con decine di negozi che espongono pesci in sacchetti di plastica appesi, oltre a tartarughe, rettili e altri animali da compagnia. È inoltre comparso come location nel celebre film Chungking Express di Wong Kar-wai.", img:"Goldfish Market.jpg", tip:"Evitate il flash quando fotografate, per non spaventare i pesci. Il tratto meridionale della stessa via ospita il Ladies' Market, se volete proseguire lo shopping.", move:"Partenza verso Peony House West Block."},

{n:"[19:00] Peony House West Block", d:"Un complesso residenziale di edilizia popolare a Tai Kok Tsui, risalente alla fine degli anni '50, con una struttura e un cortile interno dal fascino simile (anche se meno noto) a quello del Monster Building di Quarry Bay visto ieri — un altro scorcio dell'architettura residenziale di metà Novecento di Hong Kong, lontano dai circuiti più turistici.", img:"Peony House West Block.jpg", tip:"Essendo un edificio residenziale ancora abitato e non un'attrazione organizzata, muovetevi con discrezione e rispetto verso i residenti.", move:"Partenza verso Hung Hom Kwun Yum Temple."},

{n:"[19:30] Hung Hom Kwun Yum Temple", d:"Un tempio dedicato a Kwun Yum (Guanyin), la bodhisattva della compassione, una delle divinità più venerate in tutta l'Asia orientale. Nel quartiere di Hung Hom, sulla sponda di Kowloon, è meta soprattutto durante il Kwun Yum Treasury Opening Festival, quando secondo la tradizione la dea apre il proprio tesoro e presta fortuna ai fedeli per l'anno a venire.", img:"Hung Hom Kwun Yum Temple.jpg", tip:"", move:"Partenza verso la promenade di Tsim Sha Tsui per il Symphony of Lights delle 20:00."},

{n:"[20:00] Symphony of Lights", d:"Ogni sera alle 20:00, oltre 40 grattacieli sulle due sponde di Victoria Harbour si illuminano in uno spettacolo sincronizzato di luci, laser e musica, guardando dalla promenade di Tsim Sha Tsui verso lo skyline di Hong Kong Island. Nato nel 2004 e da allora un appuntamento fisso, il Guinness dei Primati lo ha riconosciuto come il più grande spettacolo di luci ed effetti sonori permanente al mondo.", img:"Symphony of Lights.jpg", tip:"Il punto migliore per assistervi è la Avenue of Stars, lungo la promenade di Tsim Sha Tsui: arrivate con qualche minuto di anticipo per trovare un buon posto in prima fila sul lungomare. Lo show dura circa 13-14 minuti."}
]
},

  places:[
    {n:"[6:30] Aeroporto Jeju", d:"Alle 6:30 atterreremo a Jeju.", img:"jeju Car rent.png", tip:"Superati i controlli si consiglia di prendersi un attimo di tempo per organizzare uno zaino per la giornata, con l'occorrente per il mare non dimenticare quindi: un costume, un telo mare, le infradito, la protezione solare e un cambio per il resto delle attività della giornata"},
    {n:"[7:30] Ritiro auto", d:"Alle 7:30 è previsto il ritiro auto. Lo spostamento verso la tappa successiva durerà circa 1h", img:"gim-11.webp", tip:"La prenotazione dell'auto è a nome di Francesco ed è stata fatta su Trip.com", move:"Partenza alle 08:00 verso Gimnyeong Beach (circa 1h).<br><b>Indirizzo per Naver:</b><br><br>제주특별자치도 제주시 구좌읍 해맞이해안로 7-6"},
    {n:"[9:00] Gimnyeong Beach", d:"Spiaggia dalle acque turchesi e poco profonde sulla costa nord-est di Jeju, meno affollata delle spiagge del sud. Qui passeremo qualche ora sulla spiaggia per riposarci", img:"gim-11.webp", tip:"Si consiglia di provare a recuperare qualche ora di sonno persa per il viaggio notturno.", move:"Ory Fishmarket è nello stesso villaggio di Gimnyeong, a pochi minuti di auto.<br><b>Indirizzo per Naver:</b><br><br>제주특별자치도 제주시 구좌읍 김녕로21길 21"},
    {n:"[13:00] Pranzo: Ory Fishmarket", d:"Per il pranzo il locale individuato è Ory Fishmarket. Le specialità sono 제주딱새우회 (Jeju ttak-saeu hoe) – gamberi mantide crudi (una specialità locale di Jeju), ma si consiglia anche il sashimi", img:"Ory Fishmarket.jpg", tip:"<b>Piatti principali (in alto):</b><br><b>돔베사시미 (Dombe Sashimi)</b> – Sashimi misto servito su un tagliere di legno.<br><b>제주딱새우회 (Jeju ttak-saeu hoe)</b> – Gamberi mantide crudi<br><br><b>Riga centrale:</b><br><b>숯불 뿔소라구이</b> – Lumache di mare (turbo/conch) grigliate alla brace<br><b>쨍소라회</b> – Lumache di mare crude<br><b>돌문어</b> – Polpo di roccia (crudo/bollito)<br><br><b>Riga in basso:</b><br><b>숯불 가마살구이</b> – Guancia/pancia di pesce grigliata alla brace<br><b>숯불 고등어구이</b> – Sgombro grigliato alla brace<br><b>딱새우라면</b> – Ramen con gamberi mantide<br><br><b>In basso a destra (contorni/extra)</b>", move:"Partenza alle 14:30 verso Manjanggul Lava Tube (circa 5 min).<br><b>Indirizzo per Naver:</b><br><br>제주특별자치도 제주시 구좌읍 만장굴길 182"},
    {n:"[15:00] Manjanggul Lava Tube", d:"Uno dei tubi di lava più lunghi al mondo (quasi 7 km, un tratto di 1 km visitabile), formatosi da eruzioni vulcaniche migliaia di anni fa. Patrimonio UNESCO.<br><br><b>Come si è formato:</b> Manjanggul si è formato tra circa 100.000 e 300.000 anni fa, durante un'intensa attività vulcanica sull'isola di Jeju. Quando la lava fluiva verso il mare, la superficie esterna del flusso si raffreddava e induriva a contatto con l'aria, mentre la lava ancora fusa continuava a scorrere sotto quella crosta solidificata. Quando l'eruzione è terminata e la lava residua è defluita via, è rimasto un enorme tunnel vuoto: è esattamente questo il meccanismo con cui si formano tutti i \"lava tube\" nel mondo.<br><br><b>Dimensioni e primati:</b> È lungo quasi 9 km, il che lo rende uno dei tubi di lava più lunghi al mondo e il secondo più lungo di Jeju. Solo una sezione di circa 1 km (a partire dal secondo dei tre ingressi) è aperta al pubblico — il resto è chiuso per motivi di conservazione. Al suo interno si trova la colonna di lava più alta conosciuta al mondo, alta circa 7,6 metri: si è formata quando la lava che gocciolava dal soffitto si è incontrata e saldata con quella che risaliva dal pavimento.<br><br><b>Perché è importante:</b> Fa parte del sistema di tubi di lava di Geomunoreum, ed è entrato a far parte del Patrimonio Mondiale UNESCO nel 2007 sotto la voce \"Jeju Volcanic Island and Lava Tubes\". Ciò che lo rende scientificamente prezioso è lo stato di conservazione eccezionale: mentre molti tubi di lava nel mondo sono collassati o danneggiati, Manjanggul è rimasto quasi intatto, offrendo ai geologi un vero e proprio laboratorio a cielo aperto per studiare i processi vulcanici.<br><br><b>Cosa vedremo camminando:</b> All'interno troveremo un paesaggio molto diverso dalle grotte calcaree \"classiche\" (niente formazioni bianche e gocciolanti): qui le pareti sono di roccia vulcanica scura, e potremo osservare stalattiti e stalagmiti di lava, colonne laviche, \"flowstone\" (superfici modellate dallo scorrimento), \"lava rafts\" (blocchi di crosta solidificata trascinati dalla corrente) e ripiani laviche lungo le pareti — tutte tracce fisiche del momento esatto in cui la lava si è fermata.<br><br><b>Un dettaglio curioso:</b> Jeju nel suo complesso è un vulcano a scudo ormai inattivo, sulla cui superficie si contano circa 120 grandi tubi di lava e 360 piccoli coni vulcanici (chiamati \"oreum\") sparsi per l'isola — Manjanggul è solo il più celebre di questa rete sotterranea.", img:"Manjanggul Lava Tube.jpg", tip:"Dentro fa fresco tutto l'anno (circa 11-21°C): portate una giacca leggera.", move:"Partenza alle 16:00 verso Snoopy Garden (circa 30 min).<br><b>Indirizzo per Naver:</b><br><br>제주특별자치도 제주시 구좌읍 금백조로 930"},
    {n:"[16:30] Snoopy Garden", d:"<b>Cos'è e quando è nato</b><br>Snoopy Garden ha aperto al pubblico il 17 luglio 2020 a Songdang-ri, nel comune di Gujwa-eup, ed è stato il primo giardino tematico dedicato ai Peanuts in Corea. Copre circa 20.000 metri quadrati e comprende cinque padiglioni espositivi al chiuso e undici aree tematiche all'aperto, ognuna ispirata a una scena o a un elemento riconoscibile della striscia a fumetti.<br><br><b>Le origini del fumetto</b><br>Peanuts è la striscia a fumetti creata dal disegnatore americano Charles M. Schulz, debuttata nel 1950 e diventata nel tempo una delle proprietà culturali più riconosciute al mondo, con protagonisti come Snoopy, Charlie Brown, Lucy, Woodstock e Schroeder. I diritti sui personaggi sono oggi condivisi tra WildBrain, Sony Music Entertainment Japan e la famiglia dello stesso Schulz.<br><br><b>Perché è a Jeju</b><br>Il progetto nasce dalla volontà di unire la natura dell'isola all'immaginario dei Peanuts: invece di essere un parco a tema costruito artificialmente, gli spazi esterni sono pensati per valorizzare il paesaggio vulcanico e vegetale tipico di Jeju, integrandoci dentro le ambientazioni della striscia, come il celebre campo da baseball di Charlie Brown o l'albero mangia-aquiloni.<br><br><b>Cosa troveremo</b><br>La parte interna è un piccolo museo che ripercorre la storia del fumetto, con tavole originali, oggetti d'epoca e la biografia di Schulz, mentre la parte esterna è organizzata come un percorso tra ambientazioni fotografiche, tra cui un nido di legno sopraelevato a cinque metri da terra con vista sul parco, e una zona ispirata a un molo affacciato sul mare, con Snoopy ad aspettare i visitatori.", img:"Snoopy garden.jpg", tip:"Buona parte del percorso è all'aperto, quindi conviene evitare le ore più calde in estate o portare un ombrello nei giorni di pioggia, quando peraltro il biglietto viene scontato. L'ingresso non è economico, ma la qualità della cura del sito viene generalmente segnalata come superiore alla media di altre attrazioni a tema sull'isola.<br><br>Normalmente ci vogliono circa 2-3 ore per visitarlo con calma, tra padiglioni interni e giardini esterni. Chi ha spazio nell'itinerario tende a stare sulle 3 ore, includendo una sosta al caffè a tema, mentre chi va di corsa può cavarsela anche in 1-1,5 ore concentrandosi solo sui punti principali. Nel nostro caso avremo poco tempo, e valuteremo a seconda del ritmo della giornata se possiamo fare questa tappa e quanto tempo dedicarci.", move:"Partenza alle 18:00 verso Seopjikoji (circa 30 min).<br><b>Indirizzo per Naver:</b><br><br>제주특별자치도 서귀포시 성산읍 섭지코지로 107"},
    {n:"[18:30] Seopjikoji", d:"<b>Cosa significa il nome</b><br>Il nome deriva dal dialetto locale: seopji indica una lingua di terra stretta, koji significa promontorio. Si trova all'estremità orientale dell'isola ed è collegato alla costa principale solo da una lingua di terra sottile, quasi come fosse un'isola a sé.<br><br><b>Come si è formato</b><br>Il promontorio è di origine vulcanica: si è formato dall'accumulo di scoria, la cenere vulcanica rossastra espulsa da un'eruzione, mentre la celebre roccia Seondolbawi, il grande pilastro di roccia che si erge davanti alla costa, è un condotto vulcanico, cioè magma che si è solidificato all'interno del camino del vulcano stesso e col tempo è rimasto esposto dall'erosione.<br><br><b>La leggenda di Seondolbawi</b><br>La roccia è legata a un racconto popolare piuttosto malinconico. Il figlio più giovane del Re Drago del Mare dell'Est si innamorò perdutamente di una fata che scendeva dal cielo per fare il bagno in quelle acque, e volle sposarla. Il padre gli impose però di dimostrare la propria devozione restando fermo e paziente per cento giorni prima di dare il consenso. L'ultimo giorno però si scatenò una tempesta che impedì alla fata di scendere dal cielo per le nozze: il principe, disperato, morì di dolore e si trasformò in pietra, diventando appunto la roccia che vediamo oggi. Ancora oggi si racconta che pronunciare un giuramento d'amore davanti a quella roccia porti fortuna a chi si sposa.<br><br><b>Il collegamento con i K-drama</b><br>Seopjikoji è diventato molto popolare anche grazie a diverse produzioni televisive coreane, in particolare il celebre drama All In (2003), con Lee Byung-hun e Song Hye-kyo, che vi girò diverse scene, incluso un piccolo edificio simile a una chiesa costruito apposta per le riprese. L'edificio originale fu poi distrutto da un tifone e in seguito ricostruito in forma diversa, diventando comunque una tappa fotografica fissa per i visitatori.<br><br><b>Cosa vedremo</b><br>Il percorso costiero è semplice e adatto a tutti, con il faro bianco come punto panoramico principale, i campi di colza che fioriscono ogni aprile creando un contrasto giallo-blu molto fotografato, i cavalli di Jeju al pascolo e, con la bassa marea, formazioni rocciose particolari che normalmente restano sommerse. Lungo la costa è inoltre possibile avvistare le haenyeo, le tradizionali pescatrici subacquee di Jeju.", img:"seopjikoji.jpg", tip:"Il sito è molto ventoso quasi tutto l'anno, quindi conviene portare una giacca anche in giornate calde. Il giro completo dura 20-30 minuti circa fino al faro; l'obiettivo è essere qui al tramonto", move:"Si stima un tragitto di circa 10-15 minuti per raggiungere il ristorante per la cena in auto verso Geumdot.<br><b>Indirizzo per Naver:</b><br><br>제주특별자치도 서귀포시 성산읍 성산등용로 17"},
    {n:"[20:00] Cena: Geumdot Seongsan Black Pork", d:"Per cena il locale individuato è Geumdot Seongsan Black Pork. La specialità è la grigliata di maiale nero di Jeju, la carne tipica dell'isola, considerata da più fonti locali \"il vero affare\" del posto.", img:"Geumdot Seongsan Black Pork.jpg", tip:"Il maiale nero (heukdwaeji) è una specialità autoctona di Jeju, allevato sull'isola: la carne è più saporita e meno grassa rispetto al maiale normale.", move:"L'hotel è sulla stessa via (성산등용로), a pochissimi minuti a piedi o in auto.<br><b>Indirizzo per Naver:</b><br><br>제주특별자치도 서귀포시 성산읍 성산등용로 28"},
